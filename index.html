<style>/* Layout: 水面のような色の背景の上に、すりガラスのパネル（上部バー・サイドメニュー・カード）を浮かべる。
   スマホでは下部にガラスのタブバー。操作部品は大きめ（最小 40px）で押しやすく。 */
:root {
  --bg: #e9f1f8;
  --bg-1: #8fd3f4;          /* 背景の色だまり（水） */
  --bg-2: #a8b8ff;          /* 背景の色だまり（夕方の空） */
  --bg-3: #9ef0d8;          /* 背景の色だまり（浅瀬） */
  --glass: rgba(255, 255, 255, .56);
  --glass-strong: rgba(255, 255, 255, .78);
  --glass-edge: rgba(255, 255, 255, .85);
  --glass-shade: rgba(18, 40, 72, .10);
  --hairline: rgba(18, 40, 72, .10);
  --fill: rgba(255, 255, 255, .62);
  --fill-hover: rgba(255, 255, 255, .85);
  --ink: #0d1b2a;
  --muted: #55667a;
  --accent: #0a7aff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(10, 122, 255, .13);
  --ok: #1b8a4f; --ok-soft: rgba(52, 199, 89, .18);
  --warn: #a35a00; --warn-soft: rgba(255, 159, 10, .20);
  --err: #d0261f; --err-soft: rgba(255, 59, 48, .15);
  --info: #2c5f93; --info-soft: rgba(10, 122, 255, .10);
  --focus: rgba(10, 122, 255, .45);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-cert: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif;
  --font-num: "SF Mono", ui-monospace, "Menlo", "Consolas", monospace;
  --r-lg: 24px; --r: 16px; --r-sm: 12px;
  --blur: blur(28px) saturate(185%);
  --drawer: rgba(246, 250, 255, .95);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111d; --bg-1: #0b4f7a; --bg-2: #2b2a78; --bg-3: #075a52;
    --glass: rgba(28, 38, 56, .52); --glass-strong: rgba(30, 42, 62, .80); --glass-edge: rgba(255, 255, 255, .16); --glass-shade: rgba(0, 0, 0, .35);
    --hairline: rgba(255, 255, 255, .10); --fill: rgba(255, 255, 255, .08); --fill-hover: rgba(255, 255, 255, .14);
    --ink: #eef4fb; --muted: #9fb0c4; --accent: #3d9bff; --accent-ink: #ffffff; --accent-soft: rgba(61, 155, 255, .20);
    --ok: #4cd987; --ok-soft: rgba(48, 209, 88, .18); --warn: #ffbd4a; --warn-soft: rgba(255, 159, 10, .20);
    --err: #ff6b62; --err-soft: rgba(255, 69, 58, .20); --info: #9cc8ff; --info-soft: rgba(61, 155, 255, .14);
    --focus: rgba(61, 155, 255, .55); --drawer: rgba(18, 27, 42, .96); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111d; --bg-1: #0b4f7a; --bg-2: #2b2a78; --bg-3: #075a52;
  --glass: rgba(28, 38, 56, .52); --glass-strong: rgba(30, 42, 62, .80); --glass-edge: rgba(255, 255, 255, .16); --glass-shade: rgba(0, 0, 0, .35);
  --hairline: rgba(255, 255, 255, .10); --fill: rgba(255, 255, 255, .08); --fill-hover: rgba(255, 255, 255, .14);
  --ink: #eef4fb; --muted: #9fb0c4; --accent: #3d9bff; --accent-ink: #ffffff; --accent-soft: rgba(61, 155, 255, .20);
  --ok: #4cd987; --ok-soft: rgba(48, 209, 88, .18); --warn: #ffbd4a; --warn-soft: rgba(255, 159, 10, .20);
  --err: #ff6b62; --err-soft: rgba(255, 69, 58, .20); --info: #9cc8ff; --info-soft: rgba(61, 155, 255, .14);
  --focus: rgba(61, 155, 255, .55); --drawer: rgba(18, 27, 42, .96); color-scheme: dark;
}
/* 透明度を下げる設定の人・ガラス非対応のブラウザには、すりガラスでなく不透明な面を使う */
@media (prefers-reduced-transparency: reduce) { :root { --glass: var(--glass-strong); --blur: none; } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root { --glass: var(--glass-strong); } }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { /* 水面の色だまり */
  content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40% 35% at 12% 8%, var(--bg-1) 0%, transparent 70%),
    radial-gradient(45% 40% at 92% 18%, var(--bg-2) 0%, transparent 72%),
    radial-gradient(50% 45% at 70% 100%, var(--bg-3) 0%, transparent 70%),
    radial-gradient(35% 30% at 5% 85%, var(--bg-2) 0%, transparent 70%),
    var(--bg);
  opacity: .9;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--focus) !important; }
.num, td.num, .t { font-variant-numeric: tabular-nums; }

/* ---------- ガラスの共通面 ---------- */
.glass, .topbar, .nav, .card, .stat, .tablewrap, .modal, .notice, .onboard button {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 10px 30px var(--glass-shade);
}

/* ---------- 枠組み ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px;
  padding: 6px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); min-height: calc(var(--vh, 1vh) * 100); }
.app.pinned.side-left { grid-template-columns: 222px minmax(0, 1fr); }
.app.pinned.side-right { grid-template-columns: minmax(0, 1fr) 222px; }
.topbar { grid-column: 1 / -1; position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 30; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
  padding: 8px 10px; border-radius: 22px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.logo { width: 36px; height: 36px; border-radius: 9px; flex: 0 0 auto; box-shadow: 0 2px 8px rgba(10, 37, 64, .35); }
.brand-t { display: flex; flex-direction: column; min-width: 0; }
.brand small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand strong { font: 650 17px/1.25 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips, .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--hairline);
  background: var(--fill); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
button.chip { cursor: pointer; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.chip.quiet { color: var(--muted); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.err { background: var(--err-soft); border-color: transparent; color: var(--err); } .chip.err .dot { background: var(--err); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.lock { background: var(--ink); color: var(--bg); border-color: transparent; }
.ic { width: 20px; height: 20px; flex: 0 0 auto; } .ic.sm { width: 16px; height: 16px; }
.iconbtn.menu.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* 画面切り替えパネル: 「常に表示」なら列として並べ、そうでなければ左右から滑り出す */
.nav { padding: 10px; border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.app.pinned .nav { position: sticky; top: calc(var(--toph, 64px) + 18px); align-self: start; max-height: calc(calc(var(--vh, 1vh) * 100) - var(--toph, 64px) - 30px); }
.app.pinned.side-left .nav { grid-column: 1; grid-row: 2; }
.app.pinned.side-left main { grid-column: 2; grid-row: 2; }
.app.pinned.side-right .nav { grid-column: 2; grid-row: 2; }
.app.pinned.side-right main { grid-column: 1; grid-row: 2; }
.app:not(.pinned) main { grid-column: 1; grid-row: 2; }
main { position: relative; z-index: 0; }
.topbar { z-index: 30; }
.app:not(.pinned) .nav { -webkit-backdrop-filter: none; backdrop-filter: none; }
.app:not(.pinned) .nav { position: fixed; z-index: 60; top: max(10px, env(safe-area-inset-top)); bottom: max(10px, env(safe-area-inset-bottom)); width: min(300px, calc(calc(var(--vw, 1vw) * 100) - 40px));
  background: var(--drawer); transition: transform .42s cubic-bezier(.2, .9, .25, 1.05), opacity .3s; opacity: 0; pointer-events: none; }
.app.side-left:not(.pinned) .nav { left: max(10px, env(safe-area-inset-left)); transform: translateX(calc(-100% - 24px)); }
.app.side-right:not(.pinned) .nav { right: max(10px, env(safe-area-inset-right)); transform: translateX(calc(100% + 24px)); }
.app.nav-open .nav { transform: none !important; opacity: 1; pointer-events: auto; }
.scrim { position: fixed; inset: 0; z-index: 55; background: rgba(8, 18, 32, .38); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .3s; }
.app.nav-open .scrim { opacity: 1; pointer-events: auto; }
.navhead { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0 8px; }
.navhead b { font: 650 15px/1.3 var(--font-display); }
.navprefs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 0 2px; }
.pinbtn { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--fill); font-size: 12.5px; cursor: pointer; }
.pinbtn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pinbtn[disabled] { opacity: .45; cursor: not-allowed; }
.nav h6 { margin: 10px 12px 2px; font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.nav .seg.v { display: block; padding: 0; background: none; border: 0; box-shadow: none; border-radius: 0; overflow: visible; max-width: none; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 7px 12px; border-radius: 14px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
.nav a .ic { color: var(--accent); }
.nav a.on { color: var(--accent); font-weight: 700; }
.nav .lb { flex: 1 1 auto; }
.nav .badge { font-size: 11px; font-weight: 700; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--err); color: #fff; }
main { min-width: 0; padding-bottom: 16px; }
@media (max-width: 899px) { .hide-sm { display: none; } .brand { flex-basis: 160px; } }

/* ---------- 液体ガラスのセグメント（動きは JS のばね計算。静止中は平たいピル、押すと透明なガラスに） ---------- */
.seg { position: relative; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--track); border: 0; max-width: 100%;
  overflow: visible; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: background .25s, box-shadow .25s; }
.seg.pressing { background: var(--glass-strong); box-shadow: 0 6px 20px var(--glass-shade); }
@media (max-width: 600px) { .seg.h { overflow-x: auto; scrollbar-width: none; } .seg.h::-webkit-scrollbar { display: none; } }
.seg > .lens { --lift: 0; position: absolute; left: 0; top: 0; z-index: 0; border-radius: 999px; pointer-events: none; opacity: 0; transform-origin: 50% 50%; will-change: transform;
  background:
    linear-gradient(180deg, rgba(255,255,255, calc(.22 * var(--lift))), rgba(255,255,255, calc(.04 * var(--lift)))),
    rgba(var(--pill-rgb), calc(var(--pill-a) * (1 - var(--lift))));
  box-shadow:
    inset 0 0 0 calc(1.2px * var(--lift)) rgba(255,255,255, calc(.95 * var(--lift))),
    inset 0 1.5px 1px rgba(255,255,255, calc(.9 * var(--lift))),
    inset 0 -3px 8px rgba(0, 40, 80, calc(.10 * var(--lift))),
    0 calc(1px * (1 - var(--lift))) calc(3px * (1 - var(--lift))) rgba(10, 30, 60, calc(var(--pill-sh) * (1 - var(--lift)))),
    0 calc(10px * var(--lift)) calc(26px * var(--lift)) rgba(10, 30, 60, calc(.22 * var(--lift))); }
.seg > .lens.lifted { -webkit-backdrop-filter: blur(.4px) saturate(1.7) brightness(1.07); backdrop-filter: blur(.4px) saturate(1.7) brightness(1.07); }
html.refract .seg > .lens.lifted { backdrop-filter: url(#lgRefract) saturate(1.6) brightness(1.06); }
:root { --pill-rgb: 255, 255, 255; --pill-a: 1; --pill-sh: .16; --track: rgba(118, 118, 128, .14); }
:root[data-theme="dark"] { --pill-rgb: 255, 255, 255; --pill-a: .18; --pill-sh: 0; --track: rgba(255, 255, 255, .08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pill-rgb: 255, 255, 255; --pill-a: .18; --pill-sh: 0; --track: rgba(255, 255, 255, .08); } }
.nav .seg.v > .lens { border-radius: 14px; --pill-rgb: 10, 122, 255; --pill-a: .14; }
.segbtn { position: relative; z-index: 1; border: 0; background: none; min-height: 36px; padding: 6px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; touch-action: inherit; }
.segbtn { color: var(--ink); opacity: .78; }
.segbtn.on { color: var(--ink); font-weight: 650; opacity: 1; }
.seg.mini .segbtn { min-height: 28px; padding: 3px 11px; font-size: 12.5px; }
.seg.big .segbtn { min-height: 40px; padding: 8px 18px; font-size: 14px; }
.nav .seg.v { touch-action: pan-x; }

/* ---------- すべてのボタン: 光の帯が滑り、押した所からガラスが光る ---------- */
.btn, .chip, .iconbtn, .onboard button, .pinbtn { position: relative; overflow: hidden; isolation: isolate; transition: background .2s, transform .22s ease-out, box-shadow .2s, color .2s; }
.segbtn, .nav a { position: relative; transition: color .2s; }

/* 説明文は1行に畳む（押すと全文） */
.vhead { display: flex; align-items: flex-end; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.vhead > div:first-child { flex: 1 1 320px; min-width: 0; }
.vhead .lead { margin-bottom: 0; }
.fill { overflow: auto; }
.heats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 12px; align-items: start; }
.heats .tablewrap { margin: 0 !important; }

/* ---------- 見出し・ボタン・入力 ---------- */
h1.view { font: 700 24px/1.2 var(--font-display); letter-spacing: -.01em; margin: 2px 4px 4px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 4px 12px; max-width: 90ch; font-size: 13.5px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.bar .grow { flex: 1 1 auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--glass-edge); background: var(--fill); cursor: pointer; white-space: nowrap; line-height: 1.25; font-weight: 500;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 2px 8px var(--glass-shade); }
@media (hover: hover) { .btn:hover { background: var(--fill-hover); } }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
@media (hover: hover) { .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #fff); } }
.btn.tinted { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--err); }
.btn.danger.solid { background: var(--err); color: #fff; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.iconbtn { border: 1px solid var(--hairline); background: var(--fill); border-radius: 50%; width: 38px; height: 38px; cursor: pointer; display: inline-grid; place-items: center; color: var(--ink); }
@media (hover: hover) { .iconbtn:hover { background: var(--fill-hover); } }
.iconbtn[disabled] { opacity: .35; cursor: not-allowed; }
.card { border-radius: var(--r-lg); padding: 14px 16px; min-width: 0; }
.card h2 { font: 650 17px/1.3 var(--font-display); margin: 0 0 12px; }
.card h3 { font-size: 13px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 12px; }
.stat { border-radius: 20px; padding: 14px 16px; min-width: 0; overflow-wrap: anywhere; }
.stat b { display: block; font: 700 28px/1.2 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin: 2px 0; }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat.hl { background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 22%, var(--glass)), var(--glass)); border-color: color-mix(in srgb, var(--accent) 35%, var(--glass-edge)); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 500; padding-left: 4px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px 14px; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  border: 1px solid var(--hairline); background: var(--fill); border-radius: var(--r-sm); padding: 8px 12px; min-height: 40px; min-width: 0; width: 100%;
  transition: background .15s, border-color .15s; }
@media (hover: hover) { input:hover, select:hover, textarea:hover { background-color: var(--fill-hover); } }
input:focus, select:focus, textarea:focus { background-color: var(--glass-strong); border-color: var(--accent); }
select { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); vertical-align: -4px; }
input:disabled, select:disabled, textarea:disabled { opacity: .55; }
textarea { resize: vertical; line-height: 1.55; }
label.small { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 6px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--err-soft); color: var(--err); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.mute { background: var(--fill); color: var(--muted); }
.notice { border-radius: 18px; padding: 12px 16px; margin: 0 0 14px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.notice.warn { background: linear-gradient(var(--warn-soft), var(--warn-soft)), var(--glass); color: var(--warn); }
.notice.err { background: linear-gradient(var(--err-soft), var(--err-soft)), var(--glass); color: var(--err); }
.notice.info { background: linear-gradient(var(--info-soft), var(--info-soft)), var(--glass); color: var(--info); }
.notice.ok { background: linear-gradient(var(--ok-soft), var(--ok-soft)), var(--glass); color: var(--ok); }
.notice .grow { flex: 1 1 260px; }

/* ---------- 表 ---------- */
.tablewrap { overflow-x: auto; border-radius: 20px; }
.card .tablewrap { background: transparent; border-color: var(--hairline); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { table.t tr.flash td { animation: none; box-shadow: inset 0 0 0 2px var(--accent); } * { transition: none !important; } }
table.t input, table.t select { min-height: 36px; padding: 5px 9px; font-size: 14px; border-radius: 10px; }

@media (hover: hover) { table.t tbody tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); } }
.tin { min-width: 92px; font-family: var(--font-num); }

.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; }

.x[disabled] { opacity: .3; cursor: not-allowed; background: none; }
.lane { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }
.pager { display: flex; gap: 6px; align-items: center; margin-top: 12px; flex-wrap: wrap; }

/* ---------- 表彰ボード ---------- */
.mvp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.mvp .card.ok { background: linear-gradient(150deg, color-mix(in srgb, #ffd54a 30%, var(--glass)), var(--glass) 60%); border-color: color-mix(in srgb, #e0a800 45%, var(--glass-edge)); }
.mvp .who { font: 700 24px/1.3 var(--font-display); margin: 2px 0; }
.st-ok { color: var(--ok); font-weight: 700; } .st-up { color: var(--warn); font-weight: 700; } .st-none, .st-off { color: var(--muted); }
tr.off td { color: var(--muted); opacity: .75; }

/* ---------- モーダル・トースト ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 18, 32, .28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 100; padding: 16px; animation: fade .18s ease-out; }
.modal { background: var(--glass-strong); border-radius: 28px; width: min(720px, 100%); max-height: calc(calc(var(--vh, 1vh) * 100) - 32px); overflow: auto; padding: 24px; animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
.modal h2 { margin: 0 0 10px; font: 700 20px/1.3 var(--font-display); }

@keyframes fade { from { opacity: 0; } } @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; z-index: 120; width: min(460px, calc(calc(var(--vw, 1vw) * 100) - 32px)); }

.toast { background: rgba(20, 28, 40, .82); color: #fff; -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 12px 32px rgba(0,0,0,.25); animation: pop .22s ease-out; }
.toast span { flex: 1 1 auto; }
.toast.err { background: rgba(200, 38, 31, .9); }
.toast button { background: rgba(255,255,255,.18); border: 0; color: inherit; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.onboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; margin-top: 14px; }
.onboard button { text-align: left; padding: 20px; border-radius: var(--r-lg); cursor: pointer; transition: transform .12s, background .15s; }
@media (hover: hover) { .onboard button:hover { background: var(--glass-strong); } }
.onboard b { display: block; font: 650 17px/1.3 var(--font-display); margin-bottom: 6px; color: var(--accent); }
details.card > summary { cursor: pointer; font: 650 16px/1.3 var(--font-display); list-style: none; display: flex; align-items: center; gap: 8px; min-height: 28px; }
details.card > summary::before { content: "›"; display: inline-block; font-size: 22px; line-height: 1; color: var(--accent); transition: transform .2s; }
details.card[open] > summary::before { transform: rotate(90deg); }
details.card > summary::-webkit-details-marker { display: none; }
.kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--hairline); border-bottom-width: 2px; border-radius: 6px; padding: 0 5px; background: var(--fill); }
.big .t { font-size: 22px; } .big .t td { padding: 10px 12px; }
.issue { display: flex; gap: 8px; align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
.issue:last-child { border-bottom: 0; }
.issue button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; flex: 1 1 300px; }
.issue button.link:hover { text-decoration: underline; }
.certprev { border-radius: 6px; background: #fff; color: #000; overflow: hidden; margin: 0 auto; box-shadow: 0 10px 30px var(--glass-shade); }

/* ---------- 印刷（A4 縦 1枚。白地に細い線と文字だけのシンプルな構成。文字は改行させず自動で縮める） ---------- */
#print-root { display: none; }
.pgroot.measure { display: block !important; position: absolute; left: -10000px; top: 0; width: 196mm; }
.pgroot, .pgroot * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pgroot > * + * { break-before: page; page-break-before: always; }
.pgroot .pg { --ink: #14181d; --sub: #6b7480; --rule: #14181d; --hair: #dfe3e8; --acc: #0b4f8a;
  width: 100%; height: 266mm; padding: 3mm 7mm 2mm; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
  background: #fff; color: var(--ink); font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; break-inside: avoid; }
.pg-h { padding-bottom: 4mm; margin-bottom: 5mm; border-bottom: 1.2pt solid var(--rule); }
.pg-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; font-size: 8.5pt; color: var(--sub); letter-spacing: .06em; margin-bottom: 2.2mm; }
.pg-meet { flex: 1 1 auto; min-width: 0; }
.pg-date { white-space: nowrap; font-variant-numeric: tabular-nums; }
.pg-title { font-size: 21pt; font-weight: 800; letter-spacing: .02em; line-height: 1.15; }
.pg-sub { font-size: 10.5pt; color: var(--sub); margin-top: 1.6mm; font-variant-numeric: tabular-nums; }
.fitline { white-space: nowrap; overflow: hidden; }
.pg-b { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.pg-z { width: max-content; min-width: 100%; }
.pg-z.fxw { width: 100%; }                                   /* 列幅を固定した表のページは用紙の幅に合わせる */
.pg-z.fxw.two { grid-template-columns: 1fr 1fr; }
.pg-z.two { display: grid; grid-template-columns: repeat(2, max-content); column-gap: 9mm; row-gap: 5mm; align-items: start; justify-content: space-between; }
.pg-z.two .blk { margin: 0; }
.pg-f { display: flex; justify-content: space-between; gap: 6mm; font-size: 7.5pt; color: var(--sub); letter-spacing: .05em; border-top: .5pt solid var(--hair); padding-top: 2mm; margin-top: 3mm; white-space: nowrap; }
.pp { width: 100%; border-collapse: collapse; font-size: 11.5pt; }
.pp th, .pp td { white-space: nowrap; }
.pp th { font-size: 8pt; font-weight: 600; color: var(--sub); text-align: left; letter-spacing: .08em; padding: 0 2.6mm 1.6mm; border-bottom: .9pt solid var(--rule); }
.pp td { padding: 2mm 2.6mm; border-bottom: .4pt solid var(--hair); vertical-align: middle; }
.pp tbody tr:last-child td { border-bottom: 0; }
.pp .c { text-align: center; }
.pp .nm { font-weight: 700; font-size: 12pt; }
.pp .sm { font-size: 9.5pt; color: #3b434d; }
.pp .kana { display: inline; margin-left: 2.4mm; font-size: 7.5pt; font-weight: 400; color: var(--sub); }
.pp .tm { font-family: "SF Mono", "Menlo", "Consolas", monospace; font-weight: 700; font-size: 11.5pt; text-align: right; font-variant-numeric: tabular-nums; }
.pp td.c.tm { text-align: center; }
.pp .rk { text-align: center; width: 12mm; font-weight: 700; font-variant-numeric: tabular-nums; }
.pp .rk.st { font-size: 9pt; color: var(--sub); font-weight: 600; }
.rkb { display: inline-block; width: 6.6mm; height: 6.6mm; line-height: 6.6mm; border-radius: 50%; font-size: 9.5pt; font-weight: 800; text-align: center; color: #fff; }
.rkb.m1 { background: #c9a227; } .rkb.m2 { background: #9aa3ad; } .rkb.m3 { background: #b07040; }
.pp tr.emp td { color: #c0c6cd; }
.pp tr.emp td { padding-top: .7mm; padding-bottom: .7mm; }
.pp tr.emp .lane-c { transform: scale(.82); }
.pg-z.col1 .blk { margin-bottom: 4mm; }
.pp tr.brk td { color: var(--sub); font-style: italic; }
.blk { break-inside: avoid; page-break-inside: avoid; margin-bottom: 6mm; }
.blk-h { font-size: 11pt; font-weight: 800; letter-spacing: .04em; padding-bottom: 1.4mm; margin-bottom: 1mm; color: var(--acc); white-space: nowrap; }
.lane-c { display: inline-block; width: 6.4mm; height: 6.4mm; line-height: 6.1mm; border-radius: 50%; border: .8pt solid var(--ink); font-weight: 700; font-size: 9.5pt; text-align: center; }
.split2 { display: grid; grid-template-columns: repeat(2, max-content); gap: 9mm; justify-content: space-between; align-items: start; }
.pinfo { display: flex; flex-wrap: nowrap; gap: 0; margin-bottom: 6mm; white-space: nowrap; }
.pinfo span { padding: 0 4mm; border-left: .5pt solid var(--hair); }
.pinfo span:first-child { padding-left: 0; border-left: 0; }
.pinfo i { display: block; font-style: normal; font-size: 7.5pt; color: var(--sub); letter-spacing: .06em; margin-bottom: .6mm; }
.pinfo b { font-size: 12pt; font-variant-numeric: tabular-nums; }
.mvp-p { display: grid; grid-template-columns: repeat(2, max-content); gap: 12mm; margin-bottom: 9mm; }
.mvp-p div { border-top: 1.6pt solid #c9a227; padding-top: 2.4mm; white-space: nowrap; }
.mvp-p span { display: block; font-size: 8.5pt; font-weight: 600; color: var(--sub); letter-spacing: .08em; }
.mvp-p b { display: block; font-size: 20pt; margin: 1mm 0 .6mm; }
.mvp-p em { font-style: normal; font-size: 9.5pt; color: #3b434d; }
@media print {
  html, body { height: auto !important; min-height: 0 !important; background: #fff !important; color: #000 !important; }
  body::before { display: none !important; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; position: static !important; width: auto !important; }
  #print-root .cert { width: 100% !important; }
}
.cert .cl { position: absolute; z-index: 1; white-space: nowrap; overflow: hidden; padding: 0 24mm; box-sizing: border-box; transform: translateY(0); }
/* 証書の箱: 画面上（測る・プレビュー）は A4 の高さ、印刷では用紙の印刷できる範囲いっぱい */
.pgroot .cert { width: 100%; height: 266mm; }   /* どのブラウザ・プリンターの余白（Safari のヘッダ・フッタを含む）でも A4 1枚に収まる大きさ */
.cframe { position: absolute; inset: 0; z-index: 0; background-size: 100% 100%; background-repeat: no-repeat; background-position: center; pointer-events: none; }

.cert { position: relative; color: #000; font-family: var(--font-cert); text-align: center; overflow: hidden; break-inside: avoid; page-break-inside: avoid; }
.cert + .cert { break-before: page; page-break-before: always; }
.cert .title { font-weight: 700; letter-spacing: .3em; }
.cert .name { font-weight: 700; }

table.t td > b { white-space: nowrap; }

.qbtn.on { color: var(--accent); }

/* ---------- 印刷プレビュー（右側に常に表示。隠すこともできる） ---------- */
#print-root.pgroot { }

.hubgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; align-items: start; }

/* ---------- 文字の折り返し: 日本語は文節で折り返し、説明は省略せず全文を出す ---------- */
body { word-break: auto-phrase; line-break: strict; }
.lead, .notice, .issue, .hubt, .small, p { overflow-wrap: anywhere; }
.lead { display: block; cursor: default; }

.hubgrid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 390px), 1fr)); }   /* 書類名が1行で読める幅（狭いと「スケジュー/ル」のように途中で折れる） */

.nowrap { white-space: nowrap; }
/* ---------- フレームの選択 ---------- */

/* ---------- 組・レーンの入れ替え（ドラッグ＆ドロップ） ---------- */
.arr { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; align-items: start; }

  background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.55)); -webkit-backdrop-filter: blur(8px) saturate(1.7); backdrop-filter: blur(8px) saturate(1.7);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 16px 34px rgba(10,30,60,.28); }
.slot-empty { width: 100%; min-height: 42px; padding: 0 10px; text-align: left; border: 1px dashed var(--hairline); border-radius: 11px; background: transparent; color: var(--muted); font-size: 12.5px; cursor: pointer; }

@supports (-webkit-touch-callout: none) { @media (pointer: coarse) {

.btn:not(.primary):not(.tinted):not(.solid) { background: var(--btn-bg); border-color: var(--btn-edge); color: var(--btn-ink); font-weight: 600; -webkit-backdrop-filter: none; backdrop-filter: none;

/* ---------- プログラム: 1枚に4組・行の高さと文字の大きさを固定 ---------- */

.pp.ptab.fixrow .rkb { width: min(6.2mm, calc(var(--rowh) - .8mm)); height: min(6.2mm, calc(var(--rowh) - .8mm)); line-height: min(6.2mm, calc(var(--rowh) - .8mm)); font-size: 8.5pt; }

/* ---------- 判定ボタン ---------- */

.certhits { display: grid; gap: 4px; margin-top: 8px; max-height: 260px; overflow: auto; }

/* ---------- 簡易アクセス（アイコン＋名前） ---------- */
.qnav { display: flex; gap: 2px; padding: 3px; border-radius: 16px; background: var(--track); overflow-x: auto; scrollbar-width: none; max-width: 100%; flex: 0 1 auto; }

.qn .ic { width: 19px; height: 19px; color: var(--accent); }
.qn.on { background: var(--btn-bg); box-shadow: 0 1px 3px rgba(10, 30, 60, .16); color: var(--accent); }

/* 組のタブ: 組が多いときは折り返す（横にはみ出してプレビューに重ならない） */

.heattabs { min-width: 0; }
.ready { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.ritem { white-space: normal; min-width: 0; overflow-wrap: anywhere; }

/* ---------- 上部のバー: 左（メニュー・大会名）／中央（簡易ボタン・常に同じ位置）／右（状態） ---------- */
.topbar { display: grid !important; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px 12px; }

@media (max-width: 1279px) {

  .topbar .tr { grid-column: 2; grid-row: 1; }

}
@media (max-width: 600px) { .topbar { grid-template-columns: minmax(0, 1fr); } .topbar .tr { grid-column: 1; grid-row: 2; justify-content: flex-start; } .topbar .qnav { grid-row: 3; justify-self: stretch; } .topbar .trow2 { grid-row: 4; } }
/* 簡易ボタンのガラス（押している間だけ動く） */

.arh-h { align-items: center; }

.arrs { margin-bottom: 10px; padding: 10px 12px; }

/* ---------- 記録入力: 大きく見やすく・押しやすく ---------- */

@container (max-width: 700px) { table.pt tbody tr { grid-template-columns: 44px minmax(0, 1fr) 182px !important; } }
/* 上部バーの高さを画面によって変えない（簡易ボタンの位置を固定するため、大会名・画面名は1行） */
.topbar .brand small, .topbar .brand strong { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; display: block; }

/* ---------- 上部バーの通知（決まった枠・高さは変わらない） ---------- */
.topbar .trow2 { position: relative; }
.tnote { flex: 1 1 300px; min-width: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--track); font-size: 13px; overflow: hidden; transition: background .2s; }

.tn-btn { flex: 0 0 auto; height: 28px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--btn-bg); color: var(--accent); font-weight: 700; font-size: 12.5px; cursor: pointer; }

.toasts { display: none !important; }
.topdesc { display: none !important; }
/* ---------- ボタンはすべて丸い形 ---------- */
.btn, .jb, .chip, .qn, .tn-btn, .hlock, .chit .btn, .slot-empty, .pmode, select.progsel { border-radius: 999px !important; }
.lockb, .iconbtn { border-radius: 50% !important; }

}

/* ---------- 本部ボード: 進行と得点を最初に ---------- */

.bellbtn .ic { width: 18px; height: 18px; }

/* 簡易ボタンも丸く（帯もガラスも丸） */
.qnav.seg { border-radius: 999px !important; padding: 4px; }
.qnav.seg > .lens { border-radius: 999px !important; }

.tm-hist { background: var(--glass); border-radius: 16px; padding: 10px 14px; }
.tm-hist summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.tm-hrow { display: flex; gap: 14px; align-items: center; width: 100%; padding: 10px 6px; border: 0; border-bottom: 1px solid var(--hairline); background: none; color: var(--ink); font: inherit; font-size: 16px; text-align: left; cursor: pointer; }
.tm-hrow .tm-hat { margin-left: auto; color: var(--muted); font-family: var(--font-num); }
.tm-ov { position: fixed; inset: 0; z-index: 50; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; touch-action: manipulation; font-family: var(--font-ui); }
.tm-qrbox { width: min(92vw, 60vh); width: min(92vw, 60dvh); aspect-ratio: 1; }
.tm-qrbox svg { width: 100%; height: 100%; display: block; }
.tm-qrinfo { text-align: center; max-width: 92vw; }
.tm-qrinfo b { font-size: 26px; }
.tm-qrt { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 6px 0; font-family: var(--font-num); font-size: 20px; font-weight: 700; }
.tm-qrt small { font-size: 12px; color: #555; margin-right: 4px; font-family: var(--font-ui); }
.tm-qrinfo p { margin: 4px 0; font-size: 14px; color: #444; }
.tm-code { font-family: var(--font-num); font-size: 13px; color: #333; word-break: break-all; user-select: text; -webkit-user-select: text; }
.tm-ovbtns { display: flex; gap: 10px; width: min(560px, 92vw); }
.tm-ovbtns .tm-btn { flex: 1; }
.tm-ov .tm-btn:not(.primary) { background: #f1f3f6; color: #000; }
@media (orientation: landscape) { .tm-lanes { grid-template-columns: repeat(var(--tmcl, 3), minmax(0, 1fr)); } }
@media (orientation: landscape) and (min-aspect-ratio: 5/4) {
  .tm-ov:not(.tm-set) { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr auto; align-items: center; justify-items: center; }
  .tm-ov:not(.tm-set) .tm-qrbox { width: min(56vw, 88vh); width: min(56vw, 88dvh); grid-row: 1 / 3; }
}
.tm-set { background: rgba(0, 0, 0, .35); }
.tm-setbox { background: #fff; color: #000; border-radius: 22px; padding: 20px 22px; width: min(560px, 94vw); max-height: 92vh; overflow: auto; box-sizing: border-box; }
.tm-setbox h2 { margin: 0 0 12px; }
.tm-setbox label { display: block; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
.tm-setbox select { font-size: 20px; padding: 6px 10px; border-radius: 10px; }
.tm-setbox p { font-size: 14px; color: #333; margin: 6px 0; }

/* パソコン側の読み込みダイアログ */
.modal.tr-modal { width: min(980px, 100%); }
.tr-body { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.tr-body[hidden], .tr-result[hidden] { display: none; }
.tr-cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
.tr-cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tr-cam video.mirror { transform: scaleX(-1); }
.tr-aim { position: absolute; left: 50%; top: 46%; width: 56%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid rgba(255, 255, 255, .85); border-radius: 18px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .18); pointer-events: none; }
.tr-msg { position: absolute; left: 10px; right: 10px; bottom: 10px; margin: 0; padding: 8px 12px; border-radius: 12px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 14px; text-align: center; }
.tr-msg.ng { background: rgba(208, 38, 31, .9); }
.tr-side .field { display: block; margin: 12px 0; }
.tr-side .field > span:first-child { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.tr-row { display: flex; gap: 8px; }
.tr-row input { flex: 1; min-width: 0; font-family: var(--font-num); }
.tr-help summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.tr-urlqr { width: 150px; margin: 8px 0; }
.tr-urlqr svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.tr-help code { word-break: break-all; user-select: text; -webkit-user-select: text; }
.tr-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 17px; }
.tr-t { width: 100%; }
.tr-t td.nm small { display: block; color: var(--muted); font-size: 12px; }
.tr-t tr.emp td { color: var(--muted); }
.tr-t tr.same td { opacity: .7; }
.tr-t td.tm { font-family: var(--font-num); white-space: nowrap; }
.tr-t input[type=checkbox] { width: 22px; height: 22px; }
.tr-done { font-size: 18px; padding: 12px 0; }

/* 上部のお知らせ: 1行に入らない文は2行で全文を出す */
.tnote .tn-msg.two { white-space: normal; text-overflow: clip; font-size: 11.5px; line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: anywhere; }
/* 札（pill）は縮めない（文字が切れて隣と重なるのを防ぐ） */
.bar .pill, .bar.rbar.mixed > span.pill { flex-shrink: 0; }
/* 小さい丸ボタン: 丸＋名前が入る高さにする（高さ 46px 固定だと名前の下が切れる） */
.btn.rb.rb-s:not(.tround *) { height: auto !important; min-height: 46px !important; }
.rchips.tight { gap: 4px; } .rchips.tight .rchip { font-size: 11px; padding: 3px 8px; }
.fields > .field.wide { grid-column: span 2; } .fields > .field.full { grid-column: 1 / -1; }
</style>

<script>/* ============================================================================
 * スイム大会運営アプリ — 計算エンジン（DOM非依存）
 *  Excel「大会運営ブック」の数式と「表彰者算出マクロ」のロジックを移植
 * ========================================================================== */
const Core = (() => {
  'use strict';

  // ---------------------------------------------------------------- 文字の正規化
  function toHalf(s) {
    return String(s)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[．。]/g, '.').replace(/[：]/g, ':').replace(/[，、]/g, '.')
      .replace(/　/g, ' ')
      .replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  }
  // Excel の文字列比較（JIS順）に近い日本語照合
  const JA = (typeof Intl !== 'undefined' && Intl.Collator) ? new Intl.Collator('ja', { sensitivity: 'accent' }) : { compare: (a, b) => a < b ? -1 : a > b ? 1 : 0 };
  const str = v => (v === null || v === undefined) ? '' : String(v).trim();
  // 照合用キー（全角/半角・空白・波ダッシュ・m/M の違いを吸収）
  function normKey(s) {
    let t = str(s);
    try { t = t.normalize('NFKC'); } catch (e) { /* ignore */ }
    return t.replace(/[\s　]+/g, '').replace(/[〜～~]/g, '~').replace(/[ー－−‐-]/g, '-').toLowerCase();
  }
  const SPECIAL = { 'DNS': 'DNS', 'DSQ': 'DSQ', '棄権': '棄権', '失格': '失格' };

  // ---------------------------------------------------------------- タイム
  /**
   * 入力されたタイムを秒に変換する。
   *  28.78 / 1:32.22 / 1.32.22 / 00.30.00 / 1分32秒22 / 132.22(=1:32.22) / Excel時刻値 / 全角
   *  返り値 {kind:'empty'|'time'|'special'|'error', sec, special, msg}
   */
  function parseTime(raw, opt) {
    const rule = (opt && opt.threeDigit) || 'mss';
    if (raw === null || raw === undefined) return { kind: 'empty' };
    if (typeof raw === 'number') {
      if (!isFinite(raw) || raw <= 0) return { kind: 'error', msg: '0以下の数値です' };
      if (Number.isInteger(raw) && raw >= 1000 && raw < 1000000) return parseTime(String(raw), opt);   // Excelの数値セルに 2534 と入っていても 25.34
      let sec;
      if (raw < 1) sec = raw * 86400;
      else if (raw >= 100 && rule === 'mss') {
        const m = Math.floor(raw / 100), r = raw - m * 100;
        if (r >= 60) return { kind: 'error', msg: '秒が60以上です' };
        sec = m * 60 + r;
      } else sec = raw;
      return finish(sec);
    }
    let s = toHalf(str(raw)).replace(/\s+/g, '');
    if (!s) return { kind: 'empty' };
    const up = s.toUpperCase();
    if (SPECIAL[up] || SPECIAL[s]) return { kind: 'special', special: SPECIAL[up] || SPECIAL[s] };
    // 1分32秒22 / 32秒22 / 32秒
    s = s.replace(/["”″]/g, '.').replace(/['’′]/g, ':');
    let m = s.match(/^(?:(\d+)分)?(\d+(?:\.\d+)?)秒(\d*)$/);
    if (m) {
      const min = m[1] ? +m[1] : 0, sc = +m[2], cs = m[3] ? +('0.' + m[3]) : 0;
      if (sc >= 60 && m[1]) return { kind: 'error', msg: '秒が60以上です' };
      return finish(min * 60 + sc + cs);
    }
    if (s.indexOf(':') >= 0) {
      const p = s.split(':');
      if (p.length === 2 && /^\d+$/.test(p[0]) && /^\d+(\.\d+)?$/.test(p[1])) {
        const sec = +p[1];
        if (sec >= 60) return { kind: 'error', msg: '秒が60以上です' };
        return finish(+p[0] * 60 + sec);
      }
      if (p.length === 3 && p.every(x => /^\d+$/.test(x))) { // 1:32:22 → 1分32秒22
        if (+p[1] >= 60) return { kind: 'error', msg: '秒が60以上です' };
        return finish(+p[0] * 60 + +p[1] + +('0.' + p[2]));
      }
      return { kind: 'error', msg: '読み取れない形式です' };
    }
    const parts = s.split('.');
    if (!parts.every(x => /^\d+$/.test(x))) return { kind: 'error', msg: '数字以外の文字があります' };
    if (parts.length === 3) { // 00.30.00 / 1.05.32
      if (+parts[1] >= 60) return { kind: 'error', msg: '秒が60以上です' };
      return finish(+parts[0] * 60 + +parts[1] + +('0.' + parts[2]));
    }
    if (parts.length > 3) return { kind: 'error', msg: '区切りが多すぎます' };
    const n = +s;
    if (n <= 0) return { kind: 'error', msg: '0以下です' };
    // 点なしの4〜6桁は、下2桁を1/100秒として読む（速く打つときの書き方: 2534 → 25.34、10530 → 1:05.30、123456 → 12:34.56）
    if (parts.length === 1 && /^\d{4,6}$/.test(s)) {
      const cc = +s.slice(-2), rest = s.slice(0, -2), ss = +rest.slice(-2), mm = rest.length > 2 ? +rest.slice(0, -2) : 0;
      if (rest.length > 2 && ss >= 60) return { kind: 'error', msg: '秒が60以上です（例: 1:05.30 は 10530）' };
      return finish(mm * 60 + ss + cc / 100);
    }
    if (n >= 100 && rule === 'mss') {
      const mm = Math.floor(+parts[0] / 100), r = n - mm * 100;
      if (r >= 60) return { kind: 'error', msg: '秒が60以上です（例: 1:32.22 は 132.22）' };
      return finish(mm * 60 + r);
    }
    return finish(n);

    function finish(sec) {
      sec = Math.round(sec * 100) / 100;
      if (!(sec > 0)) return { kind: 'error', msg: '0以下です' };
      if (sec >= 3600) return { kind: 'error', msg: '60分以上です' };
      return { kind: 'time', sec };
    }
  }
  const cs = sec => Math.round(sec * 100);
  function fmtTime(sec) { // 1:32.22 / 28.78
    if (sec === null || sec === undefined || !(sec > 0)) return '';
    const c = cs(sec), m = Math.floor(c / 6000), r = c - m * 6000;
    const ss = Math.floor(r / 100), cc = r % 100;
    return (m > 0 ? m + ':' + String(ss).padStart(2, '0') : String(ss)) + '.' + String(cc).padStart(2, '0');
  }
  function fmtTimeJa(sec) { // Excel と同じ「0分28秒78」
    if (!(sec > 0)) return '';
    const c = cs(sec), m = Math.floor(c / 6000), r = c - m * 6000;
    return m + '分' + String(Math.floor(r / 100)).padStart(2, '0') + '秒' + String(r % 100).padStart(2, '0');
  }
  function fmtClock(sec) { // 秒(0時起点) → h:mm
    if (sec === null || sec === undefined || isNaN(sec)) return '';
    const t = Math.round(sec / 60), h = Math.floor(t / 60), m = t % 60;
    return h + ':' + String(m).padStart(2, '0');
  }
  function parseClock(v) { // "8:45" / 0.364 → 秒
    if (typeof v === 'number') return v < 1 ? Math.round(v * 86400) : null;
    const m = toHalf(str(v)).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (m[3] ? +m[3] : 0) : null;
  }
  function parseDuration(v) { // "1:30" (分:秒) / 90 → 秒
    if (typeof v === 'number') return v < 1 ? Math.round(v * 86400) : v;
    const s = toHalf(str(v));
    let m = s.match(/^(\d+):(\d{1,2})$/);
    if (m) return (+m[1]) * 60 + (+m[2]);
    if (/^\d+(\.\d+)?$/.test(s)) return +s;
    return null;
  }
  function fmtDuration(sec) { if (!(sec >= 0)) return ''; const m = Math.floor(sec / 60), s = Math.round(sec - m * 60); return m + ':' + String(s).padStart(2, '0'); }

  // ---------------------------------------------------------------- 既定設定
  function defaultSettings() {
    return {
      meetName: 'ジュニアスイムフェスティバル',
      events: ['女子 25M 板キック', '男子 25M 板キック', '女子 25M 自由形', '男子 25M 自由形', '女子 50M 自由形', '男子 50M 自由形',
        '女子 25M 背泳ぎ', '男子 25M 背泳ぎ', '女子 50M 背泳ぎ', '男子 50M 背泳ぎ', '女子 25M 平泳ぎ', '男子 25M 平泳ぎ',
        '女子 50M 平泳ぎ', '男子 50M 平泳ぎ', '女子 25M バタフライ', '男子 25M バタフライ', '女子 50M バタフライ', '男子 50M バタフライ',
        '女子 4×25M フリーリレー', '男子 4×25M フリーリレー', '混合 4×25M フリーリレー'],
      categories: ['6歳以下', '7〜8歳', '9〜10歳', '11〜12歳', '13〜14歳', '15〜16歳', '17〜18歳'],
      clubs: [{ name: 'Aクラブ', target: '' }, { name: 'Bクラブ', target: '' }, { name: 'Cクラブ', target: '' }],
      lanes: [3, 2, 4, 1, 5],
      laneOrder: 'excel',      // excel: Excelと同じ（組内の遅い順に優先レーン） / fast: 組内の速い順に優先レーン
      minPerHeatInd: 3, minPerHeatRelay: 3,
      combined: [],            // [{name, pairs:[{event,cat}×3]}]
      threeDigit: 'mss',
      kanaStyle: 'kata',       // フリガナの表記: kata = カタカナ / hira = ひらがな
      schedule: {
        title: '競技進行スケジュール',
        doorOpen: '7:30', warmup: '7:55 ～ 8:25', opening: '8:30', start: '8:45', closing: '10:50 (予定)', exit: '11:15',
        cycleSec: 0, intervalMin: 2, breakMin: 45,
        heat25: 60, heat50: 90, heat100: 120, heat200: 210, heatRelay: 120
      },
      points: { ind: [6, 5, 4, 3, 2, 1, '', '', '', ''], indFinish: '', relayMult: 2 },
      prizeMaxRank: 10,
      maxEventsPerPerson: 2,
      cert: { title: '記　録　証', lines: ['あなたは本大会において', '最後まで力強い泳ぎを見せ', '見事完泳されました', 'よってその健闘を讃えこれを証します'], date: '', organizer: '大会主催者名　印', printRecord: true },
      award: { title: '賞　状', lines: ['あなたは本大会において', '極めて優秀な成績を収められました', 'よってその健闘と栄誉を讃え', 'これを賞します'], date: '', organizer: '大会主催者名　印' },
      print: { scale: 100, offsetTop: 0, offsetLeft: 0, progMode: 'blank', certKana: true },   // progMode: blank = 記録欄を空けて手書き用 / result = 記録入り
      dashboard: { capacity: 90, target: 80, price: 3000, tax: 10 }
    };
  }
  function defaultAward() {
    const ev = [['25m板キック', 18, 20], ['25mバタフライ', 19, 21], ['25m背泳ぎ', 21, 22], ['25m平泳ぎ', 23, 25], ['25m自由形', 18, 20],
      ['50mバタフライ', 39.1, 43.6], ['50m背泳ぎ', 40.5, 45.1], ['50m平泳ぎ', 45.5, 50.6], ['50m自由形', 36.6, 40.7],
      ['100m個人メドレー', 110, 110], ['200m個人メドレー', 192.9, 214.7]];
    const events = [];
    for (let i = 0; i < 15; i++) {
      const d = ev[i];
      events.push({ id: 'ae' + (i + 1), name: d ? d[0] : '', baseM: d ? fmtTime(d[1]) : '', baseF: d ? fmtTime(d[2]) : '', mvp: true });
    }
    const cn = ['8歳以下', '9～10歳', '11～12歳', '13歳以上'];
    const cats = [];
    for (let k = 0; k < 8; k++) cats.push({ name: cn[k] || '', mvp: true, exc: true });
    return { cStart: 1, cEnd: 8, rankMode: '1〜3位すべて', minRate: 0, fold: '枠を残して表示', cats, events, inputs: {} };
  }
  function emptyState() {
    return { app: 'swim-meet', schema: 1, rev: 0, settings: defaultSettings(), entries: [], relays: [], schedule: [], award: defaultAward(), ui: {} };
  }

  // ---------------------------------------------------------------- 共通
  const isRelayName = s => str(s).indexOf('リレー') >= 0;
  function laneList(S) {
    const out = [];
    (S.lanes || []).forEach(v => { const n = parseInt(toHalf(str(v)), 10); if (n > 0 && out.indexOf(n) < 0) out.push(n); });
    return out.length ? out : [1];
  }
  function combinedOf(S, event, cat) {
    const rules = S.combined || [];
    const maxP = Math.max(3, ...rules.map(r => (r.pairs || []).length));
    for (let p = 0; p < maxP; p++) {
      for (const r of rules) {
        const pr = (r.pairs || [])[p];
        if (r.name && pr && str(pr.event) === event && str(pr.cat) === cat && event && cat) return str(r.name);
      }
    }
    return '';
  }
  const evSex = name => { const m = str(name).match(/^(男子|女子|混合)/); return m ? m[1] : ''; };

  // ---------------------------------------------------------------- 組・レーン編成（Excel AC〜AN 列）
  function assignHeats(items, S, minPer) {
    const lanes = laneList(S), L = lanes.length;
    minPer = Math.max(1, Math.min(parseInt(minPer, 10) || 1, L));
    const catOrder = c => { const i = S.categories.indexOf(c); return i >= 0 ? i + 1 : 99; };
    const groups = new Map();
    items.forEach(it => {
      if (!it.event) return;
      const key = it.combined ? it.combined : S.heatGroup === 'event' ? it.event : it.event + '_' + it.cat;   // heatGroup: event = 区分をまぜて記録順に組分け
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    });
    const ginfo = new Map();
    groups.forEach((arr, key) => {
      arr.sort((a, b) => (b.H - a.H) || a.tie(b));
      const AD = arr.length, AF = Math.ceil(AD / L), AJ = ((AD - 1) % L) + 1;
      const AK = AF > 1 ? Math.max(AJ, minPer) : AD;
      const it0 = arr[0];
      ginfo.set(key, { arr, AD, AF, AK, combined: !!it0.combined, event: it0.event, AG: it0.combined ? 99 : catOrder(it0.cat), cat: it0.cat });
    });
    // 同じ種目の中で、区分順（AG）の小さい区分の組数を前に積む
    ginfo.forEach(g => {
      let AI = 0;
      if (!g.combined) {
        ginfo.forEach(o => {
          if (o === g || o.combined || o.event !== g.event) return;
          if (o.AG < g.AG || (o.AG === g.AG && g.AG === 99 && o.cat < g.cat)) AI += o.AF;
        });
      }
      g.AI = AI;
      const heatsLocal = {};
      g.arr.forEach((it, idx) => {
        const AE = idx + 1;
        const AL = AE <= g.AK ? 1 : 1 + Math.ceil((AE - g.AK) / L);
        const AM = AE <= g.AK ? AE : ((AE - g.AK - 1) % L) + 1;
        it.heat = AI + (S.heatSort === 'fast' ? g.AF - AL + 1 : AL); it._AM = AM;   // heatSort: fast = 速い組から
        (heatsLocal[AL] = heatsLocal[AL] || []).push(it);
      });
      Object.keys(heatsLocal).forEach(k => {
        const hs = heatsLocal[k], n = hs.length;
        hs.forEach(it => {
          const pos = S.laneOrder === 'fast' ? (n - it._AM + 1) : it._AM;
          it.lane = lanes[pos - 1] || null;
        });
      });
    });
  }

  // 手で入れ替えた組・レーン（プログラム画面のドラッグ＆ドロップ）を自動の割り当ての上に重ねる
  //  seat = { p: プログラム名, h: 組, l: レーン }。種目・区分が変わってプログラム名が違えば無視して自動に戻す。
  //  固定した人と同じ場所に自動の人が来たら、空いているレーン（同じ組 → 他の組 → 新しい組）へずらす。最後に組番号を詰める。
  function applySeats(items, S, srcKey) {
    const lanes = laneList(S);
    const byProg = new Map();
    items.forEach(it => { if (!it.program || !it.heat) return; if (!byProg.has(it.program)) byProg.set(it.program, []); byProg.get(it.program).push(it); });
    byProg.forEach((arr, prog) => {
      const seatOf = it => { const st = it[srcKey] && it[srcKey].seat; return st && st.p === prog && Number.isInteger(+st.h) && +st.h >= 1 && lanes.indexOf(+st.l) >= 0 ? { h: +st.h, l: +st.l } : null; };
      if (!arr.some(seatOf)) return;
      const used = new Map(), key = (h, l) => h + '|' + l;
      const fixed = [], auto = [];
      arr.forEach(it => { const st = seatOf(it); if (st && !used.has(key(st.h, st.l))) { it.heat = st.h; it.lane = st.l; it.seatFixed = true; used.set(key(st.h, st.l), it); fixed.push(it); } else auto.push(it); });
      const pending = [];
      auto.forEach(it => { if (it.lane && !used.has(key(it.heat, it.lane))) used.set(key(it.heat, it.lane), it); else pending.push(it); });
      pending.forEach(it => {
        const maxH = Math.max(0, ...arr.filter(x => used.has(key(x.heat, x.lane)) && used.get(key(x.heat, x.lane)) === x).map(x => x.heat));
        const order = [it.heat].concat(Array.from({ length: maxH }, (_, i) => i + 1).filter(h => h !== it.heat));
        let spot = null;
        for (const h of order) { const l = lanes.find(l => !used.has(key(h, l))); if (l !== undefined) { spot = { h, l }; break; } }
        if (!spot) spot = { h: maxH + 1, l: lanes[0] };
        it.heat = spot.h; it.lane = spot.l; it.seatMoved = true; used.set(key(spot.h, spot.l), it);
      });
      const hs = [...new Set(arr.map(it => it.heat))].sort((a, b) => a - b), ren = new Map(hs.map((h, i) => [h, i + 1]));
      arr.forEach(it => { it.heat = ren.get(it.heat); });
    });
  }

  // 公式順位（同じ種目・区分の中で） Excel P/Q 列
  function assignRanks(items) {
    const g = new Map();
    items.forEach(it => {
      it.rank = null; it.rankOrder = null;
      if (!(it.I < 9999)) return;
      const k = it.event + '\u0001' + it.cat;
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(it);
    });
    g.forEach(arr => {
      arr.sort((a, b) => (a.I - b.I) || a.tie(b));
      arr.forEach((it, i) => {
        let r = i + 1;
        if (i > 0 && cs(arr[i - 1].I) === cs(it.I)) r = arr[i - 1].rank;
        it.rank = r; it.rankOrder = i + 1;
      });
    });
  }

  function statusOf(judge, officialParse, hasOfficialRaw) {
    if (judge === '棄権' || (officialParse.kind === 'special' && (officialParse.special === 'DNS' || officialParse.special === '棄権'))) return '棄権';
    if (judge === '失格' || (officialParse.kind === 'special' && (officialParse.special === 'DSQ' || officialParse.special === '失格'))) return '失格';
    if (judge === '対象外') return '対象外';          // 記録はあっても順位・得点・表彰の対象にしない
    if (!hasOfficialRaw) return '未入力';
    return '完泳';
  }

  // ---------------------------------------------------------------- 個人
  function computeIndividuals(state) {
    const S = state.settings, opt = { threeDigit: S.threeDigit };
    const pts = S.points || {};
    const rows = state.entries.map((e, idx) => {
      const event = str(e.event), cat = str(e.cat);
      const pe = parseTime(e.entryTime, opt), pf = parseTime(e.officialTime, opt);
      const judge = str(e.judge);
      const hasF = !(pf.kind === 'empty');
      const status = str(e.name) ? statusOf(judge, pf, hasF) : '';
      const H = pe.kind === 'time' ? pe.sec : 9999;
      const I = (pf.kind === 'time' && !judge) ? pf.sec : 9999;
      const it = {
        e, idx, id: e.id, event, cat, name: str(e.name), club: str(e.club), judge, pe, pf, H, I, status,
        combined: event && cat ? combinedOf(S, event, cat) : '',
        tie(o) { return this.idx - o.idx; }
      };
      it.program = it.combined || event;
      it.np = splitName(it.name, S.kanaStyle);     // { kanji: 苗字　名前, kana: フリガナ（設定の表記） }
      // 表示用タイム（Excel S列）
      it.officialText = pf.kind === 'time' ? fmtTimeJa(pf.sec) : (pf.kind === 'special' ? pf.special : (hasF ? str(e.officialTime) : ''));
      return it;
    });
    assignHeats(rows, S, S.minPerHeatInd);
    applySeats(rows, S, 'e');
    assignRanks(rows);
    const medalCount = new Map();
    rows.forEach(it => {
      // 得点（Excel W列）
      if (it.rank) {
        const p = num(pts.ind && pts.ind[it.rank - 1]);
        it.points = p + num(pts.indFinish);
      } else it.points = null;
      // 速報用
      it.flashTime = it.status === '棄権' ? '棄権' : (it.pf.kind === 'special' ? '' : (it.pf.kind === 'time' ? fmtTimeJa(it.pf.sec) : it.officialText));
      it.flashRank = it.status === '失格' ? '失格' : it.status === '対象外' ? '対象外' : (it.rank ? it.rank + '位' : '');
      // メダル発注用（Excel X列: 区分×種目ごとの申込順）
      if (it.name && it.cat && it.event) {
        const k = it.cat + '\u0001' + it.event;
        medalCount.set(k, (medalCount.get(k) || 0) + 1);
        it.medalOrder = medalCount.get(k);
      } else it.medalOrder = null;
    });
    return rows;
  }
  const num = v => { const n = parseFloat(toHalf(str(v))); return isFinite(n) ? n : 0; };

  // ---------------------------------------------------------------- リレー
  function computeRelays(state) {
    const S = state.settings, opt = { threeDigit: S.threeDigit };
    const pts = S.points || {}, mult = num(pts.relayMult) || 1;
    const rows = state.relays.map((r, idx) => {
      const event = str(r.event), cat = str(r.cat);
      const pe = parseTime(r.entryTime, opt), pf = parseTime(r.officialTime, opt);
      const judge = str(r.judge);
      const hasF = pf.kind !== 'empty';
      const team = str(r.team), mark = str(r.mark);
      const members = (r.members || []).map(str);
      const it = {
        r, idx, id: r.id, event, cat, team, mark, judge, pe, pf, members,
        teamDisp: team ? team + (mark ? ' ' + mark : '') : '',
        H: pe.kind === 'time' ? pe.sec : 9999,
        I: (pf.kind === 'time' && !judge) ? pf.sec : 9999,
        status: team ? statusOf(judge, pf, hasF) : '',
        combined: event && cat ? combinedOf(S, event, cat) : '',
        tie(o) { return JA.compare(this.teamDisp, o.teamDisp) || this.idx - o.idx; }
      };
      it.program = it.combined || event;
      it.memberNames = members.map(m => splitName(m, S.kanaStyle));     // { kanji, kana, ... } ×4
      it.memberText = members[0] ? it.memberNames.map(m => m.kanji).join(' / ') : '';
      it.memberFlash = team ? it.memberNames.filter(m => m.kanji).map(m => m.kanji.replace(/　/g, '')).join('・') : '';
      it.officialText = pf.kind === 'time' ? fmtTimeJa(pf.sec) : (pf.kind === 'special' ? pf.special : (hasF ? str(r.officialTime) : ''));
      return it;
    });
    assignHeats(rows, S, S.minPerHeatRelay);
    applySeats(rows, S, 'r');
    assignRanks(rows);
    const medal = new Map();
    rows.forEach(it => {
      if (it.rank) it.points = it.status !== '完泳' ? 0 : num(pts.ind && pts.ind[it.rank - 1]) * mult + num(pts.indFinish) * mult;
      else it.points = null;
      it.flashTime = it.status === '棄権' ? '棄権' : (it.pf.kind === 'special' ? '' : (it.pf.kind === 'time' ? fmtTimeJa(it.pf.sec) : it.officialText));
      it.flashRank = it.status === '失格' ? '失格' : (it.rank ? it.rank + '位' : '');
      if (it.team && it.cat && it.event) {
        const k = it.cat + '\u0001' + it.event;
        medal.set(k, (medal.get(k) || 0) + 1);
        it.medalOrder = medal.get(k);
        it.swimmers = Math.max(1, it.members.filter(Boolean).length);
      } else { it.medalOrder = null; it.swimmers = 0; }
    });
    return rows;
  }

  // ---------------------------------------------------------------- プログラム一覧
  function programNames(state) {
    const S = state.settings, set = [];
    S.events.forEach(e => { if (str(e) && set.indexOf(str(e)) < 0) set.push(str(e)); });
    (S.combined || []).forEach(r => { if (str(r.name) && set.indexOf(str(r.name)) < 0) set.push(str(r.name)); });
    return set;
  }

  // ---------------------------------------------------------------- 進行スケジュール（Excel 04）
  function computeSchedule(state, ind, rel) {
    const S = state.settings, sc = S.schedule;
    const start = parseClock(sc.start);
    const heatsOf = name => {
      const src = isRelayName(name) ? rel : ind;
      let n = 0, h = 0;
      src.forEach(it => { if (it.program === name) { n++; if (it.heat > h) h = it.heat; } });
      return { n, h };
    };
    const perHeat = name => {
      const u = name.toUpperCase();
      if (isRelayName(name)) return num(sc.heatRelay);
      if (u.indexOf('200M') >= 0) return num(sc.heat200) || num(sc.heat50);
      if (u.indexOf('100M') >= 0) return num(sc.heat100);
      if (u.indexOf('50M') >= 0) return num(sc.heat50);
      if (u.indexOf('25M') >= 0) return num(sc.heat25);
      return num(sc.heat50);
    };
    const out = [];
    let maxEnd = null;
    state.schedule.forEach((row, i) => {
      const name = str(row.name), adj = num(row.adj);
      const o = { row, no: i + 1, name, adj: row.adj, isBreak: name === '休憩' };
      if (!name) { out.push(o); return; }
      if (o.isBreak) { o.n = '-'; o.heats = '-'; o.dur = num(sc.breakMin) * 60 + adj * 60; }
      else {
        const x = heatsOf(name); o.n = x.n; o.heats = x.h;
        o.dur = Math.max(0, x.h * (perHeat(name) + num(sc.cycleSec)) + adj * 60);
      }
      const fixedAt = parseClock(row.at);
      if (fixedAt !== null) {        // 開始時刻を手で決めた行（遅れ・前倒しの反映）
        o.fixed = true;
        if (maxEnd !== null && fixedAt < maxEnd) o.overlap = true;
        o.start = fixedAt;
      }
      else if (start === null) { o.start = null; o.end = null; }
      else if (maxEnd === null) o.start = start;
      else {
        const prev = out.length ? out[out.length - 1] : null;
        const noGap = o.isBreak || (prev && prev.isBreak) || !(o.heats > 0);
        o.start = maxEnd + (noGap ? 0 : num(sc.intervalMin) * 60);
      }
      if (o.start !== null && o.start !== undefined) { o.end = o.start + o.dur; maxEnd = maxEnd === null ? o.end : Math.max(maxEnd, o.end); }
      out.push(o);
    });
    return { rows: out, end: maxEnd };
  }

  // ---------------------------------------------------------------- 速報（Excel 18）
  function flashList(state, ind, rel, program) {
    if (!program) return [];
    const S = state.settings, relay = isRelayName(program);
    const src = relay ? rel : ind;
    const catI = c => { const i = S.categories.indexOf(c); return i >= 0 ? i + 1 : 99; };
    const evI = e => { const i = S.events.indexOf(e); return i >= 0 ? i + 1 : 99; };
    const list = src.filter(it => (relay ? it.team : it.name) && it.event && (it.event === program || (it.combined && it.combined === program)))
      .map(it => {
        const place = (it.status === '完泳' && it.rank) ? Math.min(99, it.rank) * 1000 : it.status === '失格' ? 100000 : it.status === '棄権' ? 200000 : 300000;
        return { it, key: catI(it.cat) * 1e8 + evI(it.event) * 1e6 + place + it.idx };
      }).sort((a, b) => a.key - b.key).map(x => x.it);
    return list.map(it => ({
      it,
      rank: it.status === '棄権' ? '棄権' : it.flashRank,
      name: relay ? it.memberFlash : it.name,
      club: relay ? it.teamDisp : it.club,
      cat: it.cat + (it.event !== program ? '（' + (str(it.event).split(' ')[0]) + '）' : ''),
      time: it.status === '棄権' ? '' : it.flashTime
    }));
  }

  // ---------------------------------------------------------------- ダッシュボード（Excel 00）
  function computeDashboard(state, ind, rel) {
    const S = state.settings, d = S.dashboard;
    const uniq = new Set(); ind.forEach(it => { if (it.name) uniq.add(it.name); });
    const applicants = uniq.size;
    const priceIn = num(d.price) * (1 + num(d.tax) / 100);
    const clubs = S.clubs.filter(c => str(c.name)).map(c => {
      const nm = str(c.name), u = new Set();
      let score = 0;
      ind.forEach(it => { if (it.club === nm) { if (it.name) u.add(it.name); if (typeof it.points === 'number') score += it.points; } });
      rel.forEach(it => { if (it.team === nm && typeof it.points === 'number') score += it.points; });
      const tgt = str(c.target) === '' ? null : num(c.target);
      return { name: nm, target: tgt, actual: u.size, diff: tgt === null ? null : u.size - tgt, share: applicants ? u.size / applicants : null, score };
    });
    clubs.forEach(c => { c.rank = 1 + clubs.filter(o => o.score > c.score).length; });
    const medal = k => ind.filter(it => it.medalOrder === k).length + rel.filter(it => it.medalOrder === k).reduce((a, it) => a + it.swimmers, 0);
    const otherClubs = new Set();
    ind.forEach(it => { if (it.club && !S.clubs.some(c => str(c.name) === it.club)) otherClubs.add(it.club); });
    return {
      capacity: num(d.capacity), target: num(d.target), applicants,
      diffTarget: applicants - num(d.target), vacancy: num(d.capacity) - applicants,
      priceIn, targetSales: num(d.target) * priceIn, sales: applicants * priceIn, salesDiff: applicants * priceIn - num(d.target) * priceIn,
      medals: { gold: medal(1), silver: medal(2), bronze: medal(3) },
      clubs, otherClubs: [...otherClubs],
      entries: ind.filter(it => it.name).length, relays: rel.filter(it => it.team).length,
      done: ind.filter(it => it.status && it.status !== '未入力').length + rel.filter(it => it.status && it.status !== '未入力').length
    };
  }

  // ---------------------------------------------------------------- 証書対象（Excel AR〜AU）
  function certTargets(state, rows, relay, filter, prize) {
    const S = state.settings, f = filter || {};
    const maxR = parseInt(S.prizeMaxRank, 10) || 10;
    return rows.filter(it => {
      if (!(relay ? it.team : it.name)) return false;
      if (f.event && !(it.event === f.event || it.combined === f.event)) return false;
      if (f.cat && it.cat !== f.cat) return false;
      if (f.club && (relay ? it.team : it.club) !== f.club) return false;
      if (f.status && it.status !== f.status) return false;
      if (f.q) { const k = normKey(f.q); if (normKey(relay ? it.teamDisp + it.members.join('') : it.name + it.club).indexOf(k) < 0) return false; }   // 名前・チームで検索
      const isPrize = it.rank && it.status === '完泳' && it.rank <= maxR;
      if (prize) return isPrize;
      if (S.cert && S.cert.skipPrize && isPrize) return false;      // 賞状をもらう人には記録証を出さない（設定）
      return true;
    });
  }
  function reiwa(dateStr) {
    const m = str(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return str(dateStr);
    return '令和' + (+m[1] - 2018) + '年' + (+m[2]) + '月' + (+m[3]) + '日';
  }

  // ---------------------------------------------------------------- 入力チェック
  function validate(state, ind, rel, sched) {
    const S = state.settings, out = [];
    const add = (level, area, msg, ref, fix) => out.push({ level, area, msg, ref, fix });
    const evSet = new Set(S.events.map(str)), catSet = new Set(S.categories.map(str)), clubSet = new Set(S.clubs.map(c => str(c.name)));
    const progs = new Set(programNames(state));
    const schedNames = new Map();
    state.schedule.forEach((r, i) => { const n = str(r.name); if (n) schedNames.set(n, (schedNames.get(n) || []).concat(i + 1)); });
    const opt = { threeDigit: S.threeDigit };

    // ---- 個人エントリー
    const byNameEv = new Map(), byName = new Map();
    ind.forEach(it => {
      const e = it.e, ref = { type: 'entry', id: e.id }, no = '個人' + (it.idx + 1) + '行目';
      const any = it.name || it.club || it.cat || it.event || str(e.entryTime) || str(e.officialTime);
      if (!any) return;
      const who = it.name || '（氏名なし）';
      if (!it.name) add('error', '個人', no + ': 氏名が空欄です', ref);
      if (!it.event) add('error', '個人', no + ' ' + who + ': 種目が空欄です', ref);
      else if (!evSet.has(it.event)) add('error', '個人', no + ' ' + who + ': 種目「' + it.event + '」が大会設定の種目リストにありません', ref);
      if (!it.cat) add('error', '個人', no + ' ' + who + ': 区分が空欄です', ref);
      else if (!catSet.has(it.cat)) add('error', '個人', no + ' ' + who + ': 区分「' + it.cat + '」が大会設定の区分リストにありません（組分けがずれます）', ref);
      if (!it.club) add('warn', '個人', no + ' ' + who + ': チーム名が空欄です', ref);
      else if (!clubSet.has(it.club)) add('warn', '個人', no + ' ' + who + ': チーム「' + it.club + '」が大会設定のクラブリストにありません', ref);
      if (it.event && isRelayName(it.event)) add('error', '個人', no + ' ' + who + ': リレー種目が個人エントリーに入っています', ref);
      if (it.name) {
        const raw = str(e.name);
        const fixed = fixName(raw);
        if (fixed !== raw) add('info', '個人', no + ' ' + who + ': 氏名の空白をそろえられます（全角空白1つ）', ref, 'name');
        else if (fixed.split('　').length !== 4) add('info', '個人', no + ' ' + who + ': 氏名が「苗字　名前　ミョウジ　ナマエ」の形ではありません', ref);
        const k = it.name + '\u0001' + it.event;
        if (it.event) { if (byNameEv.has(k)) add('error', '個人', no + ' ' + who + ': 同じ種目に二重エントリーしています（' + (byNameEv.get(k) + 1) + '行目と重複）', ref); else byNameEv.set(k, it.idx); }
        if (!byName.has(it.name)) byName.set(it.name, []);

      }
      if (it.pe.kind === 'error') add('error', '個人', no + ' ' + who + ': エントリータイム「' + str(e.entryTime) + '」を読み取れません（' + it.pe.msg + '）', ref);
      if (it.pf.kind === 'error') add('error', '個人', no + ' ' + who + ': 公式タイム「' + str(e.officialTime) + '」を読み取れません（' + it.pf.msg + '）', ref);
      if (it.judge === '棄権' && it.pf.kind === 'time') add('warn', '個人', no + ' ' + who + ': 棄権なのに公式タイムが入っています', ref);
      if (it.pe.kind === 'time' && it.pf.kind === 'time') {
        const r = it.pf.sec / it.pe.sec;
        if (r < 0.6 || r > 1.7) add('warn', '個人', no + ' ' + who + ': 公式タイム ' + fmtTime(it.pf.sec) + ' がエントリータイム ' + fmtTime(it.pe.sec) + ' と大きく違います。打ち間違いがないか確認してください', ref);
      }
      if (hasLooseChars(e.entryTime) || hasLooseChars(e.officialTime)) add('info', '個人', no + ' ' + who + ': タイムに全角文字があります（読み取りはできています）', ref, 'time');
      if (it.event && !schedNames.has(it.program)) add('error', '進行', '「' + it.program + '」が進行スケジュールにありません（' + who + ' ほか）', { type: 'view', view: 'schedule' }, null, it.program);
    });
    byName.forEach((arr, nm) => {
      const cats = new Set(arr.map(a => a.cat).filter(Boolean)), clubs = new Set(arr.map(a => a.club).filter(Boolean));
      if (cats.size > 1) add('warn', '個人', nm + ': 区分が行によって違います（' + [...cats].join('／') + '）', { type: 'entry', id: arr[0].e.id });
      if (clubs.size > 1) add('warn', '個人', nm + ': チームが行によって違います（' + [...clubs].join('／') + '）。同姓同名の別人なら問題ありません', { type: 'entry', id: arr[0].e.id });
      const mx = parseInt(S.maxEventsPerPerson, 10);
      if (mx > 0 && arr.filter(a => a.event).length > mx) add('warn', '個人', nm + ': ' + arr.length + '種目にエントリーしています（上限 ' + mx + '種目）', { type: 'entry', id: arr[0].e.id });
    });
    // 同じ種目・区分の中で極端なタイム
    const grp = new Map();
    ind.forEach(it => { if (it.pf.kind === 'time' && !it.judge) { const k = it.event + '\u0001' + it.cat; if (!grp.has(k)) grp.set(k, []); grp.get(k).push(it); } });
    grp.forEach(arr => {
      if (arr.length < 3) return;
