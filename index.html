<script>/* ============================================================================
 * スイム大会運営アプリ — 計算エンジン（DOM非依存）
 *  Excel「大会運営ブック」の数式と「表彰者算出マクロ」のロジックを移植
 * ========================================================================== */
const Core = (() => {
  'use strict';

  // ---------------------------------------------------------------- 文字の正規化
  function toHalf(s) {
    return String(s)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[．。]/g, '.').replace(/[：]/g, ':').replace(/[，、]/g, '.')
      .replace(/　/g, ' ')
      .replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  }
  // Excel の文字列比較（JIS順）に近い日本語照合
  const JA = (typeof Intl !== 'undefined' && Intl.Collator) ? new Intl.Collator('ja', { sensitivity: 'accent' }) : { compare: (a, b) => a < b ? -1 : a > b ? 1 : 0 };
  const str = v => (v === null || v === undefined) ? '' : String(v).trim();
  // 照合用キー（全角/半角・空白・波ダッシュ・m/M の違いを吸収）
  function normKey(s) {
    let t = str(s);
    try { t = t.normalize('NFKC'); } catch (e) { /* ignore */ }
    return t.replace(/[\s　]+/g, '').replace(/[〜～~]/g, '~').replace(/[ー－−‐-]/g, '-').toLowerCase();
  }
  const SPECIAL = { 'DNS': 'DNS', 'DSQ': 'DSQ', '棄権': '棄権', '失格': '失格' };

  // ---------------------------------------------------------------- タイム
  /**
   * 入力されたタイムを秒に変換する。
   *  28.78 / 1:32.22 / 1.32.22 / 00.30.00 / 1分32秒22 / 132.22(=1:32.22) / Excel時刻値 / 全角
   *  返り値 {kind:'empty'|'time'|'special'|'error', sec, special, msg}
   */
  function parseTime(raw, opt) {
    const rule = (opt && opt.threeDigit) || 'mss';
    if (raw === null || raw === undefined) return { kind: 'empty' };
    if (typeof raw === 'number') {
      if (!isFinite(raw) || raw <= 0) return { kind: 'error', msg: '0以下の数値です' };
      if (Number.isInteger(raw) && raw >= 1000 && raw < 1000000) return parseTime(String(raw), opt);   // Excelの数値セルに 2534 と入っていても 25.34
      let sec;
      if (raw < 1) sec = raw * 86400;
      else if (raw >= 100 && rule === 'mss') {
        const m = Math.floor(raw / 100), r = raw - m * 100;
        if (r >= 60) return { kind: 'error', msg: '秒が60以上です' };
        sec = m * 60 + r;
      } else sec = raw;
      return finish(sec);
    }
    let s = toHalf(str(raw)).replace(/\s+/g, '');
    if (!s) return { kind: 'empty' };
    const up = s.toUpperCase();
    if (SPECIAL[up] || SPECIAL[s]) return { kind: 'special', special: SPECIAL[up] || SPECIAL[s] };
    // 1分32秒22 / 32秒22 / 32秒
    s = s.replace(/["”″]/g, '.').replace(/['’′]/g, ':');
    let m = s.match(/^(?:(\d+)分)?(\d+(?:\.\d+)?)秒(\d*)$/);
    if (m) {
      const min = m[1] ? +m[1] : 0, sc = +m[2], cs = m[3] ? +('0.' + m[3]) : 0;
      if (sc >= 60 && m[1]) return { kind: 'error', msg: '秒が60以上です' };
      return finish(min * 60 + sc + cs);
    }
    if (s.indexOf(':') >= 0) {
      const p = s.split(':');
      if (p.length === 2 && /^\d+$/.test(p[0]) && /^\d+(\.\d+)?$/.test(p[1])) {
        const sec = +p[1];
        if (sec >= 60) return { kind: 'error', msg: '秒が60以上です' };
        return finish(+p[0] * 60 + sec);
      }
      if (p.length === 3 && p.every(x => /^\d+$/.test(x))) { // 1:32:22 → 1分32秒22
        if (+p[1] >= 60) return { kind: 'error', msg: '秒が60以上です' };
        return finish(+p[0] * 60 + +p[1] + +('0.' + p[2]));
      }
      return { kind: 'error', msg: '読み取れない形式です' };
    }
    const parts = s.split('.');
    if (!parts.every(x => /^\d+$/.test(x))) return { kind: 'error', msg: '数字以外の文字があります' };
    if (parts.length === 3) { // 00.30.00 / 1.05.32
      if (+parts[1] >= 60) return { kind: 'error', msg: '秒が60以上です' };
      return finish(+parts[0] * 60 + +parts[1] + +('0.' + parts[2]));
    }
    if (parts.length > 3) return { kind: 'error', msg: '区切りが多すぎます' };
    const n = +s;
    if (n <= 0) return { kind: 'error', msg: '0以下です' };
    // 点なしの4〜6桁は、下2桁を1/100秒として読む（速く打つときの書き方: 2534 → 25.34、10530 → 1:05.30、123456 → 12:34.56）
    if (parts.length === 1 && /^\d{4,6}$/.test(s)) {
      const cc = +s.slice(-2), rest = s.slice(0, -2), ss = +rest.slice(-2), mm = rest.length > 2 ? +rest.slice(0, -2) : 0;
      if (rest.length > 2 && ss >= 60) return { kind: 'error', msg: '秒が60以上です（例: 1:05.30 は 10530）' };
      return finish(mm * 60 + ss + cc / 100);
    }
    if (n >= 100 && rule === 'mss') {
      const mm = Math.floor(+parts[0] / 100), r = n - mm * 100;
      if (r >= 60) return { kind: 'error', msg: '秒が60以上です（例: 1:32.22 は 132.22）' };
      return finish(mm * 60 + r);
    }
    return finish(n);

    function finish(sec) {
      sec = Math.round(sec * 100) / 100;
      if (!(sec > 0)) return { kind: 'error', msg: '0以下です' };
      if (sec >= 3600) return { kind: 'error', msg: '60分以上です' };
      return { kind: 'time', sec };
    }
  }
  const cs = sec => Math.round(sec * 100);
  function fmtTime(sec) { // 1:32.22 / 28.78
    if (sec === null || sec === undefined || !(sec > 0)) return '';
    const c = cs(sec), m = Math.floor(c / 6000), r = c - m * 6000;
    const ss = Math.floor(r / 100), cc = r % 100;
    return (m > 0 ? m + ':' + String(ss).padStart(2, '0') : String(ss)) + '.' + String(cc).padStart(2, '0');
  }
  function fmtTimeJa(sec) { // Excel と同じ「0分28秒78」
    if (!(sec > 0)) return '';
    const c = cs(sec), m = Math.floor(c / 6000), r = c - m * 6000;
    return m + '分' + String(Math.floor(r / 100)).padStart(2, '0') + '秒' + String(r % 100).padStart(2, '0');
  }
  function fmtClock(sec) { // 秒(0時起点) → h:mm
    if (sec === null || sec === undefined || isNaN(sec)) return '';
    const t = Math.round(sec / 60), h = Math.floor(t / 60), m = t % 60;
    return h + ':' + String(m).padStart(2, '0');
  }
  function parseClock(v) { // "8:45" / 0.364 → 秒
    if (typeof v === 'number') return v < 1 ? Math.round(v * 86400) : null;
    const m = toHalf(str(v)).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (m[3] ? +m[3] : 0) : null;
  }
  function parseDuration(v) { // "1:30" (分:秒) / 90 → 秒
    if (typeof v === 'number') return v < 1 ? Math.round(v * 86400) : v;
    const s = toHalf(str(v));
    let m = s.match(/^(\d+):(\d{1,2})$/);
    if (m) return (+m[1]) * 60 + (+m[2]);
    if (/^\d+(\.\d+)?$/.test(s)) return +s;
    return null;
  }
  function fmtDuration(sec) { if (!(sec >= 0)) return ''; const m = Math.floor(sec / 60), s = Math.round(sec - m * 60); return m + ':' + String(s).padStart(2, '0'); }

  // ---------------------------------------------------------------- 既定設定
  function defaultSettings() {
    return {
      meetName: 'ジュニアスイムフェスティバル',
      events: ['女子 25M 板キック', '男子 25M 板キック', '女子 25M 自由形', '男子 25M 自由形', '女子 50M 自由形', '男子 50M 自由形',
        '女子 25M 背泳ぎ', '男子 25M 背泳ぎ', '女子 50M 背泳ぎ', '男子 50M 背泳ぎ', '女子 25M 平泳ぎ', '男子 25M 平泳ぎ',
        '女子 50M 平泳ぎ', '男子 50M 平泳ぎ', '女子 25M バタフライ', '男子 25M バタフライ', '女子 50M バタフライ', '男子 50M バタフライ',
        '女子 4×25M フリーリレー', '男子 4×25M フリーリレー', '混合 4×25M フリーリレー'],
      categories: ['6歳以下', '7〜8歳', '9〜10歳', '11〜12歳', '13〜14歳', '15〜16歳', '17〜18歳'],
      clubs: [{ name: 'Aクラブ', target: '' }, { name: 'Bクラブ', target: '' }, { name: 'Cクラブ', target: '' }],
      lanes: [3, 2, 4, 1, 5],
      laneOrder: 'excel',      // excel: Excelと同じ（組内の遅い順に優先レーン） / fast: 組内の速い順に優先レーン
      minPerHeatInd: 3, minPerHeatRelay: 3,
      combined: [],            // [{name, pairs:[{event,cat}×3]}]
      threeDigit: 'mss',
      kanaStyle: 'kata',       // フリガナの表記: kata = カタカナ / hira = ひらがな
      schedule: {
        title: '競技進行スケジュール',
        doorOpen: '7:30', warmup: '7:55 ～ 8:25', opening: '8:30', start: '8:45', closing: '10:50 (予定)', exit: '11:15',
        cycleSec: 0, intervalMin: 2, breakMin: 45,
        heat25: 60, heat50: 90, heat100: 120, heat200: 210, heatRelay: 120
      },
      points: { ind: [6, 5, 4, 3, 2, 1, '', '', '', ''], indFinish: '', relayMult: 2 },
      prizeMaxRank: 10,
      maxEventsPerPerson: 2,
      cert: { title: '記　録　証', lines: ['あなたは本大会において', '最後まで力強い泳ぎを見せ', '見事完泳されました', 'よってその健闘を讃えこれを証します'], date: '', organizer: '大会主催者名　印', printRecord: true },
      award: { title: '賞　状', lines: ['あなたは本大会において', '極めて優秀な成績を収められました', 'よってその健闘と栄誉を讃え', 'これを賞します'], date: '', organizer: '大会主催者名　印' },
      print: { scale: 100, offsetTop: 0, offsetLeft: 0, progMode: 'blank', certKana: true },   // progMode: blank = 記録欄を空けて手書き用 / result = 記録入り
      dashboard: { capacity: 90, target: 80, price: 3000, tax: 10 }
    };
  }
  function defaultAward() {
    const ev = [['25m板キック', 18, 20], ['25mバタフライ', 19, 21], ['25m背泳ぎ', 21, 22], ['25m平泳ぎ', 23, 25], ['25m自由形', 18, 20],
      ['50mバタフライ', 39.1, 43.6], ['50m背泳ぎ', 40.5, 45.1], ['50m平泳ぎ', 45.5, 50.6], ['50m自由形', 36.6, 40.7],
      ['100m個人メドレー', 110, 110], ['200m個人メドレー', 192.9, 214.7]];
    const events = [];
    for (let i = 0; i < 15; i++) {
      const d = ev[i];
      events.push({ id: 'ae' + (i + 1), name: d ? d[0] : '', baseM: d ? fmtTime(d[1]) : '', baseF: d ? fmtTime(d[2]) : '', mvp: true });
    }
    const cn = ['8歳以下', '9～10歳', '11～12歳', '13歳以上'];
    const cats = [];
    for (let k = 0; k < 8; k++) cats.push({ name: cn[k] || '', mvp: true, exc: true });
    return { cStart: 1, cEnd: 8, rankMode: '1〜3位すべて', minRate: 0, fold: '枠を残して表示', cats, events, inputs: {} };
  }
  function emptyState() {
    return { app: 'swim-meet', schema: 1, rev: 0, settings: defaultSettings(), entries: [], relays: [], schedule: [], award: defaultAward(), ui: {} };
  }

  // ---------------------------------------------------------------- 共通
  const isRelayName = s => str(s).indexOf('リレー') >= 0;
  function laneList(S) {
    const out = [];
    (S.lanes || []).forEach(v => { const n = parseInt(toHalf(str(v)), 10); if (n > 0 && out.indexOf(n) < 0) out.push(n); });
    return out.length ? out : [1];
  }
  function combinedOf(S, event, cat) {
    const rules = S.combined || [];
    const maxP = Math.max(3, ...rules.map(r => (r.pairs || []).length));
    for (let p = 0; p < maxP; p++) {
      for (const r of rules) {
        const pr = (r.pairs || [])[p];
        if (r.name && pr && str(pr.event) === event && str(pr.cat) === cat && event && cat) return str(r.name);
      }
    }
    return '';
  }
  const evSex = name => { const m = str(name).match(/^(男子|女子|混合)/); return m ? m[1] : ''; };

  // ---------------------------------------------------------------- 組・レーン編成（Excel AC〜AN 列）
  function assignHeats(items, S, minPer) {
    const lanes = laneList(S), L = lanes.length;
    minPer = Math.max(1, Math.min(parseInt(minPer, 10) || 1, L));
    const catOrder = c => { const i = S.categories.indexOf(c); return i >= 0 ? i + 1 : 99; };
    const groups = new Map();
    items.forEach(it => {
      if (!it.event) return;
      const key = it.combined ? it.combined : S.heatGroup === 'event' ? it.event : it.event + '_' + it.cat;   // heatGroup: event = 区分をまぜて記録順に組分け
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    });
    const ginfo = new Map();
    groups.forEach((arr, key) => {
      arr.sort((a, b) => (b.H - a.H) || a.tie(b));
      const AD = arr.length, AF = Math.ceil(AD / L), AJ = ((AD - 1) % L) + 1;
      const AK = AF > 1 ? Math.max(AJ, minPer) : AD;
      const it0 = arr[0];
      ginfo.set(key, { arr, AD, AF, AK, combined: !!it0.combined, event: it0.event, AG: it0.combined ? 99 : catOrder(it0.cat), cat: it0.cat });
    });
    // 同じ種目の中で、区分順（AG）の小さい区分の組数を前に積む
    ginfo.forEach(g => {
      let AI = 0;
      if (!g.combined) {
        ginfo.forEach(o => {
          if (o === g || o.combined || o.event !== g.event) return;
          if (o.AG < g.AG || (o.AG === g.AG && g.AG === 99 && o.cat < g.cat)) AI += o.AF;
        });
      }
      g.AI = AI;
      const heatsLocal = {};
      g.arr.forEach((it, idx) => {
        const AE = idx + 1;
        const AL = AE <= g.AK ? 1 : 1 + Math.ceil((AE - g.AK) / L);
        const AM = AE <= g.AK ? AE : ((AE - g.AK - 1) % L) + 1;
        it.heat = AI + (S.heatSort === 'fast' ? g.AF - AL + 1 : AL); it._AM = AM;   // heatSort: fast = 速い組から
        (heatsLocal[AL] = heatsLocal[AL] || []).push(it);
      });
      Object.keys(heatsLocal).forEach(k => {
        const hs = heatsLocal[k], n = hs.length;
        hs.forEach(it => {
          const pos = S.laneOrder === 'fast' ? (n - it._AM + 1) : it._AM;
          it.lane = lanes[pos - 1] || null;
        });
      });
    });
  }

  // 手で入れ替えた組・レーン（プログラム画面のドラッグ＆ドロップ）を自動の割り当ての上に重ねる
  //  seat = { p: プログラム名, h: 組, l: レーン }。種目・区分が変わってプログラム名が違えば無視して自動に戻す。
  //  固定した人と同じ場所に自動の人が来たら、空いているレーン（同じ組 → 他の組 → 新しい組）へずらす。最後に組番号を詰める。
  function applySeats(items, S, srcKey) {
    const lanes = laneList(S);
    const byProg = new Map();
    items.forEach(it => { if (!it.program || !it.heat) return; if (!byProg.has(it.program)) byProg.set(it.program, []); byProg.get(it.program).push(it); });
    byProg.forEach((arr, prog) => {
      const seatOf = it => { const st = it[srcKey] && it[srcKey].seat; return st && st.p === prog && Number.isInteger(+st.h) && +st.h >= 1 && lanes.indexOf(+st.l) >= 0 ? { h: +st.h, l: +st.l } : null; };
      if (!arr.some(seatOf)) return;
      const used = new Map(), key = (h, l) => h + '|' + l;
      const fixed = [], auto = [];
      arr.forEach(it => { const st = seatOf(it); if (st && !used.has(key(st.h, st.l))) { it.heat = st.h; it.lane = st.l; it.seatFixed = true; used.set(key(st.h, st.l), it); fixed.push(it); } else auto.push(it); });
      const pending = [];
      auto.forEach(it => { if (it.lane && !used.has(key(it.heat, it.lane))) used.set(key(it.heat, it.lane), it); else pending.push(it); });
      pending.forEach(it => {
        const maxH = Math.max(0, ...arr.filter(x => used.has(key(x.heat, x.lane)) && used.get(key(x.heat, x.lane)) === x).map(x => x.heat));
        const order = [it.heat].concat(Array.from({ length: maxH }, (_, i) => i + 1).filter(h => h !== it.heat));
        let spot = null;
        for (const h of order) { const l = lanes.find(l => !used.has(key(h, l))); if (l !== undefined) { spot = { h, l }; break; } }
        if (!spot) spot = { h: maxH + 1, l: lanes[0] };
        it.heat = spot.h; it.lane = spot.l; it.seatMoved = true; used.set(key(spot.h, spot.l), it);
      });
      const hs = [...new Set(arr.map(it => it.heat))].sort((a, b) => a - b), ren = new Map(hs.map((h, i) => [h, i + 1]));
      arr.forEach(it => { it.heat = ren.get(it.heat); });
    });
  }

  // 公式順位（同じ種目・区分の中で） Excel P/Q 列
  function assignRanks(items) {
    const g = new Map();
    items.forEach(it => {
      it.rank = null; it.rankOrder = null;
      if (!(it.I < 9999)) return;
      const k = it.event + '\u0001' + it.cat;
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(it);
    });
    g.forEach(arr => {
      arr.sort((a, b) => (a.I - b.I) || a.tie(b));
      arr.forEach((it, i) => {
        let r = i + 1;
        if (i > 0 && cs(arr[i - 1].I) === cs(it.I)) r = arr[i - 1].rank;
        it.rank = r; it.rankOrder = i + 1;
      });
    });
  }

  function statusOf(judge, officialParse, hasOfficialRaw) {
    if (judge === '棄権' || (officialParse.kind === 'special' && (officialParse.special === 'DNS' || officialParse.special === '棄権'))) return '棄権';
    if (judge === '失格' || (officialParse.kind === 'special' && (officialParse.special === 'DSQ' || officialParse.special === '失格'))) return '失格';
    if (judge === '対象外') return '対象外';          // 記録はあっても順位・得点・表彰の対象にしない
    if (!hasOfficialRaw) return '未入力';
    return '完泳';
  }

  // ---------------------------------------------------------------- 個人
  function computeIndividuals(state) {
    const S = state.settings, opt = { threeDigit: S.threeDigit };
    const pts = S.points || {};
    const rows = state.entries.map((e, idx) => {
      const event = str(e.event), cat = str(e.cat);
      const pe = parseTime(e.entryTime, opt), pf = parseTime(e.officialTime, opt);
      const judge = str(e.judge);
      const hasF = !(pf.kind === 'empty');
      const status = str(e.name) ? statusOf(judge, pf, hasF) : '';
      const H = pe.kind === 'time' ? pe.sec : 9999;
      const I = (pf.kind === 'time' && !judge) ? pf.sec : 9999;
      const it = {
        e, idx, id: e.id, event, cat, name: str(e.name), club: str(e.club), judge, pe, pf, H, I, status,
        combined: event && cat ? combinedOf(S, event, cat) : '',
        tie(o) { return this.idx - o.idx; }
      };
      it.program = it.combined || event;
      it.np = splitName(it.name, S.kanaStyle);     // { kanji: 苗字　名前, kana: フリガナ（設定の表記） }
      // 表示用タイム（Excel S列）
      it.officialText = pf.kind === 'time' ? fmtTimeJa(pf.sec) : (pf.kind === 'special' ? pf.special : (hasF ? str(e.officialTime) : ''));
      return it;
    });
    assignHeats(rows, S, S.minPerHeatInd);
    applySeats(rows, S, 'e');
    assignRanks(rows);
    const medalCount = new Map();
    rows.forEach(it => {
      // 得点（Excel W列）
      if (it.rank) {
        const p = num(pts.ind && pts.ind[it.rank - 1]);
        it.points = p + num(pts.indFinish);
      } else it.points = null;
      // 速報用
      it.flashTime = it.status === '棄権' ? '棄権' : (it.pf.kind === 'special' ? '' : (it.pf.kind === 'time' ? fmtTimeJa(it.pf.sec) : it.officialText));
      it.flashRank = it.status === '失格' ? '失格' : it.status === '対象外' ? '対象外' : (it.rank ? it.rank + '位' : '');
      // メダル発注用（Excel X列: 区分×種目ごとの申込順）
      if (it.name && it.cat && it.event) {
        const k = it.cat + '\u0001' + it.event;
        medalCount.set(k, (medalCount.get(k) || 0) + 1);
        it.medalOrder = medalCount.get(k);
      } else it.medalOrder = null;
    });
    return rows;
  }
  const num = v => { const n = parseFloat(toHalf(str(v))); return isFinite(n) ? n : 0; };

  // ---------------------------------------------------------------- リレー
  function computeRelays(state) {
    const S = state.settings, opt = { threeDigit: S.threeDigit };
    const pts = S.points || {}, mult = num(pts.relayMult) || 1;
    const rows = state.relays.map((r, idx) => {
      const event = str(r.event), cat = str(r.cat);
      const pe = parseTime(r.entryTime, opt), pf = parseTime(r.officialTime, opt);
      const judge = str(r.judge);
      const hasF = pf.kind !== 'empty';
      const team = str(r.team), mark = str(r.mark);
      const members = (r.members || []).map(str);
      const it = {
        r, idx, id: r.id, event, cat, team, mark, judge, pe, pf, members,
        teamDisp: team ? team + (mark ? ' ' + mark : '') : '',
        H: pe.kind === 'time' ? pe.sec : 9999,
        I: (pf.kind === 'time' && !judge) ? pf.sec : 9999,
        status: team ? statusOf(judge, pf, hasF) : '',
        combined: event && cat ? combinedOf(S, event, cat) : '',
        tie(o) { return JA.compare(this.teamDisp, o.teamDisp) || this.idx - o.idx; }
      };
      it.program = it.combined || event;
      it.memberNames = members.map(m => splitName(m, S.kanaStyle));     // { kanji, kana, ... } ×4
      it.memberText = members[0] ? it.memberNames.map(m => m.kanji).join(' / ') : '';
      it.memberFlash = team ? it.memberNames.filter(m => m.kanji).map(m => m.kanji.replace(/　/g, '')).join('・') : '';
      it.officialText = pf.kind === 'time' ? fmtTimeJa(pf.sec) : (pf.kind === 'special' ? pf.special : (hasF ? str(r.officialTime) : ''));
      return it;
    });
    assignHeats(rows, S, S.minPerHeatRelay);
    applySeats(rows, S, 'r');
    assignRanks(rows);
    const medal = new Map();
    rows.forEach(it => {
      if (it.rank) it.points = it.status !== '完泳' ? 0 : num(pts.ind && pts.ind[it.rank - 1]) * mult + num(pts.indFinish) * mult;
      else it.points = null;
      it.flashTime = it.status === '棄権' ? '棄権' : (it.pf.kind === 'special' ? '' : (it.pf.kind === 'time' ? fmtTimeJa(it.pf.sec) : it.officialText));
      it.flashRank = it.status === '失格' ? '失格' : (it.rank ? it.rank + '位' : '');
      if (it.team && it.cat && it.event) {
        const k = it.cat + '\u0001' + it.event;
        medal.set(k, (medal.get(k) || 0) + 1);
        it.medalOrder = medal.get(k);
        it.swimmers = Math.max(1, it.members.filter(Boolean).length);
      } else { it.medalOrder = null; it.swimmers = 0; }
    });
    return rows;
  }

  // ---------------------------------------------------------------- プログラム一覧
  function programNames(state) {
    const S = state.settings, set = [];
    S.events.forEach(e => { if (str(e) && set.indexOf(str(e)) < 0) set.push(str(e)); });
    (S.combined || []).forEach(r => { if (str(r.name) && set.indexOf(str(r.name)) < 0) set.push(str(r.name)); });
    return set;
  }

  // ---------------------------------------------------------------- 進行スケジュール（Excel 04）
  function computeSchedule(state, ind, rel) {
    const S = state.settings, sc = S.schedule;
    const start = parseClock(sc.start);
    const heatsOf = name => {
      const src = isRelayName(name) ? rel : ind;
      let n = 0, h = 0;
      src.forEach(it => { if (it.program === name) { n++; if (it.heat > h) h = it.heat; } });
      return { n, h };
    };
    const perHeat = name => {
      const u = name.toUpperCase();
      if (isRelayName(name)) return num(sc.heatRelay);
      if (u.indexOf('200M') >= 0) return num(sc.heat200) || num(sc.heat50);
      if (u.indexOf('100M') >= 0) return num(sc.heat100);
      if (u.indexOf('50M') >= 0) return num(sc.heat50);
      if (u.indexOf('25M') >= 0) return num(sc.heat25);
      return num(sc.heat50);
    };
    const out = [];
    let maxEnd = null;
    state.schedule.forEach((row, i) => {
      const name = str(row.name), adj = num(row.adj);
      const o = { row, no: i + 1, name, adj: row.adj, isBreak: name === '休憩' };
      if (!name) { out.push(o); return; }
      if (o.isBreak) { o.n = '-'; o.heats = '-'; o.dur = num(sc.breakMin) * 60 + adj * 60; }
      else {
        const x = heatsOf(name); o.n = x.n; o.heats = x.h;
        o.dur = Math.max(0, x.h * (perHeat(name) + num(sc.cycleSec)) + adj * 60);
      }
      const fixedAt = parseClock(row.at);
      if (fixedAt !== null) {        // 開始時刻を手で決めた行（遅れ・前倒しの反映）
        o.fixed = true;
        if (maxEnd !== null && fixedAt < maxEnd) o.overlap = true;
        o.start = fixedAt;
      }
      else if (start === null) { o.start = null; o.end = null; }
      else if (maxEnd === null) o.start = start;
      else {
        const prev = out.length ? out[out.length - 1] : null;
        const noGap = o.isBreak || (prev && prev.isBreak) || !(o.heats > 0);
        o.start = maxEnd + (noGap ? 0 : num(sc.intervalMin) * 60);
      }
      if (o.start !== null && o.start !== undefined) { o.end = o.start + o.dur; maxEnd = maxEnd === null ? o.end : Math.max(maxEnd, o.end); }
      out.push(o);
    });
    return { rows: out, end: maxEnd };
  }

  // ---------------------------------------------------------------- 速報（Excel 18）
  function flashList(state, ind, rel, program) {
    if (!program) return [];
    const S = state.settings, relay = isRelayName(program);
    const src = relay ? rel : ind;
    const catI = c => { const i = S.categories.indexOf(c); return i >= 0 ? i + 1 : 99; };
    const evI = e => { const i = S.events.indexOf(e); return i >= 0 ? i + 1 : 99; };
    const list = src.filter(it => (relay ? it.team : it.name) && it.event && (it.event === program || (it.combined && it.combined === program)))
      .map(it => {
        const place = (it.status === '完泳' && it.rank) ? Math.min(99, it.rank) * 1000 : it.status === '失格' ? 100000 : it.status === '棄権' ? 200000 : 300000;
        return { it, key: catI(it.cat) * 1e8 + evI(it.event) * 1e6 + place + it.idx };
      }).sort((a, b) => a.key - b.key).map(x => x.it);
    return list.map(it => ({
      it,
      rank: it.status === '棄権' ? '棄権' : it.flashRank,
      name: relay ? it.memberFlash : it.name,
      club: relay ? it.teamDisp : it.club,
      cat: it.cat + (it.event !== program ? '（' + (str(it.event).split(' ')[0]) + '）' : ''),
      time: it.status === '棄権' ? '' : it.flashTime
    }));
  }

  // ---------------------------------------------------------------- ダッシュボード（Excel 00）
  function computeDashboard(state, ind, rel) {
    const S = state.settings, d = S.dashboard;
    const uniq = new Set(); ind.forEach(it => { if (it.name) uniq.add(it.name); });
    const applicants = uniq.size;
    const priceIn = num(d.price) * (1 + num(d.tax) / 100);
    const clubs = S.clubs.filter(c => str(c.name)).map(c => {
      const nm = str(c.name), u = new Set();
      let score = 0;
      ind.forEach(it => { if (it.club === nm) { if (it.name) u.add(it.name); if (typeof it.points === 'number') score += it.points; } });
      rel.forEach(it => { if (it.team === nm && typeof it.points === 'number') score += it.points; });
      const tgt = str(c.target) === '' ? null : num(c.target);
      return { name: nm, target: tgt, actual: u.size, diff: tgt === null ? null : u.size - tgt, share: applicants ? u.size / applicants : null, score };
    });
    clubs.forEach(c => { c.rank = 1 + clubs.filter(o => o.score > c.score).length; });
    const medal = k => ind.filter(it => it.medalOrder === k).length + rel.filter(it => it.medalOrder === k).reduce((a, it) => a + it.swimmers, 0);
    const otherClubs = new Set();
    ind.forEach(it => { if (it.club && !S.clubs.some(c => str(c.name) === it.club)) otherClubs.add(it.club); });
    return {
      capacity: num(d.capacity), target: num(d.target), applicants,
      diffTarget: applicants - num(d.target), vacancy: num(d.capacity) - applicants,
      priceIn, targetSales: num(d.target) * priceIn, sales: applicants * priceIn, salesDiff: applicants * priceIn - num(d.target) * priceIn,
      medals: { gold: medal(1), silver: medal(2), bronze: medal(3) },
      clubs, otherClubs: [...otherClubs],
      entries: ind.filter(it => it.name).length, relays: rel.filter(it => it.team).length,
      done: ind.filter(it => it.status && it.status !== '未入力').length + rel.filter(it => it.status && it.status !== '未入力').length
    };
  }

  // ---------------------------------------------------------------- 証書対象（Excel AR〜AU）
  function certTargets(state, rows, relay, filter, prize) {
    const S = state.settings, f = filter || {};
    const maxR = parseInt(S.prizeMaxRank, 10) || 10;
    return rows.filter(it => {
      if (!(relay ? it.team : it.name)) return false;
      if (f.event && !(it.event === f.event || it.combined === f.event)) return false;
      if (f.cat && it.cat !== f.cat) return false;
      if (f.club && (relay ? it.team : it.club) !== f.club) return false;
      if (f.status && it.status !== f.status) return false;
      if (f.q) { const k = normKey(f.q); if (normKey(relay ? it.teamDisp + it.members.join('') : it.name + it.club).indexOf(k) < 0) return false; }   // 名前・チームで検索
      const isPrize = it.rank && it.status === '完泳' && it.rank <= maxR;
      if (prize) return isPrize;
      if (S.cert && S.cert.skipPrize && isPrize) return false;      // 賞状をもらう人には記録証を出さない（設定）
      return true;
    });
  }
  function reiwa(dateStr) {
    const m = str(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return str(dateStr);
    return '令和' + (+m[1] - 2018) + '年' + (+m[2]) + '月' + (+m[3]) + '日';
  }

  // ---------------------------------------------------------------- 入力チェック
  function validate(state, ind, rel, sched) {
    const S = state.settings, out = [];
    const add = (level, area, msg, ref, fix) => out.push({ level, area, msg, ref, fix });
    const evSet = new Set(S.events.map(str)), catSet = new Set(S.categories.map(str)), clubSet = new Set(S.clubs.map(c => str(c.name)));
    const progs = new Set(programNames(state));
    const schedNames = new Map();
    state.schedule.forEach((r, i) => { const n = str(r.name); if (n) schedNames.set(n, (schedNames.get(n) || []).concat(i + 1)); });
    const opt = { threeDigit: S.threeDigit };

    // ---- 個人エントリー
    const byNameEv = new Map(), byName = new Map();
    ind.forEach(it => {
      const e = it.e, ref = { type: 'entry', id: e.id }, no = '個人' + (it.idx + 1) + '行目';
      const any = it.name || it.club || it.cat || it.event || str(e.entryTime) || str(e.officialTime);
      if (!any) return;
      const who = it.name || '（氏名なし）';
      if (!it.name) add('error', '個人', no + ': 氏名が空欄です', ref);
      if (!it.event) add('error', '個人', no + ' ' + who + ': 種目が空欄です', ref);
      else if (!evSet.has(it.event)) add('error', '個人', no + ' ' + who + ': 種目「' + it.event + '」が大会設定の種目リストにありません', ref);
      if (!it.cat) add('error', '個人', no + ' ' + who + ': 区分が空欄です', ref);
      else if (!catSet.has(it.cat)) add('error', '個人', no + ' ' + who + ': 区分「' + it.cat + '」が大会設定の区分リストにありません（組分けがずれます）', ref);
      if (!it.club) add('warn', '個人', no + ' ' + who + ': チーム名が空欄です', ref);
      else if (!clubSet.has(it.club)) add('warn', '個人', no + ' ' + who + ': チーム「' + it.club + '」が大会設定のクラブリストにありません', ref);
      if (it.event && isRelayName(it.event)) add('error', '個人', no + ' ' + who + ': リレー種目が個人エントリーに入っています', ref);
      if (it.name) {
        const raw = str(e.name);
        const fixed = fixName(raw);
        if (fixed !== raw) add('info', '個人', no + ' ' + who + ': 氏名の空白をそろえられます（全角空白1つ）', ref, 'name');
        else if (fixed.split('　').length !== 4) add('info', '個人', no + ' ' + who + ': 氏名が「苗字　名前　ミョウジ　ナマエ」の形ではありません', ref);
        const k = it.name + '\u0001' + it.event;
        if (it.event) { if (byNameEv.has(k)) add('error', '個人', no + ' ' + who + ': 同じ種目に二重エントリーしています（' + (byNameEv.get(k) + 1) + '行目と重複）', ref); else byNameEv.set(k, it.idx); }
        if (!byName.has(it.name)) byName.set(it.name, []);
        byName.get(it.name).push(it);
      }
      if (it.pe.kind === 'error') add('error', '個人', no + ' ' + who + ': エントリータイム「' + str(e.entryTime) + '」を読み取れません（' + it.pe.msg + '）', ref);
      if (it.pf.kind === 'error') add('error', '個人', no + ' ' + who + ': 公式タイム「' + str(e.officialTime) + '」を読み取れません（' + it.pf.msg + '）', ref);
      if (it.judge === '棄権' && it.pf.kind === 'time') add('warn', '個人', no + ' ' + who + ': 棄権なのに公式タイムが入っています', ref);
      if (it.pe.kind === 'time' && it.pf.kind === 'time') {
        const r = it.pf.sec / it.pe.sec;
        if (r < 0.6 || r > 1.7) add('warn', '個人', no + ' ' + who + ': 公式タイム ' + fmtTime(it.pf.sec) + ' がエントリータイム ' + fmtTime(it.pe.sec) + ' と大きく違います。打ち間違いがないか確認してください', ref);
      }
      if (hasLooseChars(e.entryTime) || hasLooseChars(e.officialTime)) add('info', '個人', no + ' ' + who + ': タイムに全角文字があります（読み取りはできています）', ref, 'time');
      if (it.event && !schedNames.has(it.program)) add('error', '進行', '「' + it.program + '」が進行スケジュールにありません（' + who + ' ほか）', { type: 'view', view: 'schedule' }, null, it.program);
    });
    byName.forEach((arr, nm) => {
      const cats = new Set(arr.map(a => a.cat).filter(Boolean)), clubs = new Set(arr.map(a => a.club).filter(Boolean));

      if (clubs.size > 1) add('warn', '個人', nm + ': チームが行によって違います（' + [...clubs].join('／') + '）。同姓同名の別人なら問題ありません', { type: 'entry', id: arr[0].e.id });

    const dash = computeDashboard(state, ind, rel);
    if (dash.capacity > 0 && dash.applicants > dash.capacity) add('warn', '申込', '申込者数 ' + dash.applicants + '名が定員 ' + dash.capacity + '名を超えています', { type: 'view', view: 'dashboard' });

    // ---- リレー

    rel.forEach(it => {
      const r = it.r, ref = { type: 'relay', id: r.id }, no = 'リレー' + (it.idx + 1) + '行目';
      const any = it.team || it.cat || it.event || it.members.some(Boolean);
      if (!any) return;
      const who = it.teamDisp || '（チーム名なし）';
      if (!it.team) add('error', 'リレー', no + ': チーム名が空欄です', ref);
      else if (!clubSet.has(it.team)) add('warn', 'リレー', no + ' ' + who + ': チーム「' + it.team + '」がクラブリストにありません（得点がクラブに加算されません）', ref);

      else if (!evSet.has(it.event)) add('error', 'リレー', no + ' ' + who + ': 種目「' + it.event + '」が種目リストにありません', ref);
      else if (!isRelayName(it.event)) add('error', 'リレー', no + ' ' + who + ': 「' + it.event + '」はリレー種目ではありません', ref);
      if (!it.cat) add('error', 'リレー', no + ' ' + who + ': 区分が空欄です', ref);
      else if (!catSet.has(it.cat)) add('error', 'リレー', no + ' ' + who + ': 区分「' + it.cat + '」が区分リストにありません', ref);
      const mem = it.members.filter(Boolean).map(m => splitName(m).kanji);     // 重複の判定は漢字の氏名で
      if (mem.length < 4) add('warn', 'リレー', no + ' ' + who + ': 泳者が' + mem.length + '名です（4名必要）', ref);
      const ms = new Set();
      mem.forEach(m => { const k = normKey(m); if (ms.has(k)) add('error', 'リレー', no + ' ' + who + ': 泳者「' + m + '」が2回入っています', ref); ms.add(k); });
      if (it.event) {
        mem.forEach(m => {
          const k = normKey(m) + '\u0001' + it.event;
          if (memberEv.has(k) && memberEv.get(k) !== it.idx) add('error', 'リレー', no + ' ' + who + ': 泳者「' + m + '」が同じ種目の別チーム（' + (memberEv.get(k) + 1) + '行目）にも入っています', ref);

      if (it.pf.kind === 'error') add('error', 'リレー', no + ' ' + who + ': 公式タイムを読み取れません（' + it.pf.msg + '）', ref);
      if (it.judge === '棄権' && it.pf.kind === 'time') add('warn', 'リレー', no + ' ' + who + ': 棄権なのに公式タイムが入っています', ref);

    // ---- 大会設定
    const dup = (arr, label) => { const s = new Set(); arr.forEach(x => { x = str(x); if (!x) return; if (s.has(x)) add('error', '設定', label + '「' + x + '」が重複しています', { type: 'view', view: 'settings' }); s.add(x); }); };
    dup(S.events, '種目'); dup(S.categories, '区分'); dup(S.clubs.map(c => c.name), 'クラブ');
    const lanesRaw = (S.lanes || []).map(v => str(v)).filter(Boolean);
    const lanes = laneList(S);
    if (lanesRaw.length !== lanes.length) add('error', '設定', '使用レーンの番号が重複しているか、数字ではありません', { type: 'view', view: 'settings' });
    if (!lanesRaw.length) add('error', '設定', '使用レーンが1つも設定されていません', { type: 'view', view: 'settings' });
    if ((parseInt(S.minPerHeatInd, 10) || 0) > lanes.length) add('warn', '設定', '個人の1組最低人数（' + S.minPerHeatInd + '）がレーン数（' + lanes.length + '）を超えています。レーン数に合わせて計算します', { type: 'view', view: 'settings' });
    if ((parseInt(S.minPerHeatRelay, 10) || 0) > lanes.length) add('warn', '設定', 'リレーの1組最低チーム数がレーン数を超えています。レーン数に合わせて計算します', { type: 'view', view: 'settings' });
    const pairSeen = new Map();
    (S.combined || []).forEach((r, i) => {
      if (!str(r.name)) { if ((r.pairs || []).some(p => p && (p.event || p.cat))) add('error', '設定', '合同レース' + (i + 1) + '行目: プログラム表示名が空欄です', { type: 'view', view: 'settings' }); return; }
      if (evSet.has(str(r.name))) add('error', '設定', '合同レース名「' + r.name + '」が通常の種目名と同じです。別の名前にしてください', { type: 'view', view: 'settings' });
      (r.pairs || []).forEach(p => {
        if (!p || (!p.event && !p.cat)) return;
        if (p.event && !evSet.has(str(p.event))) add('error', '設定', '合同レース「' + r.name + '」の種目「' + p.event + '」が種目リストにありません', { type: 'view', view: 'settings' });
        if (p.cat && !catSet.has(str(p.cat))) add('error', '設定', '合同レース「' + r.name + '」の区分「' + p.cat + '」が区分リストにありません', { type: 'view', view: 'settings' });
        if (!p.event || !p.cat) add('warn', '設定', '合同レース「' + r.name + '」で種目か区分の片方だけが入っています', { type: 'view', view: 'settings' });
        const k = p.event + '\u0001' + p.cat;
        if (pairSeen.has(k)) add('warn', '設定', '「' + p.event + '・' + p.cat + '」が複数の合同レース（' + pairSeen.get(k) + '／' + r.name + '）に入っています。先の方が使われます', { type: 'view', view: 'settings' });
        else pairSeen.set(k, r.name);

    });
    if (parseClock(S.schedule.start) === null) add('error', '設定', '競技開始の時刻「' + S.schedule.start + '」を読み取れません（例 8:45）', { type: 'view', view: 'settings' });

    // ---- スケジュール
    schedNames.forEach((rows, n) => {
      if (n === '休憩') return;
      if (rows.length > 1) add('warn', '進行', '「' + n + '」がスケジュールに' + rows.length + '回入っています（' + rows.join('・') + '番）。時間が二重に計上されます', { type: 'view', view: 'schedule' });
      if (!progs.has(n)) add('warn', '進行', 'スケジュールの「' + n + '」は種目リスト・合同レースにありません', { type: 'view', view: 'schedule' });
    });
    if (sched && sched.end !== null) {
      const cl = parseClock(S.schedule.closing);
      if (cl !== null && sched.end > cl) add('warn', '進行', '競技終了予定 ' + fmtClock(sched.end) + ' が閉会式 ' + S.schedule.closing + ' より後です', { type: 'view', view: 'schedule' });
    }
    // 重複メッセージをまとめる

    return out.filter(x => { const k = x.level + x.msg; if (seen.has(k)) return false; seen.add(k); return true; });
  }
  function hasLooseChars(v) { return typeof v === 'string' && /[０-９．：，　]/.test(v); }
  function fixName(s) {

  }
  // ---- フリガナ: 氏名は「苗字　名前　ミョウジ　ナマエ」（3つ目以降がフリガナ）。リレーの泳者も同じ形。
  //  半角カナは全角に直し、設定（カタカナ／ひらがな）にそろえる
  function kanaConv(t, style) {
    t = str(t);
    try { t = t.normalize('NFKC'); } catch (e) { /* ignore */ }
    if (style === 'hira') return t.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    return t.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

  function splitName(name, style) {

    return { kanji: parts.slice(0, 2).join('　'), kana: kanaParts.join('　'), kanjiParts: parts.slice(0, 2), kanaParts };
  }
  // 入力された氏名のフリガナ部分だけを設定の表記にそろえる（漢字の部分はそのまま）
  function normName(name, style) {

    return parts.map((p, i) => i >= 2 ? kanaConv(p, style) : p).join('　');
  }
  function fixTimeText(v) { return typeof v === 'string' ? toHalf(v).trim() : v; }

  // ============================================================================
  //  表彰者算出（JFS表彰者算出マクロ Recalc の移植）
  // ============================================================================
  const N_CAT = 8, N_RANK = 3, EPS = 1e-9, ODD_LOW = 0.5, ODD_HIGH = 1.5;
  const SEX = ['男子', '女子'];
  const isMark = v => v === true || ['○', '〇', '◯'].indexOf(str(v)) >= 0;
  function awardMaster(A) {
    const m = { warn: [] };
    m.cat = A.cats.slice(0, N_CAT).map((c, i) => {
      let name = str(c.name), on = name.length > 0 && name.indexOf('（未設定') !== 0;
      if (!on) name = '（未設定' + (i + 1) + '）';
      return { k: i + 1, name, on, mvp: isMark(c.mvp), exc: isMark(c.exc) };
    });
    m.ev = [];
    A.events.forEach(e => {
      const name = str(e.name);
      if (!name) return;
      const base = [0, 0];
      ['baseM', 'baseF'].forEach((f, sx) => {
        const p = parseTime(e[f], { threeDigit: 'mss' });
        if (p.kind === 'time') base[sx] = p.sec;
        else m.warn.push('「' + name + '」の' + SEX[sx] + '基準タイムが未設定です（達成率を計算できません）');
      });
      m.ev.push({ id: e.id, name, base, mvp: isMark(e.mvp) });
    });
    const clamp = (v, d) => { const n = parseInt(toHalf(str(v)), 10); if (!isFinite(n)) return d; return Math.max(1, Math.min(N_CAT, n)); };
    m.cStart = clamp(A.cStart, 1); m.cEnd = clamp(A.cEnd, N_CAT);
    if (m.cStart > m.cEnd) { const t = m.cStart; m.cStart = m.cEnd; m.cEnd = t; }
    const rm = str(A.rankMode);
    m.rankMax = rm.indexOf('のみ') >= 0 ? 1 : (rm.indexOf('2位') >= 0 && rm.indexOf('3位') < 0 ? 2 : 3);
    let mr = parseFloat(toHalf(str(A.minRate)));
    if (!isFinite(mr)) mr = 0;
    if (mr > 5) mr = mr / 100;
    m.minRate = Math.max(0, mr);
    m.fold = str(A.fold).indexOf('折りたた') >= 0;
    for (let a = 0; a < N_CAT; a++) for (let b = a + 1; b < N_CAT; b++)
      if (m.cat[a].on && m.cat[b].on && m.cat[a].name === m.cat[b].name) m.warn.push('年齢区分名「' + m.cat[a].name + '」が重複しています（区分' + (a + 1) + 'と区分' + (b + 1) + '）');
    for (let a = 0; a < m.ev.length; a++) for (let b = a + 1; b < m.ev.length; b++)
      if (m.ev[a].name === m.ev[b].name) m.warn.push('種目名「' + m.ev[a].name + '」が重複しています');
    if (!m.cat.some(c => c.on)) m.warn.push('年齢区分が1つも設定されていません');
    const TL = '〜';
    m.cond = '区分' + m.cStart + TL + m.cEnd + '・' + (m.rankMax === 1 ? '1位のみ' : m.rankMax === 2 ? '1' + TL + '2位' : '1' + TL + '3位すべて') +
      (m.minRate > 0 ? '・達成率' + (m.minRate * 100).toFixed(1) + '%以上' : '');
    return m;
  }
  const awardKey = (k, sx, evId, rk) => k + '|' + sx + '|' + evId + '|' + rk;

  function computeAwards(A) {
    const m = awardMaster(A);
    const E = m.ev.length, perBlock = E * N_RANK;
    const R = { master: m, rows: [], errRows: [], oddRows: [], sum: { entered: 0, err: 0, noName: 0, offInput: 0, odd: 0, slots: 0, excOk: 0, excNone: 0 } };
    const sum = R.sum;
    const agg = []; // {key,k,sx,rate,i}
    const mvp = [{ i: -1, rate: 0, tie: 0, key: '' }, { i: -1, rate: 0, tie: 0, key: '' }];
    let i = 0;
    for (let k = 1; k <= N_CAT; k++) {
      const cat = m.cat[k - 1];
      for (let sx = 0; sx < 2; sx++) {
        for (let e = 0; e < E; e++) {
          const ev = m.ev[e];
          for (let rk = 1; rk <= N_RANK; rk++) {
            i++;
            const key = awardKey(k, sx, ev.id, rk);
            const inp = A.inputs[key] || {};
            const row = { i, k, sx, e, rk, key, cat, ev, club: str(inp.club), name: str(inp.name), timeRaw: inp.time, base: ev.base[sx], live: cat.on, rate: null, state: '' };
            if (cat.on) sum.slots++;
            const has = str(inp.time) !== '';
            if (has) {
              const p = parseTime(inp.time, { threeDigit: 'mss' });
              if (p.kind !== 'time') { row.state = 'error'; sum.err++; R.errRows.push(i); }
              else {
                row.sec = p.sec;
                if (!cat.on) { sum.offInput++; row.state = 'off'; }
                else if (!(ev.base[sx] > 0)) { row.state = 'nobase'; sum.entered++; }
                else {
                  sum.entered++;
                  const rate = ev.base[sx] / p.sec;
                  row.rate = rate;
                  if (rate < ODD_LOW || rate > ODD_HIGH) { sum.odd++; row.odd = true; R.oddRows.push(i); }
                  let pk;
                  if (!row.name) { sum.noName++; pk = '#' + i; } else pk = row.club + '|' + row.name;
                  row.pkey = pk;
                  if (k >= m.cStart && k <= m.cEnd && cat.mvp && ev.mvp && rk <= m.rankMax && rate >= m.minRate - EPS) {
                    const M = mvp[sx];
                    if (M.i < 0 || rate > M.rate + EPS) { M.i = i; M.rate = rate; M.tie = 0; M.key = pk; M.row = row; }
                    else if (Math.abs(rate - M.rate) <= EPS && M.key !== pk) M.tie++;
                  }
                  const f = agg.find(a => a.k === k && a.sx === sx && a.key === pk);
                  if (f) { if (rate > f.rate + EPS) { f.rate = rate; f.row = row; } }
                  else agg.push({ key: pk, k, sx, rate, row });
                }
              }
            }
            R.rows.push(row);
          }
        }
      }
    }
    // 最優秀
    R.mvp = [0, 1].map(sx => {
      const M = mvp[sx], o = { sx, label: '最優秀選手', sexName: SEX[sx] };
      if (M.i > 0) {
        Object.assign(o, entryOf(M.row, M.rate));
        o.status = '選出（' + m.cond + '）' + (M.tie > 0 ? ' ※同率' + (M.tie + 1) + '名' : '');
        o.kind = 'ok'; o.tie = M.tie;
        o.summary = o.name + '（' + o.catName + '・' + o.event + ' ' + (M.rate * 100).toFixed(2) + '%）' + (M.tie > 0 ? ' ※同率' + (M.tie + 1) + '名あり' : '') + (M.rate > ODD_HIGH ? ' ※達成率が極端なので要確認' : '');
      } else if (sum.entered === 0) { o.status = '未入力（' + m.cond + '）'; o.kind = 'none'; o.summary = '未入力'; }
      else { o.status = '該当者なし（' + m.cond + '）'; o.kind = 'none'; o.summary = '該当者なし（選出範囲の条件を満たす記録がありません）'; }
      return o;
    });
    // 表示する区分
    const disp = [];
    m.cat.forEach(c => { if (c.on || !m.fold) disp.push(c.k); });
    R.disp = disp;
    const better = (a, b) => a.rate > b.rate + EPS || (Math.abs(a.rate - b.rate) <= EPS && a.row.i < b.row.i);
    const top = {};
    agg.forEach(a => {
      const t = top[a.k + '|' + a.sx] = top[a.k + '|' + a.sx] || [null, null];
      if (!t[0]) t[0] = a;
      else if (better(a, t[0])) { t[1] = t[0]; t[0] = a; }
      else if (!t[1]) t[1] = a;
      else if (better(a, t[1])) t[1] = a;
    });
    R.top = top;
    R.exc = [];
    disp.forEach(k => {
      const cat = m.cat[k - 1];
      [0, 1].forEach(sx => {
        const o = { slot: '区分' + k, catName: cat.name, sexName: SEX[sx], k, sx };
        const t = top[k + '|' + sx] || [null, null];
        if (!cat.on) { o.status = '区分未設定（マスタ入力で有効化）'; o.kind = 'off'; }
        else if (!cat.exc) { o.status = '優秀選手の対象外（マスタ設定）'; o.kind = 'off'; }
        else if (!t[0]) { o.status = '未入力'; o.kind = 'none'; sum.excNone++; }
        else {
          let pick = t[0], s = '区分1位選出', kind = 'ok';
          const M = mvp[sx];
          if (M.i > 0 && pick.key === M.key && k === M.row.k) {
            pick = t[1];
            if (!pick) { s = '該当者なし（1位が最優秀選手）'; kind = 'none'; } else { s = '2位繰り上げ（1位が最優秀選手）'; kind = 'up'; }
          }
          if (pick) { Object.assign(o, entryOf(pick.row, pick.rate)); sum.excOk++; } else sum.excNone++;

        }
        R.exc.push(o);
      });
    });
    R.cand = [];
    [0, 1].forEach(sx => disp.forEach(k => {
      const t = top[k + '|' + sx] || [null, null];
      [0, 1].forEach(p => {
        const o = { slot: '区分' + k + '・' + (p + 1) + '位', catName: m.cat[k - 1].name, sexName: SEX[sx], on: m.cat[k - 1].on };
        if (t[p]) { Object.assign(o, entryOf(t[p].row, t[p].rate)); o.time = t[p].row.sec; }
        R.cand.push(o);
      });
    }));
    R.progress = { slots: sum.slots, all: N_CAT * 2 * perBlock, entered: sum.entered, pct: sum.slots ? sum.entered / sum.slots * 100 : 0 };
    R.warnings = [];
    if (sum.err) R.warnings.push('タイムを読み取れない入力: ' + sum.err + '件 → 28.78 / 132.22 / 1:32.22 の形で入れ直してください');
    if (sum.odd) R.warnings.push('達成率が極端（50%未満または150%超）: ' + sum.odd + '件 → タイムの打ち間違いがないか確認してください');
    if (sum.noName) R.warnings.push('選手名が空欄の記録: ' + sum.noName + '件');
    if (sum.offInput) R.warnings.push('未設定の区分に入った記録: ' + sum.offInput + '件（集計対象外）');

    function entryOf(row, rate) {

    }
  }
  // 大会結果（個人の公式順位1〜3位）→ 表彰入力へ
  function awardImportFromResults(state, ind) {
    const A = state.award, m = awardMaster(A);
    const catMap = new Map(), evMap = new Map();
    m.cat.forEach(c => { if (c.on) catMap.set(normKey(c.name), c.k); });
    m.ev.forEach(e => evMap.set(normKey(e.name), e.id));
    const inputs = {}, skipped = new Map();
    let n = 0;

(function setupRefraction() {
  const ua = navigator.userAgent;
  if (!/Chrome\/|Edg\//.test(ua) || /iPhone|iPad|CriOS|FxiOS/.test(ua)) return;
  try {
    const W = 240, H = 120, r = H / 2, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'), img = g.createImageData(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const cx = Math.max(r, Math.min(W - r, x)), dx = x + .5 - cx, dy = y + .5 - r, dist = Math.hypot(dx, dy) || 1;
      const edge = r - dist, zone = r * 0.42;
      let k = edge < zone ? Math.pow(1 - Math.max(0, edge) / zone, 2) : 0;
      if (edge < 0) k = 0;
      const i = (y * W + x) * 4;
      img.data[i] = 128 + (dx / dist) * k * 127; img.data[i + 1] = 128 + (dy / dist) * k * 127; img.data[i + 2] = 128; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const map = cv.toDataURL();
    const ch = (sc, m, res) => '<feDisplacementMap in="SourceGraphic" in2="map" scale="' + sc + '" xChannelSelector="R" yChannelSelector="G" result="d' + res + '"/><feColorMatrix in="d' + res + '" type="matrix" values="' + m + '" result="c' + res + '"/>';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true"><filter id="lgRefract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">' +
      '<feImage href="' + map + '" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="map" scale="28" xChannelSelector="R" yChannelSelector="G"/></filter></svg>';   // 色を分けない（七色のにじみを出さない）
    document.body.insertAdjacentHTML('beforeend', svg);
    document.documentElement.classList.add('refract');

})();

  const rows = (D.sched.rows || []).filter(r => r.name && !r.isBreak).map(r => {
    const its = all.filter(it => it.program === r.name && it.event);
    const done = its.filter(it => it.status && it.status !== '未入力').length;
    return { r, n: its.length, done, state: !its.length ? 'empty' : done === its.length ? 'done' : done ? 'doing' : 'todo' };
  });
  const cur = rows.find(x => x.state === 'doing' || x.state === 'todo');   // 進行順で最初の、入力が終わっていない種目
  const next = cur ? rows.slice(rows.indexOf(cur) + 1).find(x => x.state === 'todo' || x.state === 'doing') : null;
  const started = rows.some(x => x.done > 0);
  return { rows, cur, next, started, finished: rows.length > 0 && rows.every(x => x.state === 'done' || x.state === 'empty') };
}
function delayText(cur, started) {
  if (!cur || cur.r.start === null || cur.r.start === undefined) return null;
  const d = new Date(), now = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const diff = Math.round((now - cur.r.start) / 60);

  if (!started && diff < 0) return { cls: 'info', t: '競技開始まで ' + (-diff) + '分' };
  if (diff > 2) return { cls: diff > 10 ? 'err' : 'warn', t: '予定より ' + diff + '分遅れ', diff };
  if (diff < -2) return { cls: 'ok', t: '予定より ' + (-diff) + '分早い', diff };
  return { cls: 'ok', t: 'ほぼ予定どおり', diff: 0 };
}

/* ---------------------------------------------------------------- 画面: プログラム・記録入力 */
function programOptions() {
  const order = [];
  state.schedule.forEach(r => { const n = C.str(r.name); if (n && n !== '休憩' && order.indexOf(n) < 0) order.push(n); });
  C.programNames(state).forEach(n => { if (order.indexOf(n) < 0) order.push(n); });
  return order;
}
function programData(name) {
  const relay = C.isRelayName(name), src = relay ? D.rel : D.ind;
  const items = src.filter(it => it.program === name && it.event);
  const heats = new Map();
  items.forEach(it => { if (!heats.has(it.heat)) heats.set(it.heat, []); heats.get(it.heat).push(it); });
  const hs = [...heats.keys()].sort((a, b) => a - b).map(h => ({ heat: h, items: heats.get(h).sort((a, b) => (a.lane || 99) - (b.lane || 99)) }));
  const sch = D.sched.rows.find(r => r.name === name);
  const done = items.filter(it => it.status !== '未入力').length;
  return { relay, items, heats: hs, sch, done };
}
VIEWS.program = () => {
  const opts = programOptions();
  if (!ui.prog || opts.indexOf(ui.prog) < 0) ui.prog = opts[0] || '';
  const p = programData(ui.prog);
  const idx = opts.indexOf(ui.prog);
  const lanes = C.laneList(state.settings).slice().sort((a, b) => a - b);
  const pct = p.items.length ? Math.round(p.done / p.items.length * 100) : 0;

  // 1組ずつ表示のときの組（未指定なら、まだ入力していないレーンがある最初の組）

  if (curHeat === null) { const h0 = p.heats.find(h => h.items.some(it => it.status === '未入力')) || p.heats[0]; curHeat = h0 ? h0.heat : null; }
  return '<div class="vhead"><div><h1 class="view">プログラム・記録入力</h1><p class="lead">公式タイムを入れて Enter で次のレーンへ進みます。棄権・失格は「判定」で選びます（失格でも泳いだタイムは入れられます）。黄色の行は打ち間違いの可能性があります。当日モード中でも入力できます。</p></div></div>' +

    '<button class="btn" data-act="progStep" data-d="1" ' + (idx >= opts.length - 1 ? 'disabled' : '') + ' aria-label="次の種目">' + '→' + '</button>' +
    (ui.prog ? '<span class="pill mute">' + (p.sch ? 'No.' + p.sch.no + '・開始 ' + (p.sch.start !== null ? C.fmtClock(p.sch.start) : '—') : '<span style="color:var(--err)">スケジュール未登録</span>') + '</span><span class="pill mute">' + p.items.length + (p.relay ? 'チーム' : '名') + '・' + p.heats.length + '組</span>' +
      '<span class="pill ' + (allDone ? 'ok' : 'info') + '">入力 ' + p.done + ' / ' + p.items.length + '</span>' + (p.items.some(it => it.seatFixed) ? '<span class="pill mute" title="「組・レーンを入れ替え」で手で並べた位置を使っています">手で並べ替え済み</span>' : '') : '') +
    '</div><div class="bar rbar"><button class="btn" data-act="clearOut" data-all="0" ' + (p.items.some(it => it.status === '対象外') ? '' : 'disabled') + '>この種目の対象外を解除</button>' +
    (ui.prog && p.items.length ? (ui.progArrange ? '<button class="btn primary" data-act="progArrange">入れ替えを終える</button>' : '<button class="btn tinted" data-act="progArrange">組・レーンを入れ替え</button>') : '') + (ui.prog && p.items.length ? '<button class="btn" data-act="printProg" data-all="0">この種目を印刷</button>' : '') + '<span class="pmodes">' + sel('set:print.progMode', state.settings.print.progMode || 'blank', [['blank', '印刷: 手書き用（記録欄が空欄）'], ['result', '印刷: 記録入り']], 'class="pmode" aria-label="プログラムの印刷の形"') + sel('set:print.progFill', state.settings.print.progFill || 'blank', [['blank', '4組に満たない所: 空白'], ['pack', '4組に満たない所: 次の種目を詰める']], 'class="pmode" aria-label="4組に満たないページ"') + '</span></div>' +
    (ui.prog && p.items.length ? '<div class="prog" style="margin:-4px 0 10px"><i style="width:' + pct + '%"></i></div>' : '') +
    (allDone && ui._doneNote !== ui.prog ? (ui._doneNote = ui.prog, setTimeout(() => toast('「' + ui.prog + '」の記録入力が終わりました', null, 10000, idx < opts.length - 1 ? { label: '次の種目へ', fn: () => ACTIONS.progStep({ dataset: { d: '1' } }) } : null), 0), '') : '') +
    (false ? '<div class="notice ok"><span class="grow">この種目の記録入力が終わりました。</span><button class="btn sm" data-act="printFlash1" data-p="' + esc(ui.prog) + '">速報を印刷</button>' + (idx < opts.length - 1 ? '<button class="btn sm primary" data-act="progStep" data-d="1">次の種目へ →</button>' : '') + '</div>' : '') +
    (ui.progArrange && ui.prog && p.items.length ? arrangePanel(p, lanes) :
    (p.heats.length > 1 ? '<div class="heattabs" hidden><span class="small muted">組</span>' + seg('progHeat', p.heats.map(h => [h.heat, '第' + h.heat + '組' + (h.items.every(it => it.status !== '未入力') ? ' ✓' : '')]), curHeat) + '</div>' : '') +
    (!ui.prog ? '<div class="card empty">種目がありません。大会設定で種目を登録してください。</div>' :
      (p.items.length ? '<div class="heats prog-h fill" data-fill-id="prog">' + p.heats.map(h => {
        const byLane = new Map(h.items.map(it => [it.lane, it]));
        const noLane = h.items.filter(it => !it.lane);
        const hDone = h.items.every(it => it.status !== '未入力');
        return '<div class="tablewrap pw' + (h.heat === curHeat ? ' cur' : '') + '" data-heat="' + h.heat + '"><table class="t pt' + (p.relay ? ' prel' : '') + '"><colgroup><col class="c-ln"><col><col class="c-mt"><col class="c-tm"><col class="c-jd"><col class="c-rk"></colgroup>' +
          '<thead><tr class="ph"><th colspan="6">第 ' + h.heat + ' 組' + (hDone ? '　<span class="pill ok">✓ 入力済み</span>' : '') + '</th></tr><tr class="pc"><th class="c">レーン</th><th>' + (p.relay ? 'チーム・泳者' : '氏名・チーム') + '</th><th>区分・申込</th><th>公式タイム</th><th>判定</th><th class="c">順位</th></tr></thead><tbody>' +
          lanes.map(ln => byLane.get(ln)).concat(noLane).map((it, j) => {
            if (!it) return '<tr class="emp"><td class="c ln"><span class="lane">' + lanes[j] + '</span></td><td colspan="5" class="muted small">（空き）</td></tr>';
            const pre = (p.relay ? 'rel:' : 'ent:') + it.id + ':';
            const src = p.relay ? it.r : it.e;
            const iss = (D.issuesById.get(it.id) || []).filter(x => /タイム|中央値/.test(x.msg));
            const who = p.relay ? it.teamDisp : it.np.kanji, sub = p.relay ? it.memberText : it.club;
            const entry = it.pe.kind === 'time' ? C.fmtTime(it.pe.sec) : '';
            return '<tr data-row="' + it.id + '" class="' + (iss.length ? 'warn' : '') + '" title="' + esc(iss.map(x => x.msg).join('\n')) + '"><td class="c ln"><span class="lane">' + (it.lane || '?') + '</span></td>' +
              (p.relay ? '<td class="nm rnm"><div class="one"><b>' + esc(who) + '</b><span class="rcat">' + esc(it.cat) + '</span>' + (iss.length ? ' <span class="pill warn">要確認</span>' : '') + '</div>' + relayGrid(it, true) + '</td>' :
              '<td class="nm"><div class="one fit"><b>' + rubyName(it.np) + '</b></div><div class="one sub fit">' + (iss.length ? '<span class="pill warn">要確認</span> ' : '') + esc(sub) + '</div></td>') +
              '<td class="mt"><div class="one fit">' + esc(it.cat) + (it.combined ? ' <span class="pill comb" title="合同レース「' + esc(it.combined) + '」で泳ぐ（記録証・順位はエントリー種目のまま）">合同</span>' : '') + (it.event !== ui.prog ? ' <span class="pill mute">' + esc(it.event.split(' ')[0]) + '</span>' : '') + '</div><div class="one sub num">' + (entry ? '申込 ' + entry : '　') + '</div></td>' +
              '<td class="tm"><div class="tbox">' + timeCell(pre + 'officialTime', src.officialTime, '', 'data-col="prog" aria-label="' + esc(who) + ' 公式タイム"') + '</div></td>' +
              '<td class="jd">' + judgeBtns(pre + 'judge', src.judge) + '</td><td class="c rk"><b>' + (it.rank ? it.rank + '位' : it.status === '失格' || it.status === '棄権' || it.status === '対象外' ? '<span class="pill ' + (it.status === '失格' ? 'err' : it.status === '対象外' ? 'mute' : 'warn') + '">' + it.status + '</span>' : '') + '</b></td></tr>';
          }).join('') + '</tbody></table></div>';
      }).join('') + '</div>' : '<div class="card empty">この種目のエントリーはありません。</div>')));
};
// レーンで検索して割り当て: 空きレーンを押す（または検索欄に入れる）→ 候補から「ここへ」
function arrSearch(p) {
  const t = ui.arrTarget, q = C.normKey(ui.arrQ || '');
  if (!t && !q) return '';
  const list = p.items.filter(it => !q || C.normKey(it.name + (it.teamDisp || '') + (it.members || []).join('') + it.club).indexOf(q) >= 0).slice(0, 24);
  return '<div class="card arrs"><div class="bar" style="margin:0 0 6px">' + (t ? '<b>第' + t.h + '組 ' + t.l + 'レーンに入れる選手</b>' : '<b>検索結果</b>') + '<span class="muted small">' + list.length + '件</span><span class="grow"></span>' + (t ? '<button class="btn sm" data-act="arrTargetOff">やめる</button>' : '') + '</div>' +
    (list.length ? '<div class="arrs-list">' + list.map(it => '<div class="arrs-row"><span class="lane">' + it.lane + '</span><span class="grow"><b>' + (p.relay ? esc(it.teamDisp) : rubyName(it.np)) + '</b> <span class="muted small">第' + it.heat + '組・' + esc(p.relay ? it.memberText : it.club) + '</span></span>' +
      (t ? '<button class="btn sm primary" data-act="arrPut" data-id="' + esc(it.id) + '">ここへ入れる</button>' : '<button class="btn sm" data-act="seatPick" data-id="' + esc(it.id) + '">選ぶ</button>') + '</div>').join('') + '</div>' : '<p class="small muted">見つかりません。</p>') + '</div>';
}
// 組・レーンの入れ替え（ドラッグ＆ドロップ、またはタップで選んで行き先をタップ）
function arrangePanel(p, lanes) {
  // 組・レーンの入れ替え。説明文や検索欄は置かず、レーンの枠の中で操作する（空きレーンを押すとその枠で検索）。
  // 「ほかの種目も並べる」で別の種目を下に並べると、種目をまたいでタップ／ドラッグで移せる
  const relay = p.relay;
  const others = programOptions().filter(n => n !== ui.prog && C.isRelayName(n) === relay && programData(n).items.length);
  if (ui.arrOther && others.indexOf(ui.arrOther) < 0) ui.arrOther = '';
  const anyFixed = p.items.some(it => it.seatFixed);
  const bar = '<div class="bar arrbar">' + sel('ui:arrOther', ui.arrOther || '', [['', 'ほかの種目は並べない']].concat(others.map(n => [n, 'ほかの種目も並べる: ' + n])), 'aria-label="ほかの種目も並べる"') +
    '<span class="grow"></span><button class="btn sm" data-act="seatReset" ' + (anyFixed ? '' : 'disabled') + '>ロックを外して自動に戻す</button>' + (ui.arrOther ? '<button class="btn" data-act="combineOther">「' + esc(ui.arrOther) + '」と合同にする</button>' : '') + '</div>';
  const head = n => '<h3 class="arr-sep">' + (isCombProg(n) ? '<span class="pill comb">合同</span> ' : '') + esc(n) + '</h3>';
  if (!ui.arrOther) return bar + '<div class="arr-wrap fill" data-fill-id="arr">' + arrHeats(p, ui.prog, lanes) + '</div>';
  // 2つの種目を並べるときは、種目を左右に・組は縦に（隣同士で見比べてドラッグ）
  return bar + '<div class="arr-wrap fill arr-cols" data-fill-id="arr"><div class="arr-col">' + head(ui.prog) + arrHeats(p, ui.prog, lanes) + '</div><div class="arr-col">' + head(ui.arrOther) + arrHeats(programData(ui.arrOther), ui.arrOther, lanes) + '</div></div>';
}
function arrHeats(p, prog, lanes) {
  const maxH = Math.max(0, ...p.items.map(it => it.heat || 0));
  const card = it => {
    const who = p.relay ? it.teamDisp : it.np.kanji;
    const entry = it.pe.kind === 'time' ? C.fmtTime(it.pe.sec) : '';
    const nMem = p.relay ? it.members.filter(Boolean).length : 4;
    if (p.relay) {     // リレー: 1行目にチーム名（大きく）、2行目以降に泳者4人（漢字・2行まで）。文字は縮めない
      return '<button type="button" class="pcard rcard' + (ui.arrSel === it.id ? ' sel' : '') + (it.seatFixed ? ' locked' : '') + '" data-act="seatPick" data-id="' + esc(it.id) + '" data-prog="' + esc(prog) + '" aria-label="' + esc(who) + '（第' + it.heat + '組 ' + it.lane + 'レーン）">' +
        '<span class="rc-top"><b class="rc-team">' + esc(who) + '</b><span class="rc-cat">' + esc(it.cat) + '</span>' + (nMem < 4 ? '<span class="et short" title="泳者が足りません">' + nMem + '/4人</span>' : entry ? '<span class="et">' + esc(entry) + '</span>' : '') + '</span>' +
        relayGrid(it, false) + '</button>';
    }
    return '<button type="button" class="pcard' + (ui.arrSel === it.id ? ' sel' : '') + (it.seatFixed ? ' locked' : '') + '" data-act="seatPick" data-id="' + esc(it.id) + '" data-prog="' + esc(prog) + '" aria-label="' + esc(who) + '（第' + it.heat + '組 ' + it.lane + 'レーン）">' +
      '<span class="fit nm"><b>' + (p.relay ? esc(who) : rubyName(it.np)) + '</b></span><span class="fit sub">' + (p.relay ? rubyMembers(it) : esc(it.club)) + '・' + esc(it.cat) + '</span>' + (p.relay && nMem < 4 ? '<span class="et short" title="泳者が足りません">' + nMem + '/4人</span>' : '<span class="et">' + esc(entry) + '</span>') + '</button>';
  };
  const tgt = (h, l) => ui.arrTarget && ui.arrTarget.prog === prog && ui.arrTarget.h === h && ui.arrTarget.l === l;
  const emptySlot = (h, l) => {
    if (!tgt(h, l)) return '<button type="button" class="slot-empty" data-act="seatPick" data-prog="' + esc(prog) + '" aria-label="第' + h + '組 ' + l + 'レーン（空き）">空き</button>';
    const q = C.normKey(ui.arrQ || ''), pool = p.items.concat(ui.arrOther && prog !== ui.arrOther ? programData(ui.arrOther).items : ui.arrOther ? programData(ui.prog).items : []);
    const list = pool.filter(it => !q || C.normKey(it.name + (it.teamDisp || '') + (it.members || []).join('') + it.club).indexOf(q) >= 0).slice(0, 12);
    return '<div class="slot-q"><input data-k="ui:arrQ" value="' + esc(ui.arrQ || '') + '" placeholder="名前で検索して入れる" aria-label="このレーンに入れる選手を検索"><button type="button" class="sq-x" data-act="arrTargetOff" aria-label="やめる">×</button>' +
      '<div class="sq-list">' + (list.length ? list.map(it => '<button type="button" data-act="arrPut" data-id="' + esc(it.id) + '"><b>' + esc(p.relay ? it.teamDisp : it.np.kanji) + '</b><span>' + esc((it.program !== prog ? it.program + '・' : '') + '第' + it.heat + '組' + it.lane + 'レーン') + '</span>' + (p.relay ? '<small class="sq-mem">' + esc(it.memberNames.filter(m => m.kanji).map(m => m.kanji.replace(/　/g, ' ')).join('・')) + '</small>' : '') + '</button>').join('') : '<p>見つかりません</p>') + '</div></div>';
  };
  const heat = (h, isNew) => {
    const its = p.items.filter(it => it.heat === h);
    const allLocked = its.length && its.every(it => it.seatFixed);
    return '<div class="arh card' + (isNew ? ' newh' : '') + (allLocked ? ' hlocked' : '') + '"><div class="arh-h"><b>' + (isNew ? '新しい組（第' + h + '組）' : '第' + h + '組') + '</b>' +
      (!isNew ? '<button type="button" class="btn sm hlock' + (allLocked ? ' on' : '') + '" data-act="heatLock" data-h="' + h + '" data-prog="' + esc(prog) + '" ' + (its.length ? '' : 'disabled') + '>' + icon(allLocked ? 'lock' : 'unlock', 'ic sm') + (allLocked ? 'ロック中' : '組ロック') + '</button>' : '') + '</div>' +
      lanes.map(l => { const it = its.find(x => x.lane === l); return '<div class="slot" data-h="' + h + '" data-l="' + l + '" data-prog="' + esc(prog) + '"><span class="lane">' + l + '</span>' + (it ? card(it) + (p.relay ? '<button type="button" class="lockb memb' + (it.members.filter(Boolean).length < 4 ? ' short' : '') + '" data-act="relMem" data-id="' + esc(it.id) + '" aria-label="泳者を検索して追加・交代" title="泳者を検索して追加・交代">' + icon('entries', 'ic sm') + '</button>' : '') + '<button type="button" class="lockb' + (it.seatFixed ? ' on' : '') + '" data-act="seatLock" data-id="' + esc(it.id) + '" aria-label="ロック">' + icon(it.seatFixed ? 'lock' : 'unlock', 'ic sm') + '</button>' : emptySlot(h, l)) + '</div>'; }).join('') + '</div>';
  };
  return '<div class="arr' + (p.relay ? ' rel' : '') + '">' + Array.from({ length: maxH }, (_, i) => heat(i + 1)).join('') + heat(maxH + 1, true) + '</div>';
}

/* ---------------------------------------------------------------- 画面: 速報 */

  if (!ui.flash || opts.indexOf(ui.flash) < 0) ui.flash = opts[0] || '';
  const list = C.flashList(state, D.ind, D.rel, ui.flash);

    '<div class="bar">' + sel('ui:flash', ui.flash, opts, ui.flashFollow !== false ? 'disabled' : '') + '<label class="small"><input type="checkbox" data-k="ui:flashFollow" ' + (ui.flashFollow !== false ? 'checked' : '') + '> 記録入力中の種目に自動で合わせる</label><span class="grow"></span><label class="small"><input type="checkbox" data-k="ui:big" ' + (ui.big ? 'checked' : '') + '> 大きな文字で表示</label><button class="btn" data-act="printFlash">速報を印刷</button></div>' +
    '<div class="' + (ui.big ? 'big' : '') + '"><div class="card flash-h" style="margin-bottom:10px"><b class="nowrap" style="font-size:' + (ui.big ? 26 : 17) + 'px">' + esc(ui.flash || '') + '</b>' + (sch ? '<span class="muted nowrap">競技No.' + sch.no + '</span><span class="muted nowrap">開始予定 ' + C.fmtClock(sch.start) + '</span>' : '') + '<span class="muted nowrap">対象 ' + list.length + (relay ? 'チーム' : '名') + '</span></div>' +
    (list.length ? '<div class="tablewrap fill" data-fill-id="flash"><table class="t"><thead><tr><th class="c">順位</th><th>' + (relay ? '泳者' : '選手名') + '</th><th>' + (relay ? 'チーム' : 'クラブ名') + '</th><th class="hide-xs">年齢区分</th><th class="num">公式タイム</th></tr></thead><tbody>' +
      list.map(x => { const g = x.it.cat !== prevCat; prevCat = x.it.cat; return (g ? '<tr class="grp"><td colspan="5">' + esc(x.it.cat) + '</td></tr>' : '') + '<tr><td class="c"><b>' + esc(x.rank) + '</b></td><td>' + (relay ? esc(x.name) : rubyName(x.it.np)) + '</td><td>' + esc(x.club) + '</td><td class="hide-xs">' + esc(x.cat) + '</td><td class="num">' + esc(x.time) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '<div class="card empty">この種目のエントリーはありません。</div>') + '</div>';
};

/* ---------------------------------------------------------------- 画面: ランキング */
VIEWS.ranking = () => {
  const S = state.settings;
  const evs = S.events.filter(Boolean);
  if (!ui.rankEv || evs.indexOf(ui.rankEv) < 0) ui.rankEv = evs[0] || '';
  const relay = C.isRelayName(ui.rankEv), src = relay ? D.rel : D.ind;
  const cats = ui.rankCat ? [ui.rankCat] : S.categories.filter(c => src.some(it => it.event === ui.rankEv && it.cat === c));
  const body = cats.map(c => {
    const list = src.filter(it => it.event === ui.rankEv && it.cat === c && it.rank).sort((a, b) => a.rankOrder - b.rankOrder);
    return '<div class="tablewrap" style="margin-bottom:10px"><table class="t"><thead><tr><th colspan="5" style="color:var(--ink);font-size:13px">' + esc(ui.rankEv) + '　' + esc(c) + '</th></tr><tr><th class="c">順位</th><th>' + (relay ? 'チーム名' : '氏名') + '</th><th>' + (relay ? '出場メンバー' : 'チーム名') + '</th><th>区分</th><th class="num">公式タイム</th></tr></thead><tbody>' +
      (list.length ? list.map(it => '<tr><td class="c"><b>' + it.rank + '</b></td><td>' + (relay ? esc(it.teamDisp) : rubyName(it.np)) + (it.combined ? ' <span class="pill comb" title="合同レース「' + esc(it.combined) + '」で泳ぐ（記録証・順位はエントリー種目のまま）">合同</span>' : '') + '</td><td>' + (relay ? relayGrid(it, true) : esc(it.club)) + '</td><td>' + esc(it.cat) + '</td><td class="num">' + esc(it.officialText) + '</td></tr>').join('') : '<tr><td colspan="5" class="muted">記録がまだありません</td></tr>') +
      '</tbody></table></div>';
  }).join('');
  return '<h1 class="view">公式ランキング</h1><p class="lead">種目・区分ごとの公式順位です。同タイムは同順位になります。</p>' +
    '<div class="bar">' + sel('ui:rankEv', ui.rankEv, evs) + sel('ui:rankCat', ui.rankCat || '', blankOpt('記録のある全区分').concat(S.categories.filter(Boolean))) + '<span class="grow"></span><button class="btn" data-act="printRank">ランキングを印刷</button></div>' +
    (body ? '<div class="heats fill" data-fill-id="rank">' + body + '</div>' : '<div class="card empty">この種目のエントリーはありません。</div>');
};

function certPaper() { return (state.settings.print || {}).certPaper === 'A5' ? 'A5' : 'A4'; }
function certData(it, relay, prize) {
  const S = state.settings, W = prize ? S.award : S.cert;
  const blank = '　　分　　秒　　';
  let record;
  if (it.status === '棄権') record = '棄権';
  else if (it.status === '失格') record = it.flashTime ? it.flashTime + '　失格' : '失格';
  else if (!C.str((relay ? it.r : it.e).officialTime) || (!prize && !S.cert.printRecord)) record = blank;
  else record = it.officialText;
  let rank;
  if (prize) rank = '第 ' + it.rank + ' 位';
  else if (it.status === '棄権' || it.status === '失格') rank = '';
  else if (!C.str((relay ? it.r : it.e).officialTime) || !S.cert.printRecord) rank = '第　　位';
  else rank = it.rank ? '第 ' + it.rank + ' 位' : '';
  return {
    title: W.title, name: (relay ? it.teamDisp : it.np.kanji) + '  殿', club: !relay && it.club ? 'クラブ名： ' + it.club : '',
    mem1: relay ? [it.memberNames[0].kanji, it.memberNames[1].kanji].filter(Boolean).join('　/　') : '', mem2: relay ? [it.memberNames[2].kanji, it.memberNames[3].kanji].filter(Boolean).join('　/　') : '',
    rank, event: '種目： ' + it.cat + ' ' + it.event, record: '記録： ' + record, meet: S.meetName, lines: W.lines, date: C.reiwa(W.date), org: W.organizer
  };
}
function certHTML(it, relay, prize, paper, preview) {
  // 位置は用紙の高さに対する割合で置く（プリンターの余白があっても、用紙いっぱいに同じ配置で収まる）
  const P = PAPER[certPaper()], L = relay ? P.rel : P.ind, S = state.settings, d = certData(it, relay, prize);
  const sc = (C.num(S.print.scale) || 100) / 100, dy = C.num(S.print.offsetTop), dx = C.num(S.print.offsetLeft);
  const pct = mm => (mm / P.h * 100).toFixed(3) + '%';
  const at = (key, txt, extra, html) => { const [top, pt] = L[key]; return '<div class="cl ' + (extra || '') + (html && /<rt>/.test(html) ? ' hasruby' : '') + '" style="left:' + dx + 'mm;right:' + (-dx) + 'mm;top:' + pct(top * sc + dy) + ';font-size:' + (pt * sc) + 'pt">' + (html || esc(txt)) + '</div>'; };
  const kana = S.print.certKana !== false;      // 証書の名前の上にフリガナ
  const memH = ms => kana ? ms.filter(m => m.kanji).map(m => '<span class="nw">' + rubyName(m) + '</span>').join('　/　') : '';
  let h = at('title', d.title, 'title') + at('name', d.name, 'name', !relay && kana && it.np.kana ? rubyName(it.np) + '&ensp;殿' : '');
  if (relay) h += at('mem1', d.mem1, '', memH(it.memberNames.slice(0, 2))) + at('mem2', d.mem2, '', memH(it.memberNames.slice(2, 4))); else if (d.club) h += at('club', d.club);
  h += at('rank', d.rank, 'name') + at('event', d.event) + at('record', d.record) + at('meet', d.meet);
  const [lt, lpt, lgap] = L.lines;
  d.lines.forEach((t, i) => { h += '<div class="cl" style="left:' + dx + 'mm;right:' + (-dx) + 'mm;top:' + pct((lt + i * lgap) * sc + dy) + ';font-size:' + (lpt * sc) + 'pt">' + esc(t) + '</div>'; });
  h += at('date', d.date) + at('org', d.org, 'name');
  const kind = prize ? 'prize' : 'record';
  const fr = frameUrlFor(kind) ? '<div class="cframe fr-' + kind + '"></div>' : '';
  const style = preview ? 'width:' + P.w + 'mm;height:' + P.h + 'mm;transform:scale(' + preview + ');transform-origin:top left' : '';
  return '<div class="cert' + (P === PAPER.A5 ? ' a5' : '') + (preview ? ' pvcert' : '') + '" style="' + style + '">' + fr + h + '</div>';
}

function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] === undefined) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o === undefined || o === null) ? undefined : o[k], obj); }
const ENT_LOCK_OK = ['officialTime', 'judge'];
function setUI(f, val) {
  if (f === 'awCat') val = +val;
  if (f === 'prog') { ui._focusFirst = true; ui.progHeat = null; ui.arrSel = null; }
  if (f === 'progHeat') { val = +val; ui._focusFirst = true; }
  ui[f] = val;
  if (f.indexOf('ent') === 0 && f !== 'entPage') ui.entPage = 0;
  if (f === 'certKind' || f === 'certTarget') { ui.certFilter = {}; ui.certFrom = 1; ui.certTo = ''; }
  if (f === 'renKind') ui.renFrom = '';
  save(); render();
}
// 時刻の入力をそろえる: 845 / 8.45 / ８：４５ → 8:45。空欄は ''。読めないときは null
function clockText(raw) {
  const t = String(raw || '').replace(/[０-９：．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\s/g, '');
  if (!t) return '';
  let m = t.match(/^(\d{1,2})[:.](\d{1,2})$/) || t.match(/^(\d{1,2})(\d{2})$/);
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return null;
  return h + ':' + String(mi).padStart(2, '0');
}
function handleValue(el) {
  const k = el.dataset.k;
  if (!k) return;
  delete el.dataset.dirty;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  const [kind, ...rest] = k.split(':');
  if (kind === 'ui' && rest[0] === 'snapAll') { ui.snapSel = val ? getSnaps().map(x => x.t) : []; render(); return; }
  if (kind === 'ui') { setUI(rest[0], val); return; }
  if (kind === 'hub') { const k = rest.join(':'); ui.hubSel = (ui.hubSel || []).filter(x => x !== k); if (val) ui.hubSel.push(k); ui.hubFocus = ''; render(); return; }
  if (kind === 'frshow' || kind === 'frsame') {
    commit('フレームの設定', st => { const f = st.settings.certFrame = frameCfg(); if (kind === 'frsame') { f.same = !!val; if (!val) { f.prize = f.record; f.show.prize = f.show.record; if (f.record === 'custom') { const im = frameImg('record'); try { if (im) localStorage.setItem(FRAME_IMG_KEY('prize'), im); } catch (e) { /* ignore */ } } } } else f.show[rest[0]] = !!val; }, { allowLocked: true });
    return;
  }
  if (kind === 'snap') { const t = +rest[0]; ui.snapSel = (ui.snapSel || []).filter(x => x !== t); if (val) ui.snapSel.push(t); render(); return; }
  if (kind === 'cf') { ui.certFilter = Object.assign({}, ui.certFilter, { [rest[0]]: val }); ui.certFrom = 1; ui.certTo = ''; render(); return; }
  if (kind === 'set') {
    const path = rest.join(':');
    let v = val;
    if (path === 'points.relayMult') v = +val;
    if (path === 'cert.printRecord') v = val === '1';
    if (getPath(state.settings, path) === v) return;
    if (/^schedule\.(doorOpen|warmup|opening|start|closing|exit)$/.test(path)) {
      v = clockText(val);
      if (v === null) { toast('「' + val + '」を時刻として読み取れません。8:45 のように入れてください', 'err'); render(); return; }
      if (getPath(state.settings, path) === v) return;
    }
    const free = /^schedule\.(doorOpen|warmup|opening|start|closing|exit|intervalMin|breakMin|cycleSec)$/.test(path) || /^(cert|award|print)\./.test(path) || /^dashboard\./.test(path) || path === 'kanaStyle';
    if (path === 'kanaStyle') {      // 表記を変えたら、入力済みのフリガナもすべてそろえる
      commit('フリガナの表記を' + (v === 'hira' ? 'ひらがな' : 'カタカナ') + 'に変更', s => {
        s.settings.kanaStyle = v;

        s.relays.forEach(r => { r.members = (r.members || []).map(m => m ? C.normName(m, v) : m); });
      }, { allowLocked: true });
      toast('フリガナを' + (v === 'hira' ? 'ひらがな' : 'カタカナ') + 'にそろえました', null, 6000, { label: '元に戻す', fn: undo });
      return;
    }
    commit('設定の変更', s => {

      else setPath(s.settings, path, v);

    return;
  }
  if (kind === 'dur') {
    const sec = C.parseDuration(val);
    if (sec === null) { toast('「' + val + '」を時間として読み取れません。1:30 のように 分:秒 で入れてください', 'err'); render(); return; }
    commit('時間設定の変更', s => { s.settings.schedule[rest[0]] = sec; });

  }
  if (kind === 'clubt') { const name = rest.join(':'); commit('クラブ目標の変更', s => { const c = s.settings.clubs.find(x => x.name === name); if (c) c.target = val; }, { allowLocked: true }); return; }
  if (kind === 'list') { return changeList(rest[0], val, el); }
  if (kind === 'comb') {
    const i = +rest[0];
    commit('合同レースの変更', s => {
      while (s.settings.combined.length <= i) s.settings.combined.push({ name: '', pairs: [{}, {}, {}] });
      const r = s.settings.combined[i];
      if (rest[1] === 'name') r.name = val.trim();
      else { const p = +rest[1]; r.pairs = r.pairs || [{}, {}, {}]; r.pairs[p] = Object.assign({}, r.pairs[p], { [rest[2]]: val }); }
    });
    return;
  }
  if (kind === 'ent' || kind === 'rel') {
    const id = rest[0], f = rest[1];
    const list = kind === 'ent' ? state.entries : state.relays;
    const row = list.find(x => x.id === id);
    if (!row) return;
    // 漢字とフリガナを別の欄で入力（保存は「苗字　名前　ミョウジ　ナマエ」のまま）
    const part = f === 'nameK' || f === 'nameF' ? { field: 'name', idx: -1, kana: f === 'nameF' } : /^m[KF]\d$/.test(f) ? { field: 'm' + f[2], idx: +f[2], kana: f[1] === 'F' } : null;
    if (part) {
      const old = part.idx >= 0 ? (row.members[part.idx] || '') : (row.name || '');
      const np = C.splitName(old, state.settings.kanaStyle);
      const kanji = part.kana ? np.kanji : C.fixName(val), kana = part.kana ? C.fixName(val) : np.kana;
      const nv = C.normName([kanji, kana].filter(Boolean).join('　'), state.settings.kanaStyle);
      if (nv === old) return;
      commit((kind === 'ent' ? '個人' : 'リレー') + 'の氏名の変更', s => { const r = (kind === 'ent' ? s.entries : s.relays).find(x => x.id === id); if (part.idx >= 0) r.members[part.idx] = nv; else r.name = nv; });
      return;
    }
    const cur = f[0] === 'm' && f.length === 2 ? row.members[+f[1]] : row[f];
    let v = val;
    if (f === 'name' || f === 'team' || f === 'mark' || f[0] === 'm') v = val.replace(/^[\s　]+|[\s　]+$/g, '');
    if (f === 'name' || (f[0] === 'm' && f.length === 2)) v = C.normName(v, state.settings.kanaStyle);   // 空白をそろえ、フリガナを設定の表記へ自動で変換
    if (f === 'entryTime' || f === 'officialTime') v = C.fixTimeText(val);
    if ((cur || '') === v) return;
    commit((kind === 'ent' ? '個人' : 'リレー') + 'の変更', s => {
      const r = (kind === 'ent' ? s.entries : s.relays).find(x => x.id === id);
      if (f[0] === 'm' && f.length === 2) r.members[+f[1]] = v; else r[f] = v;
    }, { allowLocked: ENT_LOCK_OK.indexOf(f) >= 0 });
    return;
  }
  if (kind === 'sch') {
    const id = rest[0], f = rest[1];
    let v = val;
    if (f === 'at') {                // 開始時刻: 「845」「8.45」「8：45」も 8:45 に。空欄＝自動に戻す
      v = clockText(val);
      if (v === null) { toast('「' + val + '」を時刻として読み取れません。8:45 のように入れてください', 'err'); render(); return; }
      const cur = D.sched.rows.find(o => o.row.id === id);
      if (v && cur && !cur.fixed && cur.start !== null && cur.start !== undefined && C.parseClock(v) === cur.start) { render(); return; }
    }
    commit(f === 'at' ? (v ? '開始時刻を ' + v + ' に変更' : '開始時刻を自動に戻す') : 'スケジュールの変更', s => { const r = s.schedule.find(x => x.id === id); if (r) r[f] = v; }, { allowLocked: f === 'at' || f === 'adj' });
    return;
  }
  if (kind === 'awm') { commit('表彰マスタの変更', s => { s.award[rest[0]] = val; }, { allowLocked: true }); return; }
  if (kind === 'awc') {
    const i = +rest[0], f = rest[1];
    commit('年齢区分マスタの変更', s => { s.award.cats[i][f] = f === 'name' ? val.trim() : val === '○'; }, { allowLocked: true });
    return;

  if (kind === 'awe') {
    const id = rest[0], f = rest[1];
    const ev = state.award.events.find(e => e.id === id);
