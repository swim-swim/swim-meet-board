<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スイム大会運営ボード</title>
<meta name="description" content="水泳大会のエントリー・組分け・進行・記録・速報・証書・表彰をブラウザだけで運営できる無料ツール">
<style>/* Layout: 左にナビ・上に状態バー・右に作業面。プールの水色を軸に、コースロープの赤白をアクセントに使う */
:root {
  --bg: #f3f7fa;
  --surface: #ffffff;
  --surface-2: #eef4f8;
  --ink: #10222f;
  --muted: #586a78;
  --line: #d6e1e9;
  --accent: #0a69ad;
  --accent-ink: #ffffff;
  --accent-soft: #dcecf8;
  --rope: #d23b3b;
  --ok: #1d7a4b; --ok-soft: #e1f3e8;
  --warn: #a35d00; --warn-soft: #fff1d6;
  --err: #c0322b; --err-soft: #fde5e3;
  --info: #3b5f86; --info-soft: #e5edf6;
  --focus: #f0a400;
  --font-ui: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --font-cert: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif;
  --font-num: "SF Mono", "Menlo", "Consolas", "Roboto Mono", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1620; --surface: #13212e; --surface-2: #182a3a; --ink: #e4edf4; --muted: #9db0bf; --line: #2a3e50;
    --accent: #4fa6e6; --accent-ink: #06121c; --accent-soft: #163650; --rope: #ff6b6b;
    --ok: #5fd39a; --ok-soft: #12352a; --warn: #f2b45a; --warn-soft: #3a2a10; --err: #ff7a70; --err-soft: #3d1715; --info: #9cc2ea; --info-soft: #1a2d42;
    --focus: #ffc94a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1620; --surface: #13212e; --surface-2: #182a3a; --ink: #e4edf4; --muted: #9db0bf; --line: #2a3e50;
  --accent: #4fa6e6; --accent-ink: #06121c; --accent-soft: #163650; --rope: #ff6b6b;
  --ok: #5fd39a; --ok-soft: #12352a; --warn: #f2b45a; --warn-soft: #3a2a10; --err: #ff7a70; --err-soft: #3d1715; --info: #9cc2ea; --info-soft: #1a2d42;
  --focus: #ffc94a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font-ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.num, td.num, .t { font-variant-numeric: tabular-nums; }

/* ---------- 枠組み ---------- */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 100%; }
.topbar { grid-column: 1 / -1; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--rope) 0 14px, var(--surface) 14px 22px, var(--accent) 22px 36px, var(--surface) 36px 44px); opacity: .85; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.brand small { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
.brand strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; cursor: default; white-space: nowrap; }
button.chip { cursor: pointer; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); } .chip.warn .dot { background: var(--warn); }
.chip.err { background: var(--err-soft); border-color: transparent; color: var(--err); } .chip.err .dot { background: var(--err); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.lock { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.nav { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 8px; position: sticky; top: 58px; align-self: start; height: calc(100vh - 58px); overflow-y: auto; }
.nav h6 { margin: 14px 10px 4px; font-size: 10.5px; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav .badge { font-size: 11px; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--err); color: #fff; }
.nav a.on .badge { background: var(--accent-ink); color: var(--accent); }
main { padding: 20px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); min-width: 0; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; }
  .nav { position: static; height: auto; display: flex; overflow-x: auto; gap: 4px; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav h6 { display: none; }
  .nav a { white-space: nowrap; flex: 0 0 auto; }
}

/* ---------- 部品 ---------- */
h1.view { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 75ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.bar .grow { flex: 1 1 auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); }
.btn.danger.solid { background: var(--err); color: #fff; border-color: var(--err); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn[disabled] { opacity: .4; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.card h3 { font-size: 13.5px; margin: 14px 0 6px; color: var(--muted); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.stat.hl { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 5px 7px; min-width: 0; width: 100%; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); }
textarea { resize: vertical; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--err-soft); color: var(--err); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.mute { background: var(--surface-2); color: var(--muted); }
.notice { border-radius: var(--r); padding: 10px 14px; margin: 0 0 12px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.notice.warn { background: var(--warn-soft); color: var(--warn); } .notice.err { background: var(--err-soft); color: var(--err); }
.notice.info { background: var(--info-soft); color: var(--info); } .notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice .grow { flex: 1 1 260px; }

/* ---------- 表 ---------- */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: middle; }
table.t th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.t td.num, table.t th.num { text-align: right; }
table.t td.c, table.t th.c { text-align: center; }
table.t tr.err td { background: var(--err-soft); }
table.t tr.warn td { background: var(--warn-soft); }
table.t tr.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--focus); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { table.t tr.flash td { animation: none; outline: 2px solid var(--focus); } }
table.t input, table.t select { padding: 3px 5px; font-size: 13px; }
table.t select { min-width: 96px; }
table.t tr.grp td { background: var(--accent-soft); font-weight: 700; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.tin { min-width: 84px; font-family: var(--font-num); }
.tin.bad { border-color: var(--err); background: var(--err-soft); color: var(--err); }
.tin.odd { border-color: var(--warn); background: var(--warn-soft); }
.prev { display: block; font-size: 10.5px; color: var(--muted); font-family: var(--font-num); min-height: 1em; }
.prev.bad { color: var(--err); }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
.x:hover { color: var(--err); }
.lane { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; }
.pager { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

/* ---------- 表彰ボード ---------- */
.mvp { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mvp .card { border-width: 2px; }
.mvp .card.ok { border-color: var(--ok); }
.mvp .who { font-size: 20px; font-weight: 700; }
.st-ok { color: var(--ok); font-weight: 700; } .st-up { color: var(--warn); font-weight: 700; } .st-none, .st-off { color: var(--muted); }
tr.off td { color: var(--muted); background: var(--surface-2); }

/* ---------- モーダル・トースト ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(5, 15, 25, .45); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h2 { margin: 0 0 8px; font-size: 17px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; z-index: 120; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast.err { background: var(--err); color: #fff; }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 5px; padding: 2px 8px; cursor: pointer; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.onboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.onboard button { text-align: left; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.onboard button:hover { border-color: var(--accent); }
.onboard b { display: block; font-size: 15px; margin-bottom: 4px; }
details.card > summary { cursor: pointer; font-weight: 700; }
.kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.big .t { font-size: 22px; } .big .t td { padding: 8px 10px; }
.listcheck li { margin: 4px 0; }
.issue { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.issue:last-child { border-bottom: 0; }
.issue button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-align: left; }
.certprev { border: 1px solid var(--line); background: #fff; color: #000; overflow: hidden; margin: 0 auto; }

/* ---------- 印刷 ---------- */
#print-root { display: none; }
@media print {
  body { background: #fff !important; color: #000 !important; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  .pt { border-collapse: collapse; width: 100%; font-size: 10.5pt; font-family: var(--font-ui); }
  .pt th, .pt td { border: 0.5pt solid #555; padding: 2pt 4pt; }
  .pt thead { display: table-header-group; }
  .pt tr { page-break-inside: avoid; }
  .ph { font-family: var(--font-ui); margin: 0 0 6pt; }
  .ph h1 { font-size: 15pt; margin: 0; } .ph p { margin: 2pt 0; font-size: 10pt; }
  .pbreak { page-break-after: always; }
}
.cert { position: relative; color: #000; font-family: var(--font-cert); text-align: center; overflow: hidden; page-break-after: always; break-after: page; }
.cert:last-child { page-break-after: auto; break-after: auto; }
.cert .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
.cert .title { font-weight: 700; letter-spacing: .3em; }
.cert .name { font-weight: 700; }
.cert .lines p { margin: 0; }
.cert .date { align-self: stretch; text-align: center; }
</style>
<style id="page-style">@page { size: A4 portrait; margin: 12mm }</style>

<body>
<div class="app">
  <header class="topbar" id="top"></header>
  <nav class="nav" id="nav" aria-label="メニュー"></nav>
  <main id="main"><noscript>このアプリを使うには JavaScript を有効にしてください。</noscript></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>/* ============================================================================
 * スイム大会運営アプリ — 計算エンジン（DOM非依存）
 *  Excel「大会運営ブック」の数式と「表彰者算出マクロ」のロジックを移植
 * ========================================================================== */
const Core = (() => {
  'use strict';

  // ---------------------------------------------------------------- 文字の正規化
  function toHalf(s) {
    return String(s)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[．。]/g, '.').replace(/[：]/g, ':').replace(/[，、]/g, '.')
      .replace(/　/g, ' ')
      .replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  }
  // Excel の文字列比較（JIS順）に近い日本語照合
  const JA = (typeof Intl !== 'undefined' && Intl.Collator) ? new Intl.Collator('ja', { sensitivity: 'accent' }) : { compare: (a, b) => a < b ? -1 : a > b ? 1 : 0 };
  const str = v => (v === null || v === undefined) ? '' : String(v).trim();
  // 照合用キー（全角/半角・空白・波ダッシュ・m/M の違いを吸収）
  function normKey(s) {
    let t = str(s);
    try { t = t.normalize('NFKC'); } catch (e) { /* ignore */ }
    return t.replace(/[\s　]+/g, '').replace(/[〜～~]/g, '~').replace(/[ー－−‐-]/g, '-').toLowerCase();
  }
  const SPECIAL = { 'DNS': 'DNS', 'DSQ': 'DSQ', '棄権': '棄権', '失格': '失格' };

  // ---------------------------------------------------------------- タイム
  /**
   * 入力されたタイムを秒に変換する。
   *  28.78 / 1:32.22 / 1.32.22 / 00.30.00 / 1分32秒22 / 132.22(=1:32.22) / Excel時刻値 / 全角
   *  返り値 {kind:'empty'|'time'|'special'|'error', sec, special, msg}
   */
  function parseTime(raw, opt) {
    const rule = (opt && opt.threeDigit) || 'mss';
    if (raw === null || raw === undefined) return { kind: 'empty' };
    if (typeof raw === 'number') {
      if (!isFinite(raw) || raw <= 0) return { kind: 'error', msg: '0以下の数値です' };
      let sec;
      if (raw < 1) sec = raw * 86400;
      else if (raw >= 100 && rule === 'mss') {
        const m = Math.floor(raw / 100), r = raw - m * 100;
        if (r >= 60) return { kind: 'error', msg: '秒が60以上です' };
        sec = m * 60 + r;
      } else sec = raw;
      return finish(sec);
    }
    let s = toHalf(str(raw)).replace(/\s+/g, '');
    if (!s) return { kind: 'empty' };
    const up = s.toUpperCase();
    if (SPECIAL[up] || SPECIAL[s]) return { kind: 'special', special: SPECIAL[up] || SPECIAL[s] };
    // 1分32秒22 / 32秒22 / 32秒
    s = s.replace(/["”″]/g, '.').replace(/['’′]/g, ':');
    let m = s.match(/^(?:(\d+)分)?(\d+(?:\.\d+)?)秒(\d*)$/);
    if (m) {
      const min = m[1] ? +m[1] : 0, sc = +m[2], cs = m[3] ? +('0.' + m[3]) : 0;
      if (sc >= 60 && m[1]) return { kind: 'error', msg: '秒が60以上です' };
      return finish(min * 60 + sc + cs);
    }
    if (s.indexOf(':') >= 0) {
      const p = s.split(':');
      if (p.length === 2 && /^\d+$/.test(p[0]) && /^\d+(\.\d+)?$/.test(p[1])) {
        const sec = +p[1];
        if (sec >= 60) return { kind: 'error', msg: '秒が60以上です' };
        return finish(+p[0] * 60 + sec);
      }
      if (p.length === 3 && p.every(x => /^\d+$/.test(x))) { // 1:32:22 → 1分32秒22
        if (+p[1] >= 60) return { kind: 'error', msg: '秒が60以上です' };
        return finish(+p[0] * 60 + +p[1] + +('0.' + p[2]));
      }
      return { kind: 'error', msg: '読み取れない形式です' };
    }
    const parts = s.split('.');
    if (!parts.every(x => /^\d+$/.test(x))) return { kind: 'error', msg: '数字以外の文字があります' };
    if (parts.length === 3) { // 00.30.00 / 1.05.32
      if (+parts[1] >= 60) return { kind: 'error', msg: '秒が60以上です' };
      return finish(+parts[0] * 60 + +parts[1] + +('0.' + parts[2]));
    }
    if (parts.length > 3) return { kind: 'error', msg: '区切りが多すぎます' };
    const n = +s;
    if (n <= 0) return { kind: 'error', msg: '0以下です' };
    if (n >= 100 && rule === 'mss') {
      const mm = Math.floor(+parts[0] / 100), r = n - mm * 100;
      if (r >= 60) return { kind: 'error', msg: '秒が60以上です（例: 1:32.22 は 132.22）' };
      return finish(mm * 60 + r);
    }
    return finish(n);

    function finish(sec) {
      sec = Math.round(sec * 100) / 100;
      if (!(sec > 0)) return { kind: 'error', msg: '0以下です' };
      if (sec >= 3600) return { kind: 'error', msg: '60分以上です' };
      return { kind: 'time', sec };
    }
  }
  const cs = sec => Math.round(sec * 100);
  function fmtTime(sec) { // 1:32.22 / 28.78
    if (sec === null || sec === undefined || !(sec > 0)) return '';
    const c = cs(sec), m = Math.floor(c / 6000), r = c - m * 6000;
    const ss = Math.floor(r / 100), cc = r % 100;
    return (m > 0 ? m + ':' + String(ss).padStart(2, '0') : String(ss)) + '.' + String(cc).padStart(2, '0');
  }
  function fmtTimeJa(sec) { // Excel と同じ「0分28秒78」
    if (!(sec > 0)) return '';
    const c = cs(sec), m = Math.floor(c / 6000), r = c - m * 6000;

  function fmtClock(sec) { // 秒(0時起点) → h:mm

  // ---------------------------------------------------------------- 共通
  const isRelayName = s => str(s).indexOf('リレー') >= 0;
  function laneList(S) {
    const out = [];
    (S.lanes || []).forEach(v => { const n = parseInt(toHalf(str(v)), 10); if (n > 0 && out.indexOf(n) < 0) out.push(n); });
    return out.length ? out : [1];
  }
  function combinedOf(S, event, cat) {
    const rules = S.combined || [];
    for (let p = 0; p < 3; p++) {
      for (const r of rules) {
        const pr = (r.pairs || [])[p];
        if (r.name && pr && str(pr.event) === event && str(pr.cat) === cat && event && cat) return str(r.name);
      }
    }
    return '';
  }
  const evSex = name => { const m = str(name).match(/^(男子|女子|混合)/); return m ? m[1] : ''; };

  // ---------------------------------------------------------------- 組・レーン編成（Excel AC〜AN 列）
  function assignHeats(items, S, minPer) {
    const lanes = laneList(S), L = lanes.length;
    minPer = Math.max(1, Math.min(parseInt(minPer, 10) || 1, L));
    const catOrder = c => { const i = S.categories.indexOf(c); return i >= 0 ? i + 1 : 99; };
    const groups = new Map();
    items.forEach(it => {
      if (!it.event) return;
      const key = it.combined ? it.combined : it.event + '_' + it.cat;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    });
    const ginfo = new Map();
    groups.forEach((arr, key) => {
      arr.sort((a, b) => (b.H - a.H) || a.tie(b));
      const AD = arr.length, AF = Math.ceil(AD / L), AJ = ((AD - 1) % L) + 1;
      const AK = AF > 1 ? Math.max(AJ, minPer) : AD;
      const it0 = arr[0];
      ginfo.set(key, { arr, AD, AF, AK, combined: !!it0.combined, event: it0.event, AG: it0.combined ? 99 : catOrder(it0.cat), cat: it0.cat });
    });
    // 同じ種目の中で、区分順（AG）の小さい区分の組数を前に積む
    ginfo.forEach(g => {
      let AI = 0;
      if (!g.combined) {
        ginfo.forEach(o => {
          if (o === g || o.combined || o.event !== g.event) return;
          if (o.AG < g.AG || (o.AG === g.AG && g.AG === 99 && o.cat < g.cat)) AI += o.AF;
        });
      }
      g.AI = AI;
      const heatsLocal = {};
      g.arr.forEach((it, idx) => {
        const AE = idx + 1;
        const AL = AE <= g.AK ? 1 : 1 + Math.ceil((AE - g.AK) / L);
        const AM = AE <= g.AK ? AE : ((AE - g.AK - 1) % L) + 1;
        it.heat = AI + AL; it._AM = AM;
        (heatsLocal[AL] = heatsLocal[AL] || []).push(it);
      });
      Object.keys(heatsLocal).forEach(k => {
        const hs = heatsLocal[k], n = hs.length;
        hs.forEach(it => {
          const pos = S.laneOrder === 'fast' ? (n - it._AM + 1) : it._AM;
          it.lane = lanes[pos - 1] || null;
        });
      });
    });
  }

  // 公式順位（同じ種目・区分の中で） Excel P/Q 列
  function assignRanks(items) {
    const g = new Map();
    items.forEach(it => {
      it.rank = null; it.rankOrder = null;
      if (!(it.I < 9999)) return;
      const k = it.event + '\u0001' + it.cat;
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(it);
    });
    g.forEach(arr => {
      arr.sort((a, b) => (a.I - b.I) || a.tie(b));
      arr.forEach((it, i) => {
        let r = i + 1;
        if (i > 0 && cs(arr[i - 1].I) === cs(it.I)) r = arr[i - 1].rank;
        it.rank = r; it.rankOrder = i + 1;
      });
    });
  }

  function statusOf(judge, officialParse, hasOfficialRaw) {
    if (judge === '棄権' || (officialParse.kind === 'special' && (officialParse.special === 'DNS' || officialParse.special === '棄権'))) return '棄権';

    if (!hasOfficialRaw) return '未入力';
    return '完泳';
  }

  // ---------------------------------------------------------------- 個人
  function computeIndividuals(state) {

  const num = v => { const n = parseFloat(toHalf(str(v))); return isFinite(n) ? n : 0; };

  // ---------------------------------------------------------------- リレー
  function computeRelays(state) {
    const S = state.settings, opt = { threeDigit: S.threeDigit };
    const pts = S.points || {}, mult = num(pts.relayMult) || 1;
    const rows = state.relays.map((r, idx) => {

    const medal = new Map();
    rows.forEach(it => {
      if (it.rank) it.points = it.status !== '完泳' ? 0 : num(pts.ind && pts.ind[it.rank - 1]) * mult + num(pts.indFinish) * mult;
      else it.points = null;
      it.flashTime = it.status === '棄権' ? '棄権' : (it.pf.kind === 'special' ? '' : (it.pf.kind === 'time' ? fmtTimeJa(it.pf.sec) : it.officialText));
      it.flashRank = it.status === '失格' ? '失格' : (it.rank ? it.rank + '位' : '');
      if (it.team && it.cat && it.event) {

    });
    return rows;
  }

  // ---------------------------------------------------------------- プログラム一覧
  function programNames(state) {
    const S = state.settings, set = [];
    S.events.forEach(e => { if (str(e) && set.indexOf(str(e)) < 0) set.push(str(e)); });

  // ---------------------------------------------------------------- 進行スケジュール（Excel 04）
  function computeSchedule(state, ind, rel) {
    const S = state.settings, sc = S.schedule;
    const start = parseClock(sc.start);
    const heatsOf = name => {
      const src = isRelayName(name) ? rel : ind;
      let n = 0, h = 0;
      src.forEach(it => { if (it.program === name) { n++; if (it.heat > h) h = it.heat; } });
      return { n, h };
    };
    const perHeat = name => {
      const u = name.toUpperCase();
      if (isRelayName(name)) return num(sc.heatRelay);
      if (u.indexOf('200M') >= 0) return num(sc.heat200) || num(sc.heat50);
      if (u.indexOf('100M') >= 0) return num(sc.heat100);
      if (u.indexOf('50M') >= 0) return num(sc.heat50);
      if (u.indexOf('25M') >= 0) return num(sc.heat25);
      return num(sc.heat50);
    };
    const out = [];
    let maxEnd = null;
    state.schedule.forEach((row, i) => {
      const name = str(row.name), adj = num(row.adj);
      const o = { row, no: i + 1, name, adj: row.adj, isBreak: name === '休憩' };
      if (!name) { out.push(o); return; }
      if (o.isBreak) { o.n = '-'; o.heats = '-'; o.dur = num(sc.breakMin) * 60 + adj * 60; }
      else {
        const x = heatsOf(name); o.n = x.n; o.heats = x.h;
        o.dur = Math.max(0, x.h * (perHeat(name) + num(sc.cycleSec)) + adj * 60);
      }
      if (start === null) { o.start = null; o.end = null; }
      else if (maxEnd === null) o.start = start;
      else {
        const prev = out.length ? out[out.length - 1] : null;
        const noGap = o.isBreak || (prev && prev.isBreak) || !(o.heats > 0);
        o.start = maxEnd + (noGap ? 0 : num(sc.intervalMin) * 60);
      }
      if (o.start !== null && o.start !== undefined) { o.end = o.start + o.dur; maxEnd = maxEnd === null ? o.end : Math.max(maxEnd, o.end); }
      out.push(o);
    });
    return { rows: out, end: maxEnd };
  }

  // ---------------------------------------------------------------- 速報（Excel 18）
  function flashList(state, ind, rel, program) {
    if (!program) return [];
    const S = state.settings, relay = isRelayName(program);
    const src = relay ? rel : ind;
    const catI = c => { const i = S.categories.indexOf(c); return i >= 0 ? i + 1 : 99; };
    const evI = e => { const i = S.events.indexOf(e); return i >= 0 ? i + 1 : 99; };
    const list = src.filter(it => (relay ? it.team : it.name) && it.event && (it.event === program || (it.combined && it.combined === program)))
      .map(it => {
        const place = (it.status === '完泳' && it.rank) ? Math.min(99, it.rank) * 1000 : it.status === '失格' ? 100000 : it.status === '棄権' ? 200000 : 300000;
        return { it, key: catI(it.cat) * 1e8 + evI(it.event) * 1e6 + place + it.idx };
      }).sort((a, b) => a.key - b.key).map(x => x.it);
    return list.map(it => ({
      it,
      rank: it.status === '棄権' ? '棄権' : it.flashRank,
      name: relay ? it.memberFlash : it.name,
      club: relay ? it.teamDisp : it.club,
      cat: it.cat + (it.event !== program ? '（' + (str(it.event).split(' ')[0]) + '）' : ''),

  }

  // ---------------------------------------------------------------- ダッシュボード（Excel 00）
  function computeDashboard(state, ind, rel) {
    const S = state.settings, d = S.dashboard;
    const uniq = new Set(); ind.forEach(it => { if (it.name) uniq.add(it.name); });
    const applicants = uniq.size;
    const priceIn = num(d.price) * (1 + num(d.tax) / 100);
    const clubs = S.clubs.filter(c => str(c.name)).map(c => {
      const nm = str(c.name), u = new Set();
      let score = 0;
      ind.forEach(it => { if (it.club === nm) { if (it.name) u.add(it.name); if (typeof it.points === 'number') score += it.points; } });
      rel.forEach(it => { if (it.team === nm && typeof it.points === 'number') score += it.points; });
      const tgt = str(c.target) === '' ? null : num(c.target);
      return { name: nm, target: tgt, actual: u.size, diff: tgt === null ? null : u.size - tgt, share: applicants ? u.size / applicants : null, score };
    });
    clubs.forEach(c => { c.rank = 1 + clubs.filter(o => o.score > c.score).length; });
    const medal = k => ind.filter(it => it.medalOrder === k).length + rel.filter(it => it.medalOrder === k).reduce((a, it) => a + it.swimmers, 0);
    const otherClubs = new Set();

      diffTarget: applicants - num(d.target), vacancy: num(d.capacity) - applicants,
      priceIn, targetSales: num(d.target) * priceIn, sales: applicants * priceIn, salesDiff: applicants * priceIn - num(d.target) * priceIn,

    };
  }

  // ---------------------------------------------------------------- 証書対象（Excel AR〜AU）
  function certTargets(state, rows, relay, filter, prize) {

  // ---------------------------------------------------------------- 入力チェック
  function validate(state, ind, rel, sched) {
    const S = state.settings, out = [];

    const evSet = new Set(S.events.map(str)), catSet = new Set(S.categories.map(str)), clubSet = new Set(S.clubs.map(c => str(c.name)));

    const opt = { threeDigit: S.threeDigit };

    // ---- 個人エントリー
    const byNameEv = new Map(), byName = new Map();
    ind.forEach(it => {
      const e = it.e, ref = { type: 'entry', id: e.id }, no = '個人' + (it.idx + 1) + '行目';
      const any = it.name || it.club || it.cat || it.event || str(e.entryTime) || str(e.officialTime);
      if (!any) return;
      const who = it.name || '（氏名なし）';
      if (!it.name) add('error', '個人', no + ': 氏名が空欄です', ref);

      else if (!evSet.has(it.event)) add('error', '個人', no + ' ' + who + ': 種目「' + it.event + '」が大会設定の種目リストにありません', ref);

      else if (!catSet.has(it.cat)) add('error', '個人', no + ' ' + who + ': 区分「' + it.cat + '」が大会設定の区分リストにありません（組分けがずれます）', ref);

      if (it.event && isRelayName(it.event)) add('error', '個人', no + ' ' + who + ': リレー種目が個人エントリーに入っています', ref);
      if (it.name) {
        const raw = str(e.name);
        const fixed = fixName(raw);

        else if (fixed.split('　').length !== 4) add('info', '個人', no + ' ' + who + ': 氏名が「苗字　名前　ミョウジ　ナマエ」の形ではありません', ref);

      if (it.pf.kind === 'error') add('error', '個人', no + ' ' + who + ': 公式タイム「' + str(e.officialTime) + '」を読み取れません（' + it.pf.msg + '）', ref);

      if (it.pe.kind === 'time' && it.pf.kind === 'time') {

    });
    byName.forEach((arr, nm) => {
      const cats = new Set(arr.map(a => a.cat).filter(Boolean)), clubs = new Set(arr.map(a => a.club).filter(Boolean));
      if (cats.size > 1) add('warn', '個人', nm + ': 区分が行によって違います（' + [...cats].join('／') + '）', { type: 'entry', id: arr[0].e.id });
      if (clubs.size > 1) add('warn', '個人', nm + ': チームが行によって違います（' + [...clubs].join('／') + '）。同姓同名の別人なら問題ありません', { type: 'entry', id: arr[0].e.id });
      const mx = parseInt(S.maxEventsPerPerson, 10);
      if (mx > 0 && arr.filter(a => a.event).length > mx) add('warn', '個人', nm + ': ' + arr.length + '種目にエントリーしています（上限 ' + mx + '種目）', { type: 'entry', id: arr[0].e.id });
    });
    // 同じ種目・区分の中で極端なタイム
    const grp = new Map();
    ind.forEach(it => { if (it.pf.kind === 'time' && !it.judge) { const k = it.event + '\u0001' + it.cat; if (!grp.has(k)) grp.set(k, []); grp.get(k).push(it); } });
    grp.forEach(arr => {
      if (arr.length < 3) return;
      const s = arr.map(a => a.pf.sec).sort((a, b) => a - b), med = s[Math.floor(s.length / 2)];
      arr.forEach(it => {
        if (it.pf.sec < med * 0.5 || it.pf.sec > med * 2.2) add('warn', '個人', it.name + '（' + it.event + ' ' + it.cat + '）: 公式タイム ' + fmtTime(it.pf.sec) + ' が同じ組の中央値 ' + fmtTime(med) + ' から大きく外れています', { type: 'entry', id: it.e.id });
      });
    });
    const dash = computeDashboard(state, ind, rel);
    if (dash.capacity > 0 && dash.applicants > dash.capacity) add('warn', '申込', '申込者数 ' + dash.applicants + '名が定員 ' + dash.capacity + '名を超えています', { type: 'view', view: 'dashboard' });

    // ---- リレー
    const relKey = new Map(), memberEv = new Map();
    rel.forEach(it => {
      const r = it.r, ref = { type: 'relay', id: r.id }, no = 'リレー' + (it.idx + 1) + '行目';
      const any = it.team || it.cat || it.event || it.members.some(Boolean);
      if (!any) return;
      const who = it.teamDisp || '（チーム名なし）';
      if (!it.team) add('error', 'リレー', no + ': チーム名が空欄です', ref);
      else if (!clubSet.has(it.team)) add('warn', 'リレー', no + ' ' + who + ': チーム「' + it.team + '」がクラブリストにありません（得点がクラブに加算されません）', ref);
      if (!it.event) add('error', 'リレー', no + ' ' + who + ': 種目が空欄です', ref);
      else if (!evSet.has(it.event)) add('error', 'リレー', no + ' ' + who + ': 種目「' + it.event + '」が種目リストにありません', ref);
      else if (!isRelayName(it.event)) add('error', 'リレー', no + ' ' + who + ': 「' + it.event + '」はリレー種目ではありません', ref);
      if (!it.cat) add('error', 'リレー', no + ' ' + who + ': 区分が空欄です', ref);
      else if (!catSet.has(it.cat)) add('error', 'リレー', no + ' ' + who + ': 区分「' + it.cat + '」が区分リストにありません', ref);
      const mem = it.members.filter(Boolean);
      if (mem.length < 4) add('warn', 'リレー', no + ' ' + who + ': 泳者が' + mem.length + '名です（4名必要）', ref);
      const ms = new Set();
      mem.forEach(m => { const k = normKey(m); if (ms.has(k)) add('error', 'リレー', no + ' ' + who + ': 泳者「' + m + '」が2回入っています', ref); ms.add(k); });
      if (it.event) {
        mem.forEach(m => {
          const k = normKey(m) + '\u0001' + it.event;
          if (memberEv.has(k) && memberEv.get(k) !== it.idx) add('error', 'リレー', no + ' ' + who + ': 泳者「' + m + '」が同じ種目の別チーム（' + (memberEv.get(k) + 1) + '行目）にも入っています', ref);

        if (relKey.has(k)) add('error', 'リレー', no + ' ' + who + ': 同じチーム・記号・種目・区分が二重に登録されています。記号（A・B）で区別してください', ref);
        else relKey.set(k, it.idx);
        if (!schedNames.has(it.program)) add('error', '進行', '「' + it.program + '」が進行スケジュールにありません（' + who + ' ほか）', { type: 'view', view: 'schedule' }, null, it.program);
      }
      if (it.pe.kind === 'error') add('error', 'リレー', no + ' ' + who + ': エントリータイムを読み取れません（' + it.pe.msg + '）', ref);
      if (it.pf.kind === 'error') add('error', 'リレー', no + ' ' + who + ': 公式タイムを読み取れません（' + it.pf.msg + '）', ref);
      if (it.judge === '棄権' && it.pf.kind === 'time') add('warn', 'リレー', no + ' ' + who + ': 棄権なのに公式タイムが入っています', ref);
    });

    // ---- 大会設定
    const dup = (arr, label) => { const s = new Set(); arr.forEach(x => { x = str(x); if (!x) return; if (s.has(x)) add('error', '設定', label + '「' + x + '」が重複しています', { type: 'view', view: 'settings' }); s.add(x); }); };
    dup(S.events, '種目'); dup(S.categories, '区分'); dup(S.clubs.map(c => c.name), 'クラブ');
    const lanesRaw = (S.lanes || []).map(v => str(v)).filter(Boolean);
    const lanes = laneList(S);
    if (lanesRaw.length !== lanes.length) add('error', '設定', '使用レーンの番号が重複しているか、数字ではありません', { type: 'view', view: 'settings' });
    if (!lanesRaw.length) add('error', '設定', '使用レーンが1つも設定されていません', { type: 'view', view: 'settings' });
    if ((parseInt(S.minPerHeatInd, 10) || 0) > lanes.length) add('warn', '設定', '個人の1組最低人数（' + S.minPerHeatInd + '）がレーン数（' + lanes.length + '）を超えています。レーン数に合わせて計算します', { type: 'view', view: 'settings' });
    if ((parseInt(S.minPerHeatRelay, 10) || 0) > lanes.length) add('warn', '設定', 'リレーの1組最低チーム数がレーン数を超えています。レーン数に合わせて計算します', { type: 'view', view: 'settings' });
    const pairSeen = new Map();
    (S.combined || []).forEach((r, i) => {
      if (!str(r.name)) { if ((r.pairs || []).some(p => p && (p.event || p.cat))) add('error', '設定', '合同レース' + (i + 1) + '行目: プログラム表示名が空欄です', { type: 'view', view: 'settings' }); return; }
      if (evSet.has(str(r.name))) add('error', '設定', '合同レース名「' + r.name + '」が通常の種目名と同じです。別の名前にしてください', { type: 'view', view: 'settings' });
      (r.pairs || []).forEach(p => {
        if (!p || (!p.event && !p.cat)) return;
        if (p.event && !evSet.has(str(p.event))) add('error', '設定', '合同レース「' + r.name + '」の種目「' + p.event + '」が種目リストにありません', { type: 'view', view: 'settings' });
        if (p.cat && !catSet.has(str(p.cat))) add('error', '設定', '合同レース「' + r.name + '」の区分「' + p.cat + '」が区分リストにありません', { type: 'view', view: 'settings' });
        if (!p.event || !p.cat) add('warn', '設定', '合同レース「' + r.name + '」で種目か区分の片方だけが入っています', { type: 'view', view: 'settings' });
        const k = p.event + '\u0001' + p.cat;
        if (pairSeen.has(k)) add('warn', '設定', '「' + p.event + '・' + p.cat + '」が複数の合同レース（' + pairSeen.get(k) + '／' + r.name + '）に入っています。先の方が使われます', { type: 'view', view: 'settings' });
        else pairSeen.set(k, r.name);
      });
    });
    if (parseClock(S.schedule.start) === null) add('error', '設定', '競技開始の時刻「' + S.schedule.start + '」を読み取れません（例 8:45）', { type: 'view', view: 'settings' });

    // ---- スケジュール
    schedNames.forEach((rows, n) => {
      if (n === '休憩') return;
      if (rows.length > 1) add('warn', '進行', '「' + n + '」がスケジュールに' + rows.length + '回入っています（' + rows.join('・') + '番）。時間が二重に計上されます', { type: 'view', view: 'schedule' });
      if (!progs.has(n)) add('warn', '進行', 'スケジュールの「' + n + '」は種目リスト・合同レースにありません', { type: 'view', view: 'schedule' });
    });
    if (sched && sched.end !== null) {
      const cl = parseClock(S.schedule.closing);
      if (cl !== null && sched.end > cl) add('warn', '進行', '競技終了予定 ' + fmtClock(sched.end) + ' が閉会式 ' + S.schedule.closing + ' より後です', { type: 'view', view: 'schedule' });
    }
    // 重複メッセージをまとめる
    const seen = new Set();
    return out.filter(x => { const k = x.level + x.msg; if (seen.has(k)) return false; seen.add(k); return true; });
  }
  function hasLooseChars(v) { return typeof v === 'string' && /[０-９．：，　]/.test(v); }
  function fixName(s) {
    return str(s).replace(/[ 　\t]+/g, '　').replace(/^　|　$/g, '');
  }
  function fixTimeText(v) { return typeof v === 'string' ? toHalf(v).trim() : v; }

  // ============================================================================
  //  表彰者算出（JFS表彰者算出マクロ Recalc の移植）
  // ============================================================================
  const N_CAT = 8, N_RANK = 3, EPS = 1e-9, ODD_LOW = 0.5, ODD_HIGH = 1.5;
  const SEX = ['男子', '女子'];
  const isMark = v => v === true || ['○', '〇', '◯'].indexOf(str(v)) >= 0;
  function awardMaster(A) {
    const m = { warn: [] };
    m.cat = A.cats.slice(0, N_CAT).map((c, i) => {
      let name = str(c.name), on = name.length > 0 && name.indexOf('（未設定') !== 0;
      if (!on) name = '（未設定' + (i + 1) + '）';
      return { k: i + 1, name, on, mvp: isMark(c.mvp), exc: isMark(c.exc) };
    });
    m.ev = [];
    A.events.forEach(e => {
      const name = str(e.name);
      if (!name) return;
      const base = [0, 0];
      ['baseM', 'baseF'].forEach((f, sx) => {
        const p = parseTime(e[f], { threeDigit: 'mss' });
        if (p.kind === 'time') base[sx] = p.sec;
        else m.warn.push('「' + name + '」の' + SEX[sx] + '基準タイムが未設定です（達成率を計算できません）');
      });
      m.ev.push({ id: e.id, name, base, mvp: isMark(e.mvp) });
    });
    const clamp = (v, d) => { const n = parseInt(toHalf(str(v)), 10); if (!isFinite(n)) return d; return Math.max(1, Math.min(N_CAT, n)); };
    m.cStart = clamp(A.cStart, 1); m.cEnd = clamp(A.cEnd, N_CAT);
    if (m.cStart > m.cEnd) { const t = m.cStart; m.cStart = m.cEnd; m.cEnd = t; }
    const rm = str(A.rankMode);
    m.rankMax = rm.indexOf('のみ') >= 0 ? 1 : (rm.indexOf('2位') >= 0 && rm.indexOf('3位') < 0 ? 2 : 3);
    let mr = parseFloat(toHalf(str(A.minRate)));
    if (!isFinite(mr)) mr = 0;
    if (mr > 5) mr = mr / 100;
    m.minRate = Math.max(0, mr);
    m.fold = str(A.fold).indexOf('折りたた') >= 0;
    for (let a = 0; a < N_CAT; a++) for (let b = a + 1; b < N_CAT; b++)
      if (m.cat[a].on && m.cat[b].on && m.cat[a].name === m.cat[b].name) m.warn.push('年齢区分名「' + m.cat[a].name + '」が重複しています（区分' + (a + 1) + 'と区分' + (b + 1) + '）');
    for (let a = 0; a < m.ev.length; a++) for (let b = a + 1; b < m.ev.length; b++)
      if (m.ev[a].name === m.ev[b].name) m.warn.push('種目名「' + m.ev[a].name + '」が重複しています');
    if (!m.cat.some(c => c.on)) m.warn.push('年齢区分が1つも設定されていません');
    const TL = '〜';
    m.cond = '区分' + m.cStart + TL + m.cEnd + '・' + (m.rankMax === 1 ? '1位のみ' : m.rankMax === 2 ? '1' + TL + '2位' : '1' + TL + '3位すべて') +
      (m.minRate > 0 ? '・達成率' + (m.minRate * 100).toFixed(1) + '%以上' : '');
    return m;
  }
  const awardKey = (k, sx, evId, rk) => k + '|' + sx + '|' + evId + '|' + rk;

  function computeAwards(A) {
    const m = awardMaster(A);
    const E = m.ev.length, perBlock = E * N_RANK;
    const R = { master: m, rows: [], errRows: [], oddRows: [], sum: { entered: 0, err: 0, noName: 0, offInput: 0, odd: 0, slots: 0, excOk: 0, excNone: 0 } };
    const sum = R.sum;
    const agg = []; // {key,k,sx,rate,i}
    const mvp = [{ i: -1, rate: 0, tie: 0, key: '' }, { i: -1, rate: 0, tie: 0, key: '' }];
    let i = 0;
    for (let k = 1; k <= N_CAT; k++) {
      const cat = m.cat[k - 1];
      for (let sx = 0; sx < 2; sx++) {
        for (let e = 0; e < E; e++) {
          const ev = m.ev[e];
          for (let rk = 1; rk <= N_RANK; rk++) {
            i++;
            const key = awardKey(k, sx, ev.id, rk);
            const inp = A.inputs[key] || {};
            const row = { i, k, sx, e, rk, key, cat, ev, club: str(inp.club), name: str(inp.name), timeRaw: inp.time, base: ev.base[sx], live: cat.on, rate: null, state: '' };
            if (cat.on) sum.slots++;
            const has = str(inp.time) !== '';
            if (has) {
              const p = parseTime(inp.time, { threeDigit: 'mss' });
              if (p.kind !== 'time') { row.state = 'error'; sum.err++; R.errRows.push(i); }
              else {
                row.sec = p.sec;
                if (!cat.on) { sum.offInput++; row.state = 'off'; }
                else if (!(ev.base[sx] > 0)) { row.state = 'nobase'; sum.entered++; }
                else {
                  sum.entered++;
                  const rate = ev.base[sx] / p.sec;
                  row.rate = rate;
                  if (rate < ODD_LOW || rate > ODD_HIGH) { sum.odd++; row.odd = true; R.oddRows.push(i); }
                  let pk;
                  if (!row.name) { sum.noName++; pk = '#' + i; } else pk = row.club + '|' + row.name;
                  row.pkey = pk;
                  if (k >= m.cStart && k <= m.cEnd && cat.mvp && ev.mvp && rk <= m.rankMax && rate >= m.minRate - EPS) {
                    const M = mvp[sx];
                    if (M.i < 0 || rate > M.rate + EPS) { M.i = i; M.rate = rate; M.tie = 0; M.key = pk; M.row = row; }
                    else if (Math.abs(rate - M.rate) <= EPS && M.key !== pk) M.tie++;
                  }
                  const f = agg.find(a => a.k === k && a.sx === sx && a.key === pk);
                  if (f) { if (rate > f.rate + EPS) { f.rate = rate; f.row = row; } }
                  else agg.push({ key: pk, k, sx, rate, row });
                }
              }
            }
            R.rows.push(row);
          }
        }
      }
    }
    // 最優秀
    R.mvp = [0, 1].map(sx => {
      const M = mvp[sx], o = { sx, label: '最優秀選手', sexName: SEX[sx] };
      if (M.i > 0) {
        Object.assign(o, entryOf(M.row, M.rate));
        o.status = '選出（' + m.cond + '）' + (M.tie > 0 ? ' ※同率' + (M.tie + 1) + '名' : '');
        o.kind = 'ok'; o.tie = M.tie;
        o.summary = o.name + '（' + o.catName + '・' + o.event + ' ' + (M.rate * 100).toFixed(2) + '%）' + (M.tie > 0 ? ' ※同率' + (M.tie + 1) + '名あり' : '') + (M.rate > ODD_HIGH ? ' ※達成率が極端なので要確認' : '');
      } else if (sum.entered === 0) { o.status = '未入力（' + m.cond + '）'; o.kind = 'none'; o.summary = '未入力'; }
      else { o.status = '該当者なし（' + m.cond + '）'; o.kind = 'none'; o.summary = '該当者なし（選出範囲の条件を満たす記録がありません）'; }
      return o;
    });
    // 表示する区分
    const disp = [];
    m.cat.forEach(c => { if (c.on || !m.fold) disp.push(c.k); });
    R.disp = disp;
    const better = (a, b) => a.rate > b.rate + EPS || (Math.abs(a.rate - b.rate) <= EPS && a.row.i < b.row.i);
    const top = {};
    agg.forEach(a => {
      const t = top[a.k + '|' + a.sx] = top[a.k + '|' + a.sx] || [null, null];
      if (!t[0]) t[0] = a;
      else if (better(a, t[0])) { t[1] = t[0]; t[0] = a; }
      else if (!t[1]) t[1] = a;
      else if (better(a, t[1])) t[1] = a;
    });
    R.top = top;
    R.exc = [];
    disp.forEach(k => {
      const cat = m.cat[k - 1];
      [0, 1].forEach(sx => {
        const o = { slot: '区分' + k, catName: cat.name, sexName: SEX[sx], k, sx };
        const t = top[k + '|' + sx] || [null, null];
        if (!cat.on) { o.status = '区分未設定（マスタ入力で有効化）'; o.kind = 'off'; }
        else if (!cat.exc) { o.status = '優秀選手の対象外（マスタ設定）'; o.kind = 'off'; }
        else if (!t[0]) { o.status = '未入力'; o.kind = 'none'; sum.excNone++; }
        else {
          let pick = t[0], s = '区分1位選出', kind = 'ok';
          const M = mvp[sx];
          if (M.i > 0 && pick.key === M.key && k === M.row.k) {
            pick = t[1];
            if (!pick) { s = '該当者なし（1位が最優秀選手）'; kind = 'none'; } else { s = '2位繰り上げ（1位が最優秀選手）'; kind = 'up'; }
          }
          if (pick) { Object.assign(o, entryOf(pick.row, pick.rate)); sum.excOk++; } else sum.excNone++;
          o.status = s; o.kind = kind;
        }
        R.exc.push(o);
      });
    });
    R.cand = [];
    [0, 1].forEach(sx => disp.forEach(k => {
      const t = top[k + '|' + sx] || [null, null];
      [0, 1].forEach(p => {
        const o = { slot: '区分' + k + '・' + (p + 1) + '位', catName: m.cat[k - 1].name, sexName: SEX[sx], on: m.cat[k - 1].on };

function listCard(kind, title, arr, hint) {
  return '<div class="card"><h2>' + title + '（' + arr.filter(x => C.str(x)).length + '）</h2><p class="small muted">' + esc(hint) + '。1行に1つ。</p>' +

function renameCandidates(kind) {
  const S = state.settings;
  const base = kind === 'clubs' ? S.clubs.map(c => c.name) : S[kind];
  const set = new Set(base.filter(Boolean));
  if (kind === 'events') { state.entries.forEach(e => e.event && set.add(e.event)); state.relays.forEach(e => e.event && set.add(e.event)); }
  if (kind === 'categories') { state.entries.forEach(e => e.cat && set.add(e.cat)); state.relays.forEach(e => e.cat && set.add(e.cat)); }
  if (kind === 'clubs') { state.entries.forEach(e => e.club && set.add(e.club)); state.relays.forEach(e => e.team && set.add(e.team)); }
  return [...set];
}

function programOptions() {
  const order = [];
  state.schedule.forEach(r => { const n = C.str(r.name); if (n && n !== '休憩' && order.indexOf(n) < 0) order.push(n); });
  C.programNames(state).forEach(n => { if (order.indexOf(n) < 0) order.push(n); });
  return order;
}
function programData(name) {
  const relay = C.isRelayName(name), src = relay ? D.rel : D.ind;
  const items = src.filter(it => it.program === name && it.event);
  const heats = new Map();
  items.forEach(it => { if (!heats.has(it.heat)) heats.set(it.heat, []); heats.get(it.heat).push(it); });
  const hs = [...heats.keys()].sort((a, b) => a - b).map(h => ({ heat: h, items: heats.get(h).sort((a, b) => (a.lane || 99) - (b.lane || 99)) }));
  const sch = D.sched.rows.find(r => r.name === name);
  const done = items.filter(it => it.status !== '未入力').length;
  return { relay, items, heats: hs, sch, done };
}

function unknownList(kind) {
  const S = state.settings, set = new Set();
  if (kind === 'clubs') { const k = new Set(S.clubs.map(c => C.str(c.name))); D.ind.forEach(it => { if (it.club && !k.has(it.club)) set.add(it.club); }); D.rel.forEach(it => { if (it.team && !k.has(it.team)) set.add(it.team); }); }
  if (kind === 'events') { const k = new Set(S.events.map(C.str)); D.ind.concat(D.rel).forEach(it => { if (it.event && !k.has(it.event)) set.add(it.event); }); }

  return [...set];
}

/* ---------------------------------------------------------------- 値の変更 */
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] === undefined) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o === undefined || o === null) ? undefined : o[k], obj); }
const ENT_LOCK_OK = ['officialTime', 'judge'];
function handleValue(el) {
  const k = el.dataset.k;
  if (!k) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  const [kind, ...rest] = k.split(':');
  if (kind === 'ui') {
    const f = rest[0];
    ui[f] = val;
    if (f.indexOf('ent') === 0 && f !== 'entPage') ui.entPage = 0;
    if (f === 'certKind' || f === 'certTarget') { ui.certFilter = {}; ui.certFrom = 1; ui.certTo = ''; }
    if (f === 'renKind') ui.renFrom = '';
    save(); render(); return;
  }
  if (kind === 'cf') { ui.certFilter = Object.assign({}, ui.certFilter, { [rest[0]]: val }); ui.certFrom = 1; ui.certTo = ''; render(); return; }
  if (kind === 'set') {
    const path = rest.join(':');
    let v = val;
    if (path === 'points.relayMult') v = +val;
    if (path === 'cert.printRecord') v = val === '1';
    if (getPath(state.settings, path) === v) return;
    const free = /^(cert|award|print)\./.test(path) || /^dashboard\./.test(path);
    commit('設定の変更', s => {
      if (path.indexOf('lanes.') === 0) { const i = +path.split('.')[1]; while (s.settings.lanes.length <= i) s.settings.lanes.push(''); s.settings.lanes[i] = v; }
      else setPath(s.settings, path, v);
    }, { allowLocked: free });
    return;
  }
  if (kind === 'dur') {
    const sec = C.parseDuration(val);
    if (sec === null) { toast('「' + val + '」を時間として読み取れません。1:30 のように 分:秒 で入れてください', 'err'); render(); return; }
    commit('時間設定の変更', s => { s.settings.schedule[rest[0]] = sec; });
    return;
  }
  if (kind === 'clubt') { const name = rest.join(':'); commit('クラブ目標の変更', s => { const c = s.settings.clubs.find(x => x.name === name); if (c) c.target = val; }, { allowLocked: true }); return; }
  if (kind === 'list') { return changeList(rest[0], val, el); }
  if (kind === 'comb') {
    const i = +rest[0];
    commit('合同レースの変更', s => {
      while (s.settings.combined.length <= i) s.settings.combined.push({ name: '', pairs: [{}, {}, {}] });
      const r = s.settings.combined[i];
      if (rest[1] === 'name') r.name = val.trim();
      else { const p = +rest[1]; r.pairs = r.pairs || [{}, {}, {}]; r.pairs[p] = Object.assign({}, r.pairs[p], { [rest[2]]: val }); }
    });
    return;
  }
  if (kind === 'ent' || kind === 'rel') {
    const id = rest[0], f = rest[1];
    const list = kind === 'ent' ? state.entries : state.relays;
    const row = list.find(x => x.id === id);
    if (!row) return;
    const cur = f[0] === 'm' && f.length === 2 ? row.members[+f[1]] : row[f];
    let v = val;
    if (f === 'name' || f === 'team' || f === 'mark' || f[0] === 'm') v = val.replace(/^[\s　]+|[\s　]+$/g, '');
    if (f === 'entryTime' || f === 'officialTime') v = C.fixTimeText(val);
    if ((cur || '') === v) return;
    commit((kind === 'ent' ? '個人' : 'リレー') + 'の変更', s => {
      const r = (kind === 'ent' ? s.entries : s.relays).find(x => x.id === id);
      if (f[0] === 'm' && f.length === 2) r.members[+f[1]] = v; else r[f] = v;
    }, { allowLocked: ENT_LOCK_OK.indexOf(f) >= 0 });
    return;
  }
  if (kind === 'sch') {
    const id = rest[0], f = rest[1];
    commit('スケジュールの変更', s => { const r = s.schedule.find(x => x.id === id); if (r) r[f] = val; });
    return;
  }
  if (kind === 'awm') { commit('表彰マスタの変更', s => { s.award[rest[0]] = val; }, { allowLocked: true }); return; }
  if (kind === 'awc') {
    const i = +rest[0], f = rest[1];
    commit('年齢区分マスタの変更', s => { s.award.cats[i][f] = f === 'name' ? val.trim() : val === '○'; }, { allowLocked: true });
    return;
  }
  if (kind === 'awe') {
    const id = rest[0], f = rest[1];
    const ev = state.award.events.find(e => e.id === id);
    if (f === 'name' && !val.trim() && ev && ev.name) {
      const n = Object.keys(state.award.inputs).filter(key => key.split('|')[2] === id && hasAw(state.award.inputs[key])).length;
      if (n) {
        confirmBox('種目を削除しますか？', '<p>「' + esc(ev.name) + '」には入力済みの記録が <b>' + n + '件</b> あります。種目名を消すとこの記録も削除されます。</p><p class="small muted">名前を変えるだけなら、新しい名前を上書き入力してください（記録はそのまま引き継がれます）。</p>', '削除する', () => {
          commit('種目の削除', s => { const e = s.award.events.find(x => x.id === id); e.name = ''; Object.keys(s.award.inputs).forEach(key => { if (key.split('|')[2] === id) delete s.award.inputs[key]; }); }, { allowLocked: true, snap: '表彰種目の削除前' });
        }, { danger: true });
        render(); return;
      }
    }
    commit('種目マスタの変更', s => { const e = s.award.events.find(x => x.id === id); e[f] = f === 'mvp' ? val === '○' : (f === 'name' ? val.trim() : C.fixTimeText(val)); }, { allowLocked: true });
    return;
  }
  if (kind === 'awi') {
    const key = rest[0], f = rest[1];
    const cur = (state.award.inputs[key] || {})[f] || '';
    if (cur === val.trim()) return;
    commit('表彰記録の入力', s => { const o = s.award.inputs[key] = Object.assign({}, s.award.inputs[key]); o[f] = f === 'time' ? C.fixTimeText(val) : val.trim(); if (!hasAw(o)) delete s.award.inputs[key]; }, { allowLocked: true });
  }
}
const hasAw = o => o && (C.str(o.club) || C.str(o.name) || C.str(o.time));

function changeList(kind, text, el) {
  const S = state.settings;
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const uniq = [...new Set(lines)];
  const before = kind === 'clubs' ? S.clubs.map(c => c.name) : S[kind];
  const removed = before.filter(x => x && uniq.indexOf(x) < 0);
  const inUse = removed.filter(x => kind === 'clubs' ? state.entries.some(e => e.club === x) || state.relays.some(r => r.team === x) :
    kind === 'events' ? state.entries.some(e => e.event === x) || state.relays.some(r => r.event === x) : state.entries.some(e => e.cat === x) || state.relays.some(r => r.cat === x));
  const apply = () => commit('リストの変更', s => {
    if (kind === 'clubs') s.settings.clubs = uniq.map(n => ({ name: n, target: (S.clubs.find(c => c.name === n) || {}).target || '' }));
    else s.settings[kind] = uniq;
  });
  if (lines.length !== uniq.length) toast('重複していた名前を1つにまとめました');
  if (inUse.length) {
    confirmBox('使われている名前が消えます', '<p>次の名前はエントリーで使われています: <b>' + esc(inUse.join('、')) + '</b></p><p>このまま消すと、そのエントリーは「リスト外」として警告されます。名前を変えたいだけなら「キャンセル」して「名前の一括変更」を使ってください。</p>', 'このまま変更する', apply);
    render();
  } else apply();
}

function runFix(f) {
  if (f === 'name') commit('氏名の空白をそろえる', s => { s.entries.forEach(e => { e.name = C.fixName(e.name); }); });
  else if (f === 'time') commit('タイムを半角にする', s => { s.entries.concat(s.relays).forEach(e => { e.entryTime = C.fixTimeText(e.entryTime); e.officialTime = C.fixTimeText(e.officialTime); }); }, { allowLocked: true });
  else if (f === 'clubs') { const add = unknownList('clubs'); commit('クラブの追加', s => { add.forEach(n => s.settings.clubs.push({ name: n, target: '' })); }); toast(add.length + '件のクラブを追加しました'); }
  else if (f === 'events') { const add = unknownList('events'); commit('種目の追加', s => { add.forEach(n => s.settings.events.push(n)); }); }
  else if (f === 'cats') { const add = unknownList('categories'); commit('区分の追加', s => { add.forEach(n => s.settings.categories.push(n)); }); toast('区分はリストの末尾に入りました。組の順番は区分リストの並び順です。必要なら大会設定で並べ替えてください', null, 8000); }
  else if (f === 'sched') { const miss = [...new Set(D.ind.concat(D.rel).filter(it => it.event).map(it => it.program))].filter(p => !state.schedule.some(r => C.str(r.name) === p)); commit('スケジュールへ追加', s => { miss.forEach(n => s.schedule.push({ id: uid(), name: n, adj: '' })); }); toast(miss.length + '種目をスケジュールの末尾に追加しました'); }
}

/* ---------------------------------------------------------------- Excelから貼り付け */
function openPaste() {
  modal('<h2>Excelから貼り付け</h2><p class="small">Excelで「氏名・チーム名・区分・種目名・エントリータイム（任意）」の列を範囲選択してコピーし、下に貼り付けてください。見出し行があっても自動で読み飛ばします。</p>' +
    '<textarea id="pz" rows="8" placeholder="山田　太郎　ヤマダ　タロウ	Aクラブ	7〜8歳	男子 25M 自由形	0:25.00" autofocus></textarea><div id="pzprev" class="small" style="margin-top:8px"></div>' +
    '<div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="pzok" disabled>追加する</button></div>', (m, close) => {
    let rows = [];
    const S = state.settings;
    const parse = () => {
      const txt = m.querySelector('#pz').value;
      rows = txt.split(/\r?\n/).map(l => l.split('\t')).filter(c => c.some(x => x.trim()))
        .filter(c => !/氏名|選手名/.test(c[0] || ''))
        .map(c => ({ id: uid(), name: C.fixName(c[0] || ''), club: (c[1] || '').trim(), cat: (c[2] || '').trim(), event: (c[3] || '').trim(), entryTime: (c[4] || '').trim(), officialTime: (c[5] || '').trim(), judge: '' }));
      const probs = rows.map(r => {
        const p = [];
        if (r.event && S.events.indexOf(r.event) < 0) p.push('種目がリストにない');
        if (r.cat && S.categories.indexOf(r.cat) < 0) p.push('区分がリストにない');
        if (r.club && !S.clubs.some(c => c.name === r.club)) p.push('チームがリストにない');
        if (C.parseTime(r.entryTime, { threeDigit: S.threeDigit }).kind === 'error') p.push('タイムを読めない');
        if (state.entries.some(e => e.name === r.name && e.event === r.event) || rows.filter(x => x.name === r.name && x.event === r.event).length > 1) p.push('二重エントリー');
        return p;
      });
      const nbad = probs.filter(p => p.length).length;
      m.querySelector('#pzprev').innerHTML = rows.length ? '<b>' + rows.length + '行</b> を読み取りました' + (nbad ? '。<span style="color:var(--warn)">' + nbad + '行に確認が必要です（追加後に「入力チェック」で直せます）</span>' : '。問題は見つかりませんでした。') +
        '<div class="tablewrap" style="max-height:220px;margin-top:6px"><table class="t"><thead><tr><th>氏名</th><th>チーム</th><th>区分</th><th>種目</th><th>タイム</th><th>確認</th></tr></thead><tbody>' +
        rows.slice(0, 200).map((r, i) => '<tr class="' + (probs[i].length ? 'warn' : '') + '"><td>' + esc(r.name) + '</td><td>' + esc(r.club) + '</td><td>' + esc(r.cat) + '</td><td>' + esc(r.event) + '</td><td>' + esc(r.entryTime) + '</td><td>' + esc(probs[i].join('・')) + '</td></tr>').join('') + '</tbody></table></div>' : '';
      m.querySelector('#pzok').disabled = !rows.length;
    };
    m.querySelector('#pz').addEventListener('input', parse);
    m.querySelector('#pzok').addEventListener('click', () => { close(); commit('貼り付けで追加', s => { s.entries.push(...rows); }, { snap: '貼り付け前' }); toast(rows.length + '行を追加しました', null, 7000, { label: '元に戻す', fn: undo }); });
  });
}

let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);

    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('読み込み失敗'));

}

/* ---------------------------------------------------------------- Excel 取り込み・書き出し */
const XlsxImport = (() => {
  const findSheet = (wb, part) => { const n = wb.SheetNames.find(s => s.indexOf(part) >= 0); return n ? wb.Sheets[n] : null; };
  const cell = (ws, a) => { const c = ws && ws[a]; return c ? c.v : undefined; };
  const s = v => v === undefined || v === null ? '' : String(v).trim();
  const timeStr = v => {
    if (v === undefined || v === null || v === '') return '';
    if (typeof v === 'number') { const p = C.parseTime(v, { threeDigit: 'sec' }); return p.kind === 'time' ? C.fmtTime(p.sec) : String(v); }
    return String(v).trim();
  };
  const clock = v => { if (typeof v === 'number' && v < 1) return C.fmtClock(Math.round(v * 86400)); return s(v); };
  const durSec = v => { if (typeof v === 'number') return v < 1 ? Math.round(v * 86400) : v; const d = C.parseDuration(v); return d === null ? '' : d; };
  const dateStr = v => {
    if (typeof v === 'number' && v > 20000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
    return s(v);
  };
  const col = (ws, letter, from, to) => { const out = []; for (let r = from; r <= to; r++) out.push(cell(ws, letter + r)); return out; };

  function detect(wb, X) {
    const app = wb.Sheets['_app_data'];
    if (app) {
      const rows = X.utils.sheet_to_json(app, { header: 1 });
      const json = rows.map(r => r[0] || '').join('');
      let st; try { st = JSON.parse(json); } catch (e) { st = null; }
      if (st && st.app === 'swim-meet') return {
        title: 'このアプリのExcelから復元しますか？',
        summary: '<p>大会名「' + esc(st.settings.meetName) + '」、個人 ' + st.entries.length + '件、リレー ' + st.relays.length + '件。今のデータは自動バックアップに控えてから置き換えます。</p>',
        apply: target => { Object.keys(target).forEach(k => delete target[k]); Object.assign(target, st); }
      };
    }
    if (findSheet(wb, '個人エントリー') && findSheet(wb, '大会設定')) return mainBook(wb);
    const first = wb.Sheets[wb.SheetNames[0]];
    if (first && (s(cell(first, 'V13')).indexOf('年齢区分') >= 0 || s(cell(first, 'U24')).indexOf('種目') >= 0)) return awardBook(first);
    return null;
  }

  function mainBook(wb) {
    const ind = findSheet(wb, '個人エントリー'), rel = findSheet(wb, 'リレーエントリー'), set = findSheet(wb, '大会設定'), sch = findSheet(wb, '進行スケジュール'), dash = findSheet(wb, 'ダッシュボード'), fl = findSheet(wb, '速報');
    const entries = [], relays = [];
    for (let r = 3; r <= 2000; r++) {
      const v = ['A', 'B', 'C', 'D', 'E', 'F', 'G'].map(c => cell(ind, c + r));
      if (v.every(x => x === undefined || x === '')) { if (r > 1000) break; continue; }
      entries.push({ id: uid(), name: s(v[0]), club: s(v[1]), cat: s(v[2]), event: s(v[3]), entryTime: timeStr(v[4]), officialTime: timeStr(v[5]), judge: s(v[6]) });
    }
    if (rel) for (let r = 3; r <= 1000; r++) {
      const v = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'].map(c => cell(rel, c + r));
      if (v.every(x => x === undefined || x === '')) continue;
      relays.push({ id: uid(), team: s(v[0]), mark: s(v[1]), cat: s(v[2]), event: s(v[3]), members: [s(v[4]), s(v[5]), s(v[6]), s(v[7])], entryTime: timeStr(v[8]), officialTime: timeStr(v[9]), judge: s(v[10]) });
    }
    const events = col(set, 'A', 1, 100).map(s).filter(x => x && x !== '休憩');
    const cats = col(set, 'B', 1, 100).map(s).filter(Boolean);
    const clubNames = col(set, 'C', 1, 100).map(s).filter(Boolean);
    const targets = {};
    if (dash) for (let r = 5; r <= 54; r++) { const n = s(cell(dash, 'G' + r)); if (n) targets[n] = s(cell(dash, 'H' + r)); }
    const lanes = col(set, 'F', 2, 6).map(v => v === undefined ? '' : s(v));
    const combined = [];
    for (let r = 7; r <= 30; r++) {
      const name = s(cell(set, 'S' + r));
      const pairs = [['T', 'U'], ['V', 'W'], ['X', 'Y']].map(([a, b]) => ({ event: s(cell(set, a + r)), cat: s(cell(set, b + r)) }));
      if (name || pairs.some(p => p.event || p.cat)) combined.push({ name, pairs });
    }
    const schedule = [];
    if (sch) for (let r = 8; r <= 57; r++) { const n = s(cell(sch, 'C' + r)); if (n) schedule.push({ id: uid(), name: n, adj: cell(sch, 'I' + r) === undefined ? '' : String(cell(sch, 'I' + r)) }); }
    const pts = col(set, 'O', 3, 12).map(v => v === undefined ? '' : v);
    const meetName = s(cell(ind, 'J1'));
    return {
      title: '大会運営ブックを読み込みますか？',
      summary: '<p>大会名「' + esc(meetName) + '」</p><ul><li>個人エントリー ' + entries.length + '件・リレー ' + relays.length + '件</li><li>種目 ' + events.length + '・区分 ' + cats.length + '・クラブ ' + clubNames.length + '</li><li>進行スケジュール ' + schedule.length + '行・合同レース ' + combined.filter(c => c.name).length + '件</li><li>記録証・賞状の文言、得点、レーン、時間の設定</li></ul><p>今のエントリーと大会設定は置き換わります（表彰者算出のデータはそのまま残ります）。今のデータは自動バックアップに控えます。</p>',
      go: 'check',
      apply: st => {
        const S = st.settings;
        if (meetName) S.meetName = meetName;
        if (events.length) S.events = events;
        if (cats.length) S.categories = cats;
        if (clubNames.length) S.clubs = clubNames.map(n => ({ name: n, target: targets[n] || '' }));
        if (lanes.some(Boolean)) S.lanes = lanes;
        S.combined = combined;
        const tv = cell(set, 'T2'), tr = cell(set, 'T3');
        if (tv !== undefined) S.minPerHeatInd = tv; if (tr !== undefined) S.minPerHeatRelay = tr;
        const sc = S.schedule;
        const m = { L2: 'title', L4: 'warmup', L11: 'closing' };
        Object.keys(m).forEach(a => { const v = cell(set, a); if (v !== undefined) sc[m[a]] = s(v); });
        [['L3', 'doorOpen'], ['L5', 'opening'], ['L6', 'start'], ['L12', 'exit']].forEach(([a, k]) => { const v = cell(set, a); if (v !== undefined) sc[k] = clock(v); });
        const cyc = cell(set, 'L7'); sc.cycleSec = cyc === undefined ? 0 : C.num(cyc);
        const iv = cell(set, 'L8'); if (iv !== undefined) sc.intervalMin = Math.round(durSec(iv) / 60 * 100) / 100;
        const br = cell(set, 'L9'); if (br !== undefined) sc.breakMin = Math.round(durSec(br) / 60 * 100) / 100;
        [['L14', 'heat25'], ['L15', 'heat50'], ['L16', 'heat100'], ['L17', 'heatRelay']].forEach(([a, k]) => { const v = cell(set, a); if (v !== undefined && durSec(v) !== '') sc[k] = durSec(v); });
        if (pts.some(v => v !== '')) S.points.ind = pts;
        const fin = cell(set, 'O13'); S.points.indFinish = fin === undefined ? '' : fin;
        const mult = s(cell(set, 'R14')); if (mult) S.points.relayMult = mult.indexOf('1') === 0 ? 1 : 2;
        const ct = (a, d) => { const v = cell(set, a); return v === undefined ? d : s(v); };
        S.cert = { title: ct('F10', S.cert.title), lines: ['F11', 'F12', 'F13', 'F14'].map((a, i) => ct(a, S.cert.lines[i])), date: dateStr(cell(set, 'F15')), organizer: ct('F16', S.cert.organizer), printRecord: s(cell(set, 'F17')) !== '印字しない' };
        S.award = { title: ct('F22', S.award.title), lines: ['F23', 'F24', 'F25', 'F26'].map((a, i) => ct(a, S.award.lines[i])), date: dateStr(cell(set, 'F27')), organizer: ct('F28', S.award.organizer) };
        if (dash) {
          const dv = a => cell(dash, a);
          if (dv('D4') !== undefined) S.dashboard.capacity = dv('D4');
          if (dv('D5') !== undefined) S.dashboard.target = dv('D5');
          if (dv('D12') !== undefined) S.dashboard.price = dv('D12');
          if (dv('D13') !== undefined) { const t = C.num(dv('D13')); S.dashboard.tax = t < 1 ? Math.round(t * 1000) / 10 : t; }
        }
        st.entries = entries; st.relays = relays;
        if (schedule.length) st.schedule = schedule;
        const f = fl && s(cell(fl, 'I2')); if (f) ui.flash = f;
      }
    };
  }

  function awardBook(ws) {
    const cats = [];
    for (let r = 14; r <= 21; r++) cats.push({ name: s(cell(ws, 'V' + r)).indexOf('（未設定') === 0 ? '' : s(cell(ws, 'V' + r)), mvp: C.isMark(cell(ws, 'W' + r)), exc: C.isMark(cell(ws, 'X' + r)) });
    const events = [];
    for (let r = 25; r <= 39; r++) events.push({ id: 'ae' + uid(), name: s(cell(ws, 'V' + r)), baseM: timeStr(cell(ws, 'W' + r)), baseF: timeStr(cell(ws, 'X' + r)), mvp: C.isMark(cell(ws, 'Y' + r)) });
    const inputs = {}; let n = 0, lost = 0;
    for (let r = 5; r <= 1204; r++) {
      const cat = s(cell(ws, 'B' + r)); if (!cat && !cell(ws, 'A' + r)) break;
      const club = s(cell(ws, 'F' + r)), name = s(cell(ws, 'G' + r)), tv = cell(ws, 'H' + r);
      if (!club && !name && (tv === undefined || tv === '')) continue;
      let k = cats.findIndex(c => c.name && c.name === cat) + 1;
      if (!k) { const m = cat.match(/（未設定(\d)）/); if (m) k = +m[1]; }
      const sx = s(cell(ws, 'C' + r)) === '女子' ? 1 : 0;
      const ev = events.find(e => e.name && e.name === s(cell(ws, 'D' + r)));
      const rk = parseInt(cell(ws, 'E' + r), 10);
      if (!k || !ev || !(rk >= 1 && rk <= 3)) { lost++; continue; }
      inputs[C.awardKey(k, sx, ev.id, rk)] = { club, name, time: typeof tv === 'number' && tv < 1 ? C.fmtTime(tv * 86400) : s(tv) };
      n++;
    }
    const A = {
      cStart: cell(ws, 'W6') || 1, cEnd: cell(ws, 'W7') || 8, rankMode: s(cell(ws, 'W8')) || '1〜3位すべて',
      minRate: (() => { const v = cell(ws, 'W9'); return v === undefined ? 0 : (typeof v === 'number' && v > 0 && v <= 5 ? Math.round(v * 1000) / 10 : v); })(),
      fold: s(cell(ws, 'W10')) || '枠を残して表示', cats, events, inputs
    };
    return {
      title: '表彰者算出ブックを読み込みますか？',
      summary: '<ul><li>年齢区分 ' + cats.filter(c => c.name).length + '・種目 ' + events.filter(e => e.name).length + '（基準タイム付き）</li><li>入力済みの記録 ' + n + '件' + (lost ? '（区分・種目が合わない ' + lost + '件は読み込みません）' : '') + '</li></ul><p>今の表彰者算出のデータは置き換わります（エントリーや大会設定はそのまま）。</p>',
      go: 'awards',
      apply: st => { st.award = A; }
    };
  }

  function buildExport(X) {
    const wb = X.utils.book_new();
    const add = (name, aoa, widths) => { const ws = X.utils.aoa_to_sheet(aoa); if (widths) ws['!cols'] = widths.map(w => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
    const S = state.settings;
    add('個人エントリー', [['氏名', 'チーム名', '区分', '種目名', 'エントリータイム', '公式タイム', '判定', 'プログラム', '組', 'レーン', '公式順位', '得点', '状態', '記録（表示）']].concat(
      D.ind.map(it => [it.e.name, it.e.club, it.e.cat, it.e.event, it.e.entryTime, it.e.officialTime, it.e.judge, it.program, it.heat || '', it.lane || '', it.rank || '', it.points === null ? '' : it.points, it.status, it.officialText])), [30, 12, 10, 22, 10, 10, 6, 22, 5, 5, 6, 5, 7, 12]);
    add('リレーエントリー', [['チーム名', '記号', '区分', '種目名', '第1泳者', '第2泳者', '第3泳者', '第4泳者', 'エントリータイム', '公式タイム', '判定', 'プログラム', '組', 'レーン', '公式順位', '得点', '状態']].concat(
      D.rel.map(it => [it.r.team, it.r.mark, it.r.cat, it.r.event].concat(it.members).concat([it.r.entryTime, it.r.officialTime, it.r.judge, it.program, it.heat || '', it.lane || '', it.rank || '', it.points === null ? '' : it.points, it.status]))));
    add('進行スケジュール', [['競技No', '種目名', '参加数', '組数', '所要時間', '開始時刻', '終了時刻', '調整(分)']].concat(
      D.sched.rows.map(o => [o.no, o.name, o.n === undefined ? '' : o.n, o.heats === undefined ? '' : o.heats, o.dur !== undefined ? C.fmtDuration(o.dur) : '', o.start !== null && o.start !== undefined ? C.fmtClock(o.start) : '', o.end !== null && o.end !== undefined ? C.fmtClock(o.end) : '', o.row.adj || ''])));
    const prog = [['プログラム', '組', 'レーン', '氏名／チーム', 'チーム／メンバー', '区分', '公式タイム', '順位']];
    programOptions().forEach(n => { const p = programData(n); p.heats.forEach(h => h.items.forEach(it => prog.push([n, h.heat, it.lane || '', p.relay ? it.teamDisp : it.name, p.relay ? it.memberText : it.club, it.cat, it.flashTime, it.flashRank]))); });
    add('プログラム', prog, [22, 5, 5, 30, 20, 10, 12, 6]);
    const fl = [['種目', '順位', '選手名／泳者', 'クラブ／チーム', '年齢区分', '公式タイム']];
    programOptions().forEach(n => C.flashList(state, D.ind, D.rel, n).forEach(x => fl.push([n, x.rank, x.name, x.club, x.cat, x.time])));
    add('速報', fl, [22, 6, 30, 14, 14, 12]);
    add('クラブ別', [['クラブ名', '目標', '実績', '差', '割合', '総合得点', 'チーム順位']].concat(D.dash.clubs.map(c => [c.name, c.target === null ? '' : c.target, c.actual, c.diff === null ? '' : c.diff, c.share === null ? '' : Math.round(c.share * 1000) / 10 + '%', c.score, c.rank])));
    const R = D.aw, rt = r => r === null || r === undefined ? '' : Math.round(r * 10000) / 100 + '%';
    add('表彰者', [['表彰区分', '年齢区分', '性別', 'クラブ', '選手名', '種目', '達成率', '判定']].concat(
      R.mvp.map(o => ['最優秀選手', o.catName || '', o.sexName, o.club || '', o.name || '', o.event || '', rt(o.rate), o.status])).concat(
      R.exc.map(o => [o.slot, o.catName, o.sexName, o.club || '', o.name || '', o.event || '', rt(o.rate), o.status])));
    // 完全復元用（このシートを消さなければ、このExcelから元どおりに戻せます）
    const json = serialize(), chunks = [];
    for (let i = 0; i < json.length; i += 30000) chunks.push([json.slice(i, i + 30000)]);
    const ws = X.utils.aoa_to_sheet(chunks); X.utils.book_append_sheet(wb, ws, '_app_data');
    wb.Workbook = { Sheets: wb.SheetNames.map(n => ({ Hidden: n === '_app_data' ? 1 : 0 })) };
    return wb;
  }
  return { detect, buildExport };
})();

/* ---------------------------------------------------------------- サンプル（架空の選手） */
function makeSample() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const fam = [['佐藤', 'サトウ'], ['鈴木', 'スズキ'], ['高橋', 'タカハシ'], ['田中', 'タナカ'], ['伊藤', 'イトウ'], ['渡辺', 'ワタナベ'], ['山本', 'ヤマモト'], ['中村', 'ナカムラ'], ['小林', 'コバヤシ'], ['加藤', 'カトウ'], ['吉田', 'ヨシダ'], ['山田', 'ヤマダ'], ['松本', 'マツモト'], ['井上', 'イノウエ'], ['木村', 'キムラ'], ['清水', 'シミズ'], ['森', 'モリ'], ['池田', 'イケダ']];
  const boy = [['陽翔', 'ハルト'], ['蓮', 'レン'], ['湊', 'ミナト'], ['蒼', 'アオイ'], ['樹', 'イツキ'], ['悠真', 'ユウマ'], ['大和', 'ヤマト'], ['律', 'リツ'], ['朝陽', 'アサヒ'], ['颯太', 'ソウタ']];
  const girl = [['陽葵', 'ヒマリ'], ['凛', 'リン'], ['結菜', 'ユイナ'], ['芽依', 'メイ'], ['紬', 'ツムギ'], ['澪', 'ミオ'], ['咲良', 'サクラ'], ['杏', 'アン'], ['葵', 'アオイ'], ['心春', 'コハル']];
  const st = C.emptyState(), S = st.settings;
  S.meetName = '（サンプル）第1回 みなと町ジュニアスイムフェスティバル';
  S.clubs = [{ name: 'みなとSC', target: 20 }, { name: 'さくらスイム', target: 15 }, { name: 'あおぞらクラブ', target: 15 }, { name: 'ひかりSS', target: 10 }];
  S.categories = ['6歳以下', '7〜8歳', '9〜10歳', '11〜12歳'];
  S.cert.date = '2026-11-23'; S.award.date = '2026-11-23';
  S.combined = [{ name: '合同 50M 自由形', pairs: [{ event: '男子 50M 自由形', cat: '6歳以下' }, { event: '男子 50M 自由形', cat: '7〜8歳' }, {}] }];
  const ind = ['25M 板キック', '25M 自由形', '25M 背泳ぎ', '25M 平泳ぎ', '25M バタフライ', '50M 自由形'];
  const base = { '25M 板キック': 26, '25M 自由形': 21, '25M 背泳ぎ': 25, '25M 平泳ぎ': 28, '25M バタフライ': 24, '50M 自由形': 45 };
  const catAdj = { '6歳以下': 1.45, '7〜8歳': 1.2, '9〜10歳': 1.0, '11〜12歳': 0.86 };
  const used = new Set();
  for (let i = 0; i < 64; i++) {
    const g = rnd() < 0.5 ? '男子' : '女子';
    const f = pick(fam), n = pick(g === '男子' ? boy : girl);
    const name = f[0] + '　' + n[0] + '　' + f[1] + '　' + n[1];
    if (used.has(name)) continue; used.add(name);
    const club = pick(S.clubs).name, cat = pick(S.categories);
    const evs = []; const k = rnd() < 0.6 ? 2 : 1;
    while (evs.length < k) { const e = pick(ind); if (evs.indexOf(e) < 0 && !(e === '50M 自由形' && cat === '6歳以下' && g === '女子')) evs.push(e); }
    evs.forEach(e => {
      const t = base[e] * catAdj[cat] * (g === '女子' ? 1.06 : 1) * (0.85 + rnd() * 0.35);
      const done = /板キック|自由形/.test(e) && !/50M/.test(e);
      st.entries.push({ id: uid(), name, club, cat, event: g + ' ' + e, entryTime: rnd() < 0.5 ? C.fmtTime(t * (0.97 + rnd() * 0.08)) : '', officialTime: done ? C.fmtTime(t) : '', judge: done && rnd() < 0.04 ? '失格' : '' });
    });
  }
  // 入力ミスの例（入力チェックで見つかります）
  if (st.entries[5]) st.entries[5].officialTime = '１８．３２';
  const mem = () => [0, 1, 2, 3].map(() => { const f = pick(fam), n = pick(rnd() < .5 ? boy : girl); return f[0] + '　' + n[0]; });
  st.relays = [
    { id: uid(), team: 'みなとSC', mark: 'A', cat: '9〜10歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '1:12.40', judge: '' },
    { id: uid(), team: 'さくらスイム', mark: '', cat: '9〜10歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '1:15.08', judge: '' },
    { id: uid(), team: 'あおぞらクラブ', mark: '', cat: '9〜10歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '', judge: '' },
    { id: uid(), team: 'みなとSC', mark: 'B', cat: '11〜12歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '', judge: '' }
  ];
  const order = ['男子 25M 板キック', '女子 25M 板キック', '男子 25M 自由形', '女子 25M 自由形', '男子 25M 背泳ぎ', '女子 25M 背泳ぎ', '休憩', '男子 25M 平泳ぎ', '女子 25M 平泳ぎ', '男子 25M バタフライ', '女子 25M バタフライ', '合同 50M 自由形', '男子 50M 自由形', '女子 50M 自由形', '混合 4×25M フリーリレー'];
  st.schedule = order.map(n => ({ id: uid(), name: n, adj: '' }));
  // 表彰マスタは大会設定に合わせる
  const A = st.award;
  A.cats = A.cats.map((c, i) => ({ name: S.categories[i] || '', mvp: true, exc: true }));
  const bt = { '25M 板キック': [22, 24], '25M 自由形': [18, 20], '25M 背泳ぎ': [21, 22], '25M 平泳ぎ': [23, 25], '25M バタフライ': [19, 21], '50M 自由形': [36.6, 40.7] };
  A.events = ind.map((e, i) => ({ id: 'ae' + (i + 1), name: e, baseM: C.fmtTime(bt[e][0]), baseF: C.fmtTime(bt[e][1]), mvp: true }));
  while (A.events.length < 15) A.events.push({ id: 'ae' + uid(), name: '', baseM: '', baseF: '', mvp: true });
  return st;
}

/* ---------------------------------------------------------------- 起動 */
(function boot() {
  load();
  view = (location.hash || '#home').slice(1) || 'home';
  if (!VIEWS[view]) view = 'home';
  recompute();
  render();
  if (state.entries.length) snapshot('起動時');
})();
</script>
