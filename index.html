function meetProgress() {
  const all = D.ind.concat(D.rel);
  const rows = (D.sched.rows || []).filter(r => r.name && !r.isBreak).map(r => {
    const its = all.filter(it => it.program === r.name && it.event);
    const done = its.filter(it => it.status && it.status !== '未入力').length;
    return { r, n: its.length, done, state: !its.length ? 'empty' : done === its.length ? 'done' : done ? 'doing' : 'todo' };
  });
  const cur = rows.find(x => x.state === 'doing' || x.state === 'todo');   // 進行順で最初の、入力が終わっていない種目
  const next = cur ? rows.slice(rows.indexOf(cur) + 1).find(x => x.state === 'todo' || x.state === 'doing') : null;
  const started = rows.some(x => x.done > 0);
  return { rows, cur, next, started, finished: rows.length > 0 && rows.every(x => x.state === 'done' || x.state === 'empty') };
}
function delayText(cur, started) {
  if (!cur || cur.r.start === null || cur.r.start === undefined) return null;
  const d = new Date(), now = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const diff = Math.round((now - cur.r.start) / 60);
  if (Math.abs(diff) > 240) return null;                      // 大会当日でなければ出さない
  if (!started && diff < 0) return { cls: 'info', t: '競技開始まで ' + (-diff) + '分' };
  if (diff > 2) return { cls: diff > 10 ? 'err' : 'warn', t: '予定より ' + diff + '分遅れ', diff };
  if (diff < -2) return { cls: 'ok', t: '予定より ' + (-diff) + '分早い', diff };
  return { cls: 'ok', t: 'ほぼ予定どおり', diff: 0 };
}
function readiness() {
  const S = state.settings;
  const ne = D.checks.filter(c => c.level === 'error').length;
  const missing = [...new Set(D.ind.concat(D.rel).filter(it => it.event).map(it => it.program))].filter(p => !state.schedule.some(r => C.str(r.name) === p));
  return [
    { ok: !ne, t: ne ? '入力エラーが ' + ne + '件あります' : '入力エラーはありません', go: 'check' },
    { ok: !missing.length, t: missing.length ? 'スケジュールにない種目: ' + missing.join('、') : '全種目がスケジュールに入っています', go: 'schedule' },
    { ok: !!C.str(S.meetName) && S.meetName.indexOf('（サンプル）') < 0, t: '大会名: ' + (S.meetName || '未設定'), go: 'settings' },
    { ok: !!S.cert.date && !!S.award.date, t: S.cert.date && S.award.date ? '記録証・賞状の日付が入っています' : '記録証・賞状の日付が未入力です', go: 'certs' },
    { ok: !!meta.lastBackup && meta.changesSinceBackup < 20, t: 'バックアップ: ' + (meta.lastBackup ? ago(meta.lastBackup) + '（その後の変更 ' + meta.changesSinceBackup + '回）' : 'まだ書き出していません'), act: 'backup' },
    { ok: isLocked(), t: isLocked() ? '当日モード（設定ロック）中です' : '当日は「当日モード」にすると設定の誤変更を防げます', act: 'lock', soft: true }
  ];
}

function listCard(kind, title, arr, hint) {

function renameCandidates(kind) {
  const S = state.settings;
  const base = kind === 'clubs' ? S.clubs.map(c => c.name) : S[kind];
  const set = new Set(base.filter(Boolean));
  if (kind === 'events') { state.entries.forEach(e => e.event && set.add(e.event)); state.relays.forEach(e => e.event && set.add(e.event)); }
  if (kind === 'categories') { state.entries.forEach(e => e.cat && set.add(e.cat)); state.relays.forEach(e => e.cat && set.add(e.cat)); }
  if (kind === 'clubs') { state.entries.forEach(e => e.club && set.add(e.club)); state.relays.forEach(e => e.team && set.add(e.team)); }
  return [...set];
}

/* ---------------------------------------------------------------- 画面: プログラム・記録入力 */
function programOptions() {
  const order = [];
  state.schedule.forEach(r => { const n = C.str(r.name); if (n && n !== '休憩' && order.indexOf(n) < 0) order.push(n); });
  C.programNames(state).forEach(n => { if (order.indexOf(n) < 0) order.push(n); });
  return order;
}
function programData(name) {
  const relay = C.isRelayName(name), src = relay ? D.rel : D.ind;
  const items = src.filter(it => it.program === name && it.event);
  const heats = new Map();
  items.forEach(it => { if (!heats.has(it.heat)) heats.set(it.heat, []); heats.get(it.heat).push(it); });
  const hs = [...heats.keys()].sort((a, b) => a - b).map(h => ({ heat: h, items: heats.get(h).sort((a, b) => (a.lane || 99) - (b.lane || 99)) }));
  const sch = D.sched.rows.find(r => r.name === name);
  const done = items.filter(it => it.status !== '未入力').length;
  return { relay, items, heats: hs, sch, done };
}

  return '<div class="vhead"><div><h1 class="view">プログラム・記録入力</h1><p class="lead">公式タイムを入れて Enter で次のレーンへ進みます。棄権・失格は「判定」で選びます（失格でも泳いだタイムは入れられます）。黄色の行は打ち間違いの可能性があります。当日モード中でも入力できます。</p></div></div>' +

      '<span class="pill ' + (allDone ? 'ok' : 'info') + '">入力 ' + p.done + ' / ' + p.items.length + '</span>' + (p.items.some(it => it.seatFixed) ? '<span class="pill mute" title="「組・レーンを入れ替え」で手で並べた位置を使っています">手で並べ替え済み</span>' : '') : '') +

          }).join('') + '</tbody></table></div>';

};
// 組・レーンの入れ替え（ドラッグ＆ドロップ、またはタップで選んで行き先をタップ）
function arrangePanel(p, lanes) {
  const maxH = Math.max(0, ...p.items.map(it => it.heat || 0));
  const fixedN = p.items.filter(it => it.seatFixed).length, movedN = p.items.filter(it => it.seatMoved).length;
  const card = it => {
    const who = p.relay ? it.teamDisp : it.np.kanji;
    const entry = it.pe.kind === 'time' ? C.fmtTime(it.pe.sec) : '';
    return '<button type="button" class="pcard' + (ui.arrSel === it.id ? ' sel' : '') + '" data-act="seatPick" data-id="' + esc(it.id) + '" aria-label="' + esc(who) + '（第' + it.heat + '組 ' + it.lane + 'レーン）">' +
      '<span class="fit nm"><b>' + (p.relay ? esc(who) : rubyName(it.np)) + '</b></span><span class="fit sub">' + (p.relay ? rubyMembers(it) : esc(it.club)) + '・' + esc(it.cat) + '</span><span class="et">' + esc(entry) + '</span></button>';
  };
  const heat = (h, isNew) => {
    const its = p.items.filter(it => it.heat === h);
    return '<div class="arh card' + (isNew ? ' newh' : '') + '"><div class="arh-h"><b>' + (isNew ? '新しい組（第 ' + h + ' 組）' : '第 ' + h + ' 組') + '</b><span class="muted small">' + (isNew ? 'ここへ入れると組が増えます' : its.length + (p.relay ? 'チーム' : '人')) + '</span></div>' +
      lanes.map(l => { const it = its.find(x => x.lane === l); return '<div class="slot" data-h="' + h + '" data-l="' + l + '"><span class="lane">' + l + '</span>' + (it ? card(it) : '<button type="button" class="slot-empty" data-act="seatPick" aria-label="第' + h + '組 ' + l + 'レーン（空き）">空き</button>') + '</div>'; }).join('') + '</div>';
  };
  return '<div class="notice info arr-help"><span class="grow">' + (isLocked() ? '<b>当日モード中は入れ替えできません。</b>上部の「当日モード」を解除してください。' : '選手を別のレーンへドラッグすると入れ替わります（空きなら移動）。スマホ・タブレットは長押ししてから動かします。タップで選んで行き先をタップしても同じです。') + (ui.arrSel ? '　<b>選択中：行き先をタップ</b>' : '') + '</span>' +
    (fixedN ? '<button class="btn sm" data-act="seatReset">自動の並びに戻す</button>' : '') + '</div>' +
    (movedN ? '<div class="notice warn">手で入れ替えた後に申込が変わったため、' + movedN + (p.relay ? 'チーム' : '人') + 'を空いているレーンへ自動で入れました。位置を確認してください。</div>' : '') +
    '<div class="arr fill" data-fill-id="arr">' + Array.from({ length: maxH }, (_, i) => heat(i + 1)).join('') + heat(maxH + 1, true) + '</div>';
}

  let h = at('title', d.title, 'title') + at('name', d.name, 'name');
  if (relay) h += at('mem1', d.mem1) + at('mem2', d.mem2); else if (d.club) h += at('club', d.club);
  h += at('rank', d.rank, 'name') + at('event', d.event) + at('record', d.record) + at('meet', d.meet);

  d.lines.forEach((t, i) => { h += '<div class="cl" style="left:' + dx + 'mm;right:' + (-dx) + 'mm;top:' + pct((lt + i * lgap) * sc + dy) + ';font-size:' + (lpt * sc) + 'pt">' + esc(t) + '</div>'; });

  return '<div class="cert' + (preview ? ' pvcert' : '') + '" style="' + style + '">' + fr + h + '</div>';
}

function unknownList(kind) {
  const S = state.settings, set = new Set();
  if (kind === 'clubs') { const k = new Set(S.clubs.map(c => C.str(c.name))); D.ind.forEach(it => { if (it.club && !k.has(it.club)) set.add(it.club); }); D.rel.forEach(it => { if (it.team && !k.has(it.team)) set.add(it.team); }); }
  if (kind === 'events') { const k = new Set(S.events.map(C.str)); D.ind.concat(D.rel).forEach(it => { if (it.event && !k.has(it.event)) set.add(it.event); }); }
  if (kind === 'categories') { const k = new Set(S.categories.map(C.str)); D.ind.concat(D.rel).forEach(it => { if (it.cat && !k.has(it.cat)) set.add(it.cat); }); }
  return [...set];
}

/* ---------------------------------------------------------------- 印刷まとめ（すべての印刷物・プレビュー・選んで結合印刷） */
function hubAll() {
  const opts = programOptions();
  const S = state.settings;
  const docs = [docSchedule()];
  opts.forEach(n => { const d = docProgram(n, 'blank'); if (d.pages) docs.push(d); });
  opts.forEach(n => { const d = docProgram(n, 'result'); if (d.pages && d.done) docs.push(d); });   // 記録が入った種目だけ
  opts.forEach(n => { const d = docFlash(n); if (d.pages && d.done) docs.push(d); });
  S.events.filter(Boolean).forEach(ev => { const d = docRanking(ev, ''); if (d.n) docs.push(d); });
  if (D.aw.sum.entered) docs.push(docAwards());
  [['record', 'ind'], ['record', 'rel'], ['prize', 'ind'], ['prize', 'rel']].forEach(([k, t]) => { const d = docCerts(k, t, {}); if (d.pages) docs.push(d); });
  return docs;
}
function hubDocsForPreview() {
  const all = hubAll(), sel = new Set(ui.hubSel || []);
  if (ui.hubFocus) { const f = all.find(d => d.key === ui.hubFocus); if (f) return [f]; }
  return all.filter(d => sel.has(d.key));
}
VIEWS.prints = () => {

    '<div class="bar hubbar"><span class="pill ' + (chosen.length ? 'info' : 'mute') + '">選択 ' + chosen.length + '件・A4 ' + pages + '枚</span>' +
    '<button class="btn sm" data-act="hubPick" data-v="progs">全種目のプログラム（手書き用）</button><button class="btn sm" data-act="hubPick" data-v="progrs">記録入りプログラムすべて</button><button class="btn sm" data-act="hubPick" data-v="flashes">記録のある速報すべて</button><button class="btn sm" data-act="hubPick" data-v="ranks">ランキングすべて</button><button class="btn sm" data-act="hubPick" data-v="none" ' + (chosen.length ? '' : 'disabled') + '>選択を外す</button>' +

    (focusName ? '<div class="notice info"><span class="grow">プレビュー: <b>' + esc(focusName.group + '　' + focusName.title) + '</b> を表示中</span><button class="btn sm" data-act="hubFocus" data-v="">選んだもののプレビューに戻す</button></div>' : '') +
    '<div class="hubgrid fill" data-fill-id="hub">' + groups.map(g => '<div class="card"><h2>' + esc(g.name) + ' <span class="muted small">' + g.docs.length + '件</span></h2>' +
      g.docs.map(d => '<div class="hubrow ' + (ui.hubFocus === d.key ? 'focus' : '') + '"><label><input type="checkbox" data-k="hub:' + esc(d.key) + '" ' + (sel.has(d.key) ? 'checked' : '') + '><span class="hubtx"><span class="hubt">' + esc(d.title) + '</span><span class="hubm">' + (d.sub ? esc(d.sub) + '・' : '') + 'A4 ' + d.pages + '枚</span></span></label><button class="btn sm" data-act="hubFocus" data-v="' + esc(d.key) + '">見る</button></div>').join('') + '</div>').join('') + '</div>';
};

/* ---------------------------------------------------------------- 値の変更 */
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] === undefined) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o === undefined || o === null) ? undefined : o[k], obj); }
const ENT_LOCK_OK = ['officialTime', 'judge'];
function setUI(f, val) {
  if (f === 'awCat') val = +val;
  if (f === 'prog') { ui._focusFirst = true; ui.progHeat = null; ui.arrSel = null; }
  if (f === 'progHeat') { val = +val; ui._focusFirst = true; }
  ui[f] = val;
  if (f.indexOf('ent') === 0 && f !== 'entPage') ui.entPage = 0;
  if (f === 'certKind' || f === 'certTarget') { ui.certFilter = {}; ui.certFrom = 1; ui.certTo = ''; }
  if (f === 'renKind') ui.renFrom = '';
  save(); render();
}
function handleValue(el) {
  const k = el.dataset.k;
  if (!k) return;
  delete el.dataset.dirty;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  const [kind, ...rest] = k.split(':');
  if (kind === 'ui' && rest[0] === 'snapAll') { ui.snapSel = val ? getSnaps().map(x => x.t) : []; render(); return; }
  if (kind === 'ui') { setUI(rest[0], val); return; }
  if (kind === 'hub') { const k = rest.join(':'); ui.hubSel = (ui.hubSel || []).filter(x => x !== k); if (val) ui.hubSel.push(k); ui.hubFocus = ''; render(); return; }
  if (kind === 'frshow' || kind === 'frsame') {
    commit('フレームの設定', st => { const f = st.settings.certFrame = frameCfg(); if (kind === 'frsame') { f.same = !!val; if (!val) { f.prize = f.record; f.show.prize = f.show.record; if (f.record === 'custom') { const im = frameImg('record'); try { if (im) localStorage.setItem(FRAME_IMG_KEY('prize'), im); } catch (e) { /* ignore */ } } } } else f.show[rest[0]] = !!val; }, { allowLocked: true });
    return;
  }
  if (kind === 'snap') { const t = +rest[0]; ui.snapSel = (ui.snapSel || []).filter(x => x !== t); if (val) ui.snapSel.push(t); render(); return; }
  if (kind === 'cf') { ui.certFilter = Object.assign({}, ui.certFilter, { [rest[0]]: val }); ui.certFrom = 1; ui.certTo = ''; render(); return; }
  if (kind === 'set') {
    const path = rest.join(':');
    let v = val;
    if (path === 'points.relayMult') v = +val;
    if (path === 'cert.printRecord') v = val === '1';
    if (getPath(state.settings, path) === v) return;
    const free = /^(cert|award|print)\./.test(path) || /^dashboard\./.test(path) || path === 'kanaStyle';
    if (path === 'kanaStyle') {      // 表記を変えたら、入力済みのフリガナもすべてそろえる
      commit('フリガナの表記を' + (v === 'hira' ? 'ひらがな' : 'カタカナ') + 'に変更', s => {
        s.settings.kanaStyle = v;
        s.entries.forEach(e => { if (e.name) e.name = C.normName(e.name, v); });
        s.relays.forEach(r => { r.members = (r.members || []).map(m => m ? C.normName(m, v) : m); });
      }, { allowLocked: true });
      toast('フリガナを' + (v === 'hira' ? 'ひらがな' : 'カタカナ') + 'にそろえました', null, 6000, { label: '元に戻す', fn: undo });
      return;
    }
    commit('設定の変更', s => {
      if (path.indexOf('lanes.') === 0) { const i = +path.split('.')[1]; while (s.settings.lanes.length <= i) s.settings.lanes.push(''); s.settings.lanes[i] = v; }
      else setPath(s.settings, path, v);
    }, { allowLocked: free });
    return;
  }
  if (kind === 'dur') {
    const sec = C.parseDuration(val);
    if (sec === null) { toast('「' + val + '」を時間として読み取れません。1:30 のように 分:秒 で入れてください', 'err'); render(); return; }
    commit('時間設定の変更', s => { s.settings.schedule[rest[0]] = sec; });
    return;
  }
  if (kind === 'clubt') { const name = rest.join(':'); commit('クラブ目標の変更', s => { const c = s.settings.clubs.find(x => x.name === name); if (c) c.target = val; }, { allowLocked: true }); return; }
  if (kind === 'list') { return changeList(rest[0], val, el); }
  if (kind === 'comb') {
    const i = +rest[0];
    commit('合同レースの変更', s => {
      while (s.settings.combined.length <= i) s.settings.combined.push({ name: '', pairs: [{}, {}, {}] });
      const r = s.settings.combined[i];
      if (rest[1] === 'name') r.name = val.trim();
      else { const p = +rest[1]; r.pairs = r.pairs || [{}, {}, {}]; r.pairs[p] = Object.assign({}, r.pairs[p], { [rest[2]]: val }); }
    });
    return;
  }
  if (kind === 'ent' || kind === 'rel') {
    const id = rest[0], f = rest[1];
    const list = kind === 'ent' ? state.entries : state.relays;
    const row = list.find(x => x.id === id);
    if (!row) return;
    const cur = f[0] === 'm' && f.length === 2 ? row.members[+f[1]] : row[f];
    let v = val;
    if (f === 'name' || f === 'team' || f === 'mark' || f[0] === 'm') v = val.replace(/^[\s　]+|[\s　]+$/g, '');
    if (f === 'name' || (f[0] === 'm' && f.length === 2)) v = C.normName(v, state.settings.kanaStyle);   // 空白をそろえ、フリガナを設定の表記へ自動で変換
    if (f === 'entryTime' || f === 'officialTime') v = C.fixTimeText(val);
    if ((cur || '') === v) return;
    commit((kind === 'ent' ? '個人' : 'リレー') + 'の変更', s => {
      const r = (kind === 'ent' ? s.entries : s.relays).find(x => x.id === id);
      if (f[0] === 'm' && f.length === 2) r.members[+f[1]] = v; else r[f] = v;
    }, { allowLocked: ENT_LOCK_OK.indexOf(f) >= 0 });
    return;
  }
  if (kind === 'sch') {
    const id = rest[0], f = rest[1];
    commit('スケジュールの変更', s => { const r = s.schedule.find(x => x.id === id); if (r) r[f] = val; });
    return;
  }
  if (kind === 'awm') { commit('表彰マスタの変更', s => { s.award[rest[0]] = val; }, { allowLocked: true }); return; }
  if (kind === 'awc') {
    const i = +rest[0], f = rest[1];
    commit('年齢区分マスタの変更', s => { s.award.cats[i][f] = f === 'name' ? val.trim() : val === '○'; }, { allowLocked: true });
    return;
  }
  if (kind === 'awe') {
    const id = rest[0], f = rest[1];
    const ev = state.award.events.find(e => e.id === id);
    if (f === 'name' && !val.trim() && ev && ev.name) {
      const n = Object.keys(state.award.inputs).filter(key => key.split('|')[2] === id && hasAw(state.award.inputs[key])).length;
      if (n) {
        confirmBox('種目を削除しますか？', '<p>「' + esc(ev.name) + '」には入力済みの記録が <b>' + n + '件</b> あります。種目名を消すとこの記録も削除されます。</p><p class="small muted">名前を変えるだけなら、新しい名前を上書き入力してください（記録はそのまま引き継がれます）。</p>', '削除する', () => {
          commit('種目の削除', s => { const e = s.award.events.find(x => x.id === id); e.name = ''; Object.keys(s.award.inputs).forEach(key => { if (key.split('|')[2] === id) delete s.award.inputs[key]; }); }, { allowLocked: true, snap: '表彰種目の削除前' });
        }, { danger: true });
        render(); return;
      }
    }
    commit('種目マスタの変更', s => { const e = s.award.events.find(x => x.id === id); e[f] = f === 'mvp' ? val === '○' : (f === 'name' ? val.trim() : C.fixTimeText(val)); }, { allowLocked: true });
    return;
  }
  if (kind === 'awi') {
    const key = rest[0], f = rest[1];
    const cur = (state.award.inputs[key] || {})[f] || '';
    if (cur === val.trim()) return;
    commit('表彰記録の入力', s => { const o = s.award.inputs[key] = Object.assign({}, s.award.inputs[key]); o[f] = f === 'time' ? C.fixTimeText(val) : val.trim(); if (!hasAw(o)) delete s.award.inputs[key]; }, { allowLocked: true });
  }
}
const hasAw = o => o && (C.str(o.club) || C.str(o.name) || C.str(o.time));

function changeList(kind, text, el) {
  const S = state.settings;
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const uniq = [...new Set(lines)];
  const before = kind === 'clubs' ? S.clubs.map(c => c.name) : S[kind];
  const removed = before.filter(x => x && uniq.indexOf(x) < 0);
  const inUse = removed.filter(x => kind === 'clubs' ? state.entries.some(e => e.club === x) || state.relays.some(r => r.team === x) :
    kind === 'events' ? state.entries.some(e => e.event === x) || state.relays.some(r => r.event === x) : state.entries.some(e => e.cat === x) || state.relays.some(r => r.cat === x));
  const apply = () => commit('リストの変更', s => {
    if (kind === 'clubs') s.settings.clubs = uniq.map(n => ({ name: n, target: (S.clubs.find(c => c.name === n) || {}).target || '' }));
    else s.settings[kind] = uniq;
  });
  if (lines.length !== uniq.length) toast('重複していた名前を1つにまとめました');
  if (inUse.length) {
    confirmBox('使われている名前が消えます', '<p>次の名前はエントリーで使われています: <b>' + esc(inUse.join('、')) + '</b></p><p>このまま消すと、そのエントリーは「リスト外」として警告されます。名前を変えたいだけなら「キャンセル」して「名前の一括変更」を使ってください。</p>', 'このまま変更する', apply);
    render();
  } else apply();
}

  },
  closeNav: () => { if (navPinnedNow()) { navPref.pinned = false; saveNavPref(); } navOpen = false; render(); },
  navSide: t => { navPref.side = t.dataset.v; saveNavPref(); render(); },
  navPin: () => { navPref.pinned = !navPref.pinned; saveNavPref(); navOpen = !navPref.pinned; render(); },
  setui: t => setUI(t.dataset.key, t.dataset.v),
  lock: () => {
    const on = !isLocked();
    undoStack.push({ label: '当日モードの切替', data: serialize() });
    state.settings.locked = on; state.rev++; save(); recompute(); render();
    toast(on ? '当日モードにしました。設定・エントリーの変更はできません（記録入力はできます）' : '当日モードを解除しました');
  },
  backup: () => exportJSON(),

function runFix(f) {
  if (f === 'name') commit('氏名の空白をそろえる', s => { s.entries.forEach(e => { e.name = C.fixName(e.name); }); });
  else if (f === 'time') commit('タイムを半角にする', s => { s.entries.concat(s.relays).forEach(e => { e.entryTime = C.fixTimeText(e.entryTime); e.officialTime = C.fixTimeText(e.officialTime); }); }, { allowLocked: true });
  else if (f === 'clubs') { const add = unknownList('clubs'); commit('クラブの追加', s => { add.forEach(n => s.settings.clubs.push({ name: n, target: '' })); }); toast(add.length + '件のクラブを追加しました'); }
  else if (f === 'events') { const add = unknownList('events'); commit('種目の追加', s => { add.forEach(n => s.settings.events.push(n)); }); }
  else if (f === 'cats') { const add = unknownList('categories'); commit('区分の追加', s => { add.forEach(n => s.settings.categories.push(n)); }); toast('区分はリストの末尾に入りました。組の順番は区分リストの並び順です。必要なら大会設定で並べ替えてください', null, 8000); }
  else if (f === 'sched') { const miss = [...new Set(D.ind.concat(D.rel).filter(it => it.event).map(it => it.program))].filter(p => !state.schedule.some(r => C.str(r.name) === p)); commit('スケジュールへ追加', s => { miss.forEach(n => s.schedule.push({ id: uid(), name: n, adj: '' })); }); toast(miss.length + '種目をスケジュールの末尾に追加しました'); }
}

/* ---------------------------------------------------------------- Excelから貼り付け */
function openPaste() {
  modal('<h2>Excelから貼り付け</h2><p class="small">Excelで「氏名・チーム名・区分・種目名・エントリータイム（任意）」の列を範囲選択してコピーし、下に貼り付けてください。見出し行があっても自動で読み飛ばします。</p>' +
    '<textarea id="pz" rows="8" placeholder="山田　太郎　ヤマダ　タロウ	Aクラブ	7〜8歳	男子 25M 自由形	0:25.00" autofocus></textarea><div id="pzprev" class="small" style="margin-top:8px"></div>' +
    '<div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="pzok" disabled>追加する</button></div>', (m, close) => {
    let rows = [];
    const S = state.settings;
    const parse = () => {
      const txt = m.querySelector('#pz').value;
      rows = txt.split(/\r?\n/).map(l => l.split('\t')).filter(c => c.some(x => x.trim()))
        .filter(c => !/氏名|選手名/.test(c[0] || ''))
        .map(c => ({ id: uid(), name: C.fixName(c[0] || ''), club: (c[1] || '').trim(), cat: (c[2] || '').trim(), event: (c[3] || '').trim(), entryTime: (c[4] || '').trim(), officialTime: (c[5] || '').trim(), judge: '' }));
      const probs = rows.map(r => {
        const p = [];
        if (r.event && S.events.indexOf(r.event) < 0) p.push('種目がリストにない');
        if (r.cat && S.categories.indexOf(r.cat) < 0) p.push('区分がリストにない');
        if (r.club && !S.clubs.some(c => c.name === r.club)) p.push('チームがリストにない');
        if (C.parseTime(r.entryTime, { threeDigit: S.threeDigit }).kind === 'error') p.push('タイムを読めない');
        if (state.entries.some(e => e.name === r.name && e.event === r.event) || rows.filter(x => x.name === r.name && x.event === r.event).length > 1) p.push('二重エントリー');
        return p;
      });
      const nbad = probs.filter(p => p.length).length;
      m.querySelector('#pzprev').innerHTML = rows.length ? '<b>' + rows.length + '行</b> を読み取りました' + (nbad ? '。<span style="color:var(--warn)">' + nbad + '行に確認が必要です（追加後に「入力チェック」で直せます）</span>' : '。問題は見つかりませんでした。') +
        '<div class="tablewrap" style="max-height:220px;margin-top:6px"><table class="t"><thead><tr><th>氏名</th><th>チーム</th><th>区分</th><th>種目</th><th>タイム</th><th>確認</th></tr></thead><tbody>' +
        rows.slice(0, 200).map((r, i) => '<tr class="' + (probs[i].length ? 'warn' : '') + '"><td>' + esc(r.name) + '</td><td>' + esc(r.club) + '</td><td>' + esc(r.cat) + '</td><td>' + esc(r.event) + '</td><td>' + esc(r.entryTime) + '</td><td>' + esc(probs[i].join('・')) + '</td></tr>').join('') + '</tbody></table></div>' : '';
      m.querySelector('#pzok').disabled = !rows.length;
    };
    m.querySelector('#pz').addEventListener('input', parse);
    m.querySelector('#pzok').addEventListener('click', () => { close(); commit('貼り付けで追加', s => { s.entries.push(...rows); }, { snap: '貼り付け前' }); toast(rows.length + '行を追加しました', null, 7000, { label: '元に戻す', fn: undo }); });
  });
}

/* ---------------------------------------------------------------- 印刷物（すべて A4 縦。1件＝1枚、証書は1人1枚）
 *  各画面の印刷・常時プレビュー・印刷まとめ（結合印刷）は、すべて下の doc*() で作った同じページを使う */
window.addEventListener('afterprint', () => { $('#print-root').innerHTML = ''; });
const pnow = () => { const d = new Date(); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
const nm2 = n => String(n || '').split('　').slice(0, 2).join('　');
function pPage(title, sub, body, label, zcls) {
  return '<section class="pg"><header class="pg-h"><div class="pg-top"><span class="pg-meet fitline">' + esc(state.settings.meetName) + '</span><span class="pg-date">' + pnow() + '</span></div>' +
    '<div class="pg-title fitline">' + esc(title) + '</div>' + (sub ? '<div class="pg-sub fitline">' + sub + '</div>' : '') + '</header>' +
    '<div class="pg-b"><div class="pg-z' + (zcls ? ' ' + zcls : '') + '">' + body + '</div></div>' +
    '<footer class="pg-f"><span>' + esc(label || title) + '</span><span>' + esc(state.settings.meetName) + '</span></footer></section>';
}
// 順位: 1〜3位は金・銀・銅の丸、それ以外は数字だけ（失格・棄権は文字）
function rkCell(n, text) {
  if (n >= 1 && n <= 3) return '<td class="rk"><span class="rkb m' + n + '">' + n + '</span></td>';
  if (n > 0) return '<td class="rk">' + n + '</td>';
  return '<td class="rk st">' + esc(text || '') + '</td>';
}
const medalCls = r => r === 1 ? 'm1' : r === 2 ? 'm2' : r === 3 ? 'm3' : '';
const rankNum = s => { const m = String(s || '').match(/^(\d+)/); return m ? +m[1] : 0; };
// 文字は改行させない。1枚の幅・高さに入りきらなければ 2段組み → 縮小 の順で自動調節（container は .pgroot。測るあいだ実寸で置く）
function fitLines(root) {
  root.querySelectorAll('.fitline, .cert .cl').forEach(el => {
    if (el.dataset.fs0 === undefined) el.dataset.fs0 = el.style.fontSize || '';   // 元の文字の大きさを覚えておき、毎回そこから測る
    el.style.fontSize = el.dataset.fs0;
    const cw = el.clientWidth;
    if (!cw) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    for (let i = 0; i < 6 && el.scrollWidth > cw + 1 && fs > 5; i++) { fs = fs * (cw / el.scrollWidth) * 0.98; el.style.fontSize = fs.toFixed(2) + 'px'; }
  });
}
function fitPages(root) {
  root.classList.add('measure');
  root.querySelectorAll('.pg').forEach(pg => {
    const b = pg.querySelector('.pg-b'), z = pg.querySelector('.pg-z');
    const H = b.clientHeight * 0.98, W = b.clientWidth;
    const scaleNeed = () => { z.style.zoom = 1; const r = z.getBoundingClientRect(); return Math.min(1, H / r.height, W / r.width); };
    z.classList.remove('two');
    const s1 = scaleNeed();
    if (s1 < 1 && s1 < 0.82 && !z.classList.contains('col1')) {   // col1: 必ず縦1列（プログラムの組など）        // 大きく縮める必要があるときだけ2段組みを試し、文字が大きく残る方を選ぶ
      const t = z.querySelector('table.split');
      let undo = null;
      if (t && t.tBodies[0] && t.tBodies[0].rows.length > 10) {
        const rows = [...t.tBodies[0].rows], half = Math.ceil(rows.length / 2);
        const t2 = t.cloneNode(true);
        rows.slice(half).forEach(r => r.remove());
        [...t2.tBodies[0].rows].slice(0, half).forEach(r => r.remove());
        const wrap = document.createElement('div'); wrap.className = 'split2';
        t.parentNode.insertBefore(wrap, t); wrap.appendChild(t); wrap.appendChild(t2);
        undo = () => { wrap.parentNode.insertBefore(t, wrap); [...t2.tBodies[0].rows].forEach(r => t.tBodies[0].appendChild(r)); wrap.remove(); };
      } else if (z.querySelectorAll('.blk').length > 1) { z.classList.add('two'); undo = () => z.classList.remove('two'); }
      if (undo && scaleNeed() < s1 * 1.12) undo();
    }
    let sc = scaleNeed();
    for (let i = 0; i < 4 && sc < 1; i++) {
      z.style.zoom = Math.max(0.3, (parseFloat(z.style.zoom) || 1) * sc * 0.99);
      const r = z.getBoundingClientRect();
      sc = Math.min(1, H / r.height, W / r.width);
    }
    // プログラム: 余白が大きく残るときは、行の高さを広げて用紙を使い切る（手書きの記入欄も書きやすくなる）
    z.style.removeProperty('--rp');
    if (z.classList.contains('col1') && sc >= 1) {
      const rows = z.querySelectorAll('.ptab tbody tr:not(.emp)').length;
      const extra = H - z.getBoundingClientRect().height;
      if (rows && extra > 20) {
        const per = Math.min(44, extra / rows) / 2;
        z.style.setProperty('--rp', per.toFixed(1) + 'px');
        for (let i = 0; i < 3 && z.getBoundingClientRect().height > H; i++) z.style.setProperty('--rp', (parseFloat(z.style.getPropertyValue('--rp')) * 0.85).toFixed(1) + 'px');
      }
    }
  });
  fitLines(root);
  root.classList.remove('measure');
}

function buildPreview() {
  const body = $('#pv-body');
  if (!body) return;
  const docs = viewDocs().filter(d => d && d.pages);
  const total = docs.reduce((a, d) => a + d.pages, 0);
  const cnt = $('#pv-count'); if (cnt) cnt.textContent = total ? 'A4 縦・' + total + '枚' : '';
  if (!total) { body.innerHTML = '<div class="empty small">印刷するものがありません。</div>'; return; }
  updateFrameStyle();
  const tmp = document.createElement('div'); tmp.className = 'pgroot';
  let left = PV_MAX, html = '';
  docs.forEach(d => { if (left <= 0) return; const n = Math.min(left, d.pages); html += d.html(n); left -= n; });
  tmp.innerHTML = html;
  document.body.appendChild(tmp);
  fitPages(tmp);
  const sheets = [...tmp.children];
  body.innerHTML = '';
  sheets.forEach((el, i) => {
    const box = document.createElement('div'); box.className = 'sheetbox';
    const sh = document.createElement('div'); sh.className = 'sheet pgroot';
    sh.appendChild(el); box.appendChild(sh); body.appendChild(box);
    const scale = box.clientWidth / sh.offsetWidth;
    sh.style.transform = 'scale(' + scale + ')';
    box.style.height = (sh.offsetHeight * scale) + 'px';
    const no = document.createElement('div'); no.className = 'sheetno'; no.textContent = (i + 1) + ' / ' + total; box.appendChild(no);
  });
  if (total > sheets.length) { const m = document.createElement('div'); m.className = 'empty small'; m.textContent = 'ほか ' + (total - sheets.length) + '枚（プレビューは最初の' + PV_MAX + '枚まで。印刷ではすべて出ます）'; body.appendChild(m); }
  tmp.remove();
}

function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
function download(name, blob) {

}

function importJSON(file) {

    confirmBox('バックアップから復元しますか？', '<p>「' + esc(file.name) + '」: 大会名「' + esc((s.settings || {}).meetName || '') + '」、個人 ' + s.entries.length + '件、リレー ' + (s.relays || []).length + '件。</p><p>今のデータは自動バックアップに控えてから置き換えます。</p>', '復元する', () => {

let xlsxLoading = null;

    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('読み込み失敗'));

  });
  return xlsxLoading;
}

// 1人を (組 h, レーン l) へ。そこに誰かいれば入れ替え。入れ替えた種目の全員の位置を固定する（後から申込が増えても他の人は動かない）
function seatMove(id, h, l) {
  const name = ui.prog, relay = C.isRelayName(name);
  const items = (relay ? D.rel : D.ind).filter(it => it.program === name && it.heat && it.lane);
  const a = items.find(it => it.id === id);
  if (!a || !h || !l) { render(); return; }
  const b = items.find(it => it.heat === h && it.lane === l);
  if (b === a) { render(); return; }
  const pos = new Map(items.map(it => [it.id, { h: it.heat, l: it.lane }]));
  pos.set(a.id, { h, l });
  if (b) pos.set(b.id, { h: a.heat, l: a.lane });
  const nm = it => relay ? it.teamDisp : it.name.split('　').slice(0, 2).join('　');
  const ok = commit('組・レーンの入れ替え（' + name + '）', s => {
    const map = new Map((relay ? s.relays : s.entries).map(o => [o.id, o]));
    pos.forEach((v, k) => { const o = map.get(k); if (o) o.seat = { p: name, h: v.h, l: v.l }; });
  });
  if (ok) toast(nm(a) + ' → 第' + h + '組 ' + l + 'レーン' + (b ? '（' + nm(b) + ' と入れ替え）' : ''), null, 7000, { label: '元に戻す', fn: undo });

    files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' });

  const MARK = 'SWIM-ENTRY-FORM-2';
  // フリガナの見出しは大会設定の表記（カタカナ／ひらがな）に合わせる。どちらで書かれても読み込み時にそろえる
  const hira = () => state.settings.kanaStyle === 'hira';
  const KANA_WORD = () => hira() ? 'ふりがな' : 'フリガナ';
  const IND_HEAD = () => ['No', '姓', '名', hira() ? 'せい（ふりがな）' : 'セイ（カナ）', hira() ? 'めい（ふりがな）' : 'メイ（カナ）', 'チーム名', '区分', '種目', 'エントリータイム（任意）'];
  const REL_HEAD = () => ['No', 'チーム名', '記号', '区分', '種目'].concat(...[1, 2, 3, 4].map(m => ['第' + m + '泳者 氏名', '第' + m + '泳者 ' + KANA_WORD()])).concat(['エントリータイム（任意）']);

      [hira() ? '2. 姓・名は漢字、せい・めいは ふりがな で記入してください（例: 山田／太郎／やまだ／たろう）。カタカナで書いても、読み込むときに ふりがな に直します。' : '2. 姓・名は漢字、セイ・メイはカタカナで記入してください（例: 山田／太郎／ヤマダ／タロウ）。ひらがなで書いても、読み込むときにカタカナに直します。', 4],
      ['3. チーム名・区分・種目は、セルを選ぶと出る ▼ から選んでください。手で打つと読み込めないことがあります。', 4],
      ['4. エントリータイムは分かる場合だけ記入します（例: 28.50 または 1:05.30）。', 4],
      [mx > 0 ? '5. 1人' + mx + '種目までです。' : '5. 出場できる種目数は大会要項を確認してください。', 4],
      ['6. リレーに出る場合は「リレーエントリー」シートに、チームごとに1行で記入してください。泳者4人それぞれの氏名（例: 山田 太郎）と' + KANA_WORD() + '（例: ' + (hira() ? 'やまだ たろう' : 'ヤマダ タロウ') + '）を書きます。同じチームから2組出るときは記号に A・B と入れます。', 4],
      ['7. シート名・見出しの行・列の並びは変えないでください。行の追加・削除もしないでください（足りないときは大会係へ連絡してください）。', 7],
      ['8. 記入が終わったら、このファイルのまま（名前を変えてもかまいません）提出してください。', 4]].forEach(([t, s]) => L.push([{ v: t, s }]));
    L.push([]);
    L.push([{ v: '選べる区分: ' + cats.join('、'), s: 4 }]);
    L.push([{ v: '選べる種目: ' + indEv.join('、'), s: 4 }]);
    if (relEv.length) L.push([{ v: 'リレー種目: ' + relEv.join('、'), s: 4 }]);

    // 2. 個人エントリー
    const iv = [[{ v: '個人エントリー' + (team ? '（' + team + '）' : ''), s: 3 }], [{ v: '黄色いセルに記入。1行＝1人1種目。チーム・区分・種目は ▼ から選択。', s: 4 }], []];

    const r1 = HEAD_ROW + 1, r2 = HEAD_ROW + nInd;

      const q1 = HEAD_ROW + 1, q2 = HEAD_ROW + nRel;
      const dvR = [{ sqref: 'D' + q1 + ':D' + q2, formula: 'CatList', title: '区分', msg: '区分は ▼ の中から選んでください', strict: true },
        { sqref: 'E' + q1 + ':E' + q2, formula: 'RelEvList', title: '種目', msg: '種目は ▼ の中から選んでください', strict: true },
        { sqref: 'C' + q1 + ':C' + q2, formula: '"A,B,C,D,E"', title: '記号', msg: '記号は A〜E から選ぶか、空欄にしてください', strict: false }];
      if (!team) dvR.push({ sqref: 'B' + q1 + ':B' + q2, formula: 'TeamList', title: 'チーム名', msg: 'チーム名は ▼ の中から選んでください', strict: true });
      sheets.push({ name: 'リレーエントリー', rows: rv, cols: [6, 18, 7, 12, 26, 14, 16, 14, 16, 14, 16, 14, 16, 16], freeze: HEAD_ROW, merges: ['A1:N1', 'A2:N2'], dv: dvR, heights: { 1: 26, 2: 18, 4: 30 } });
    }
    // 4. 選択肢（非表示）と、読み込み用の目印
    const n = Math.max(clubs.length, cats.length, indEv.length, relEv.length, 1);
    const lr = [[{ v: MARK }, { v: S.meetName }, { v: team }, { v: new Date().toISOString() }], [{ v: 'チーム' }, { v: '区分' }, { v: '個人種目' }, { v: 'リレー種目' }]];
    for (let i = 0; i < n; i++) lr.push([{ v: clubs[i] || '' }, { v: cats[i] || '' }, { v: indEv[i] || '' }, { v: relEv[i] || '' }]);
    sheets.push({ name: '_選択肢', rows: lr, hidden: true });
    const ref = (col, len) => "'_選択肢'!$" + col + '$3:$' + col + '$' + (2 + Math.max(1, len));
    const names = [{ name: 'TeamList', ref: ref('A', clubs.length) }, { name: 'CatList', ref: ref('B', cats.length) }, { name: 'IndEvList', ref: ref('C', indEv.length) }, { name: 'RelEvList', ref: ref('D', relEv.length) }];
    return workbook(sheets, names);
  }

  // ---- 記入済みファイルの読み込み（SheetJS）
  const s = v => v === undefined || v === null ? '' : String(v).replace(/^[\s　]+|[\s　]+$/g, '');
  const kana = v => C.kanaConv(s(v), state.settings.kanaStyle);   // カタカナ・ひらがな・半角カナのどれで書かれても設定の表記へ
  function isForm(wb) { const L = wb.Sheets['_選択肢']; return !!(L && L.A1 && String(L.A1.v).indexOf('SWIM-ENTRY-FORM') === 0) || !!(wb.Sheets['個人エントリー'] && wb.Sheets['個人エントリー']['B' + HEAD_ROW] && wb.Sheets['個人エントリー']['B' + HEAD_ROW].v === '姓'); }
  function read(wb, X, fileName) {
    const L = wb.Sheets['_選択肢'];
    const meta = { file: fileName, team: L && L.C1 ? s(L.C1.v) : '', meet: L && L.B1 ? s(L.B1.v) : '' };
    const timeStr = v => { if (v === undefined || v === null || v === '') return ''; if (typeof v === 'number') { const p = C.parseTime(v, { threeDigit: 'sec' }); return p.kind === 'time' ? C.fmtTime(p.sec) : String(v); } return C.fixTimeText(s(v)); };

    });
    // リレー: 新しい形（泳者ごとに 氏名・フリガナ の2列）と、以前に配った形（氏名だけ4列）のどちらも読める
    const wsR = wb.Sheets['リレーエントリー'];
    const g4 = wsR && wsR['G' + HEAD_ROW] ? s(wsR['G' + HEAD_ROW].v) : '';
    const withKana = /フリガナ|ふりがな|カナ/.test(g4);
    rowsOf(wsR).forEach((r, i) => {
      const team = s(r[1]), mark = s(r[2]).toUpperCase(), cat = s(r[3]), ev = s(r[4]);
      const mem = [0, 1, 2, 3].map(m => {
        const nm = C.fixName(s(withKana ? r[5 + m * 2] : r[5 + m])), kn = withKana ? C.fixName(kana(r[6 + m * 2])) : '';
        return nm ? C.normName(nm + (kn ? '　' + kn : ''), state.settings.kanaStyle) : '';
      });
      const noKana = withKana ? [0, 1, 2, 3].filter(m => s(r[5 + m * 2]) && !s(r[6 + m * 2])).map(m => m + 1) : [];
      if (!mark && !cat && !ev && !mem.some(Boolean)) return;
      relays.push({ id: uid(), team: team || meta.team, mark, cat, event: ev, members: mem, entryTime: timeStr(withKana ? r[13] : r[9]), officialTime: '', judge: '', _row: HEAD_ROW + 1 + i, _file: fileName, _noKana: noKana });
    });

  }
  function check(res) {
    const S = state.settings, probs = [];
    const clubs = new Set(S.clubs.map(c => c.name)), cats = new Set(S.categories), evs = new Set(S.events);

      if (!e.club) p.push('チーム名が空欄'); else if (!clubs.has(e.club)) p.push('チーム「' + e.club + '」がリストにない');
      if (!e.cat) p.push('区分が空欄'); else if (!cats.has(e.cat)) p.push('区分「' + e.cat + '」がリストにない');
      if (!e.event) p.push('種目が空欄'); else if (!evs.has(e.event)) p.push('種目「' + e.event + '」がリストにない');
      if (C.parseTime(e.entryTime, { threeDigit: S.threeDigit }).kind === 'error') p.push('タイム「' + e.entryTime + '」を読めない');
      const k = C.normKey(e.name) + '|' + e.event;
      if (e.name && e.event && seen.has(k)) { e._dup = true; p.push('同じ選手・種目がすでにある'); } else seen.add(k);

    });
    res.relays.forEach(r => {
      const p = [];
      if (!r.team) p.push('チーム名が空欄'); else if (!clubs.has(r.team)) p.push('チーム「' + r.team + '」がリストにない');
      if (!r.cat) p.push('区分が空欄'); if (!r.event) p.push('種目が空欄'); else if (!evs.has(r.event)) p.push('種目がリストにない');
      if (r.members.filter(Boolean).length < 4) p.push('泳者が4人そろっていない');
      if (r._noKana && r._noKana.length) p.push('第' + r._noKana.join('・') + '泳者のフリガナが空欄');
      if (p.length) probs.push({ where: r._file + ' リレー ' + r._row + '行目 ' + r.team + ' ' + r.mark, what: p.join('・') });

})();

// ---- 画面からの操作

  const clubs = S.clubs.map(c => c.name).filter(Boolean);
  modal('<h2>エントリー用Excelを作る</h2><p class="small">各チームに配って記入してもらい、締め切り後にまとめて読み込むためのExcelを作ります。チーム名・区分・種目は ▼ から選ぶ形になるので、打ち間違いが起きにくくなります。</p>' +
    '<div class="fields">' +
    field('作り方', '<select id="ef-mode"><option value="all">全チーム共通の1ファイル</option><option value="each">チームごとに1ファイルずつ（' + clubs.length + 'ファイル）</option><option value="one">特定のチーム用の1ファイル</option></select>') +
    field('チーム（特定のチーム用）', '<select id="ef-team">' + clubs.map(c => '<option>' + esc(c) + '</option>').join('') + '</select>') +
    field('個人の記入行数', '<input id="ef-rows" value="100" inputmode="numeric">') +
    field('リレーの記入行数', '<input id="ef-rel" value="20" inputmode="numeric">') +
    field('締め切り（記入方法に表示）', '<input id="ef-deadline" placeholder="例: 11月10日（月）17時">') +
    field('提出先（記入方法に表示）', '<input id="ef-contact" placeholder="例: 大会係 メールアドレス">') +
    '</div><p class="small muted" style="margin-top:10px">今の大会設定（種目・区分・クラブ）が選択肢になります。設定を変えたら作り直してください。</p>' +
    '<div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="ef-ok">Excelを作る</button></div>', (m, close) => {
    m.querySelector('#ef-ok').addEventListener('click', () => {
      const mode = m.querySelector('#ef-mode').value;
      const base = { rows: parseInt(m.querySelector('#ef-rows').value, 10) || 100, relRows: parseInt(m.querySelector('#ef-rel').value, 10), deadline: m.querySelector('#ef-deadline').value.trim(), contact: m.querySelector('#ef-contact').value.trim() };
      const teams = mode === 'all' ? [''] : mode === 'one' ? [m.querySelector('#ef-team').value] : clubs;

        const bytes = EntryForm.build(Object.assign({ team: t }, base));
        download('エントリー用_' + (t || '全チーム') + '.xlsx', new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      }, i * 400));
      toast(teams.length + 'ファイルを作りました。ダウンロードフォルダを確認してください', null, 6000);
    });
  });
}
function importEntryForms(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  toast(files.length + 'ファイルを読み込んでいます…');
  loadXLSX().then(X => Promise.all(files.map(f => f.arrayBuffer().then(buf => ({ f, wb: X.read(buf, { type: 'array' }) })))).then(list => {
    const res = { entries: [], relays: [], metas: [], bad: [] };
    list.forEach(({ f, wb }) => {
      if (!EntryForm.isForm(wb)) { res.bad.push(f.name); return; }
      const r = EntryForm.read(wb, X, f.name);
      res.entries.push(...r.entries); res.relays.push(...r.relays); res.metas.push(Object.assign(r.meta, { n: r.entries.length, nr: r.relays.length }));
    });
    const probs = EntryForm.check(res);
    const dups = res.entries.filter(e => e._dup).length;
    const teams = [...new Set(res.entries.map(e => e.club).concat(res.relays.map(r => r.team)).filter(Boolean))];
    modal('<h2>記入済みエントリーを読み込む</h2>' +
      (res.bad.length ? '<div class="notice warn"><span class="grow">エントリー用Excelではないため読み込まないファイル: ' + esc(res.bad.join('、')) + '</span></div>' : '') +
      '<div class="tablewrap" style="max-height:180px"><table class="t"><thead><tr><th>ファイル</th><th>チーム</th><th class="num">個人</th><th class="num">リレー</th></tr></thead><tbody>' +
      res.metas.map(mm => '<tr><td>' + esc(mm.file) + '</td><td>' + esc(mm.team || '（共通）') + '</td><td class="num">' + mm.n + '</td><td class="num">' + mm.nr + '</td></tr>').join('') + '</tbody></table></div>' +
      '<p>合計: 個人 <b>' + res.entries.length + '件</b>・リレー <b>' + res.relays.length + '件</b>' + (dups ? '（うち、すでに登録済みと同じ選手・種目 ' + dups + '件）' : '') + '</p>' +
      (probs.length ? '<details class="card" style="padding:10px 12px"><summary>確認が必要な行 ' + probs.length + '件（読み込んだ後「入力チェック」でも直せます）</summary><div style="max-height:200px;overflow:auto;margin-top:6px">' + probs.slice(0, 300).map(p => '<div class="issue small"><span class="pill warn">' + esc(p.what) + '</span><span>' + esc(p.where) + '</span></div>').join('') + '</div></details>' : '<div class="notice ok">問題のある行は見つかりませんでした。</div>') +
      '<div class="fields" style="margin-top:10px">' + field('読み込み方', '<select id="ei-mode"><option value="add">今のエントリーに追加する（登録済みと同じ選手・種目は飛ばす）</option><option value="team">このファイルのチーム（' + esc(teams.join('、') || '—') + '）の今のエントリーを置き換える</option><option value="all">今のエントリーをすべて置き換える</option></select>') + '</div>' +
      '<div class="actions"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="ei-ok" ' + (res.entries.length + res.relays.length ? '' : 'disabled') + '>読み込む</button></div>', (m, close) => {
      m.querySelector('#ei-ok').addEventListener('click', () => {
        const mode = m.querySelector('#ei-mode').value;
        close();
        const clean = o => { const c = Object.assign({}, o); delete c._row; delete c._file; delete c._dup; delete c._noKana; return c; };
        const addE = res.entries.filter(e => mode !== 'add' || !e._dup).map(clean), addR = res.relays.map(clean);
        commit('エントリー用Excelの読み込み', s => {
          if (mode === 'all') { s.entries = []; s.relays = []; }
          if (mode === 'team') { const ts = new Set(teams); s.entries = s.entries.filter(e => !ts.has(e.club)); s.relays = s.relays.filter(r => !ts.has(r.team)); }
          s.entries.push(...addE); s.relays.push(...addR);
        }, { snap: 'エントリー読み込み前' });
        meta.sample = false; saveMeta();
        location.hash = 'entries';
        toast('個人 ' + addE.length + '件・リレー ' + addR.length + '件を読み込みました。「入力チェック」で確認してください', null, 9000, { label: '元に戻す', fn: undo });
      });
    });
  })).catch(e => toast(e.message, 'err', 9000));
}

/* ---------------------------------------------------------------- Excel 取り込み・書き出し */
const XlsxImport = (() => {
  const findSheet = (wb, part) => { const n = wb.SheetNames.find(s => s.indexOf(part) >= 0); return n ? wb.Sheets[n] : null; };
  const cell = (ws, a) => { const c = ws && ws[a]; return c ? c.v : undefined; };
  const s = v => v === undefined || v === null ? '' : String(v).trim();
  const timeStr = v => {
    if (v === undefined || v === null || v === '') return '';
    if (typeof v === 'number') { const p = C.parseTime(v, { threeDigit: 'sec' }); return p.kind === 'time' ? C.fmtTime(p.sec) : String(v); }
    return String(v).trim();
  };
  const clock = v => { if (typeof v === 'number' && v < 1) return C.fmtClock(Math.round(v * 86400)); return s(v); };
  const durSec = v => { if (typeof v === 'number') return v < 1 ? Math.round(v * 86400) : v; const d = C.parseDuration(v); return d === null ? '' : d; };
  const dateStr = v => {
    if (typeof v === 'number' && v > 20000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
    return s(v);
  };
  const col = (ws, letter, from, to) => { const out = []; for (let r = from; r <= to; r++) out.push(cell(ws, letter + r)); return out; };

  function detect(wb, X) {
    const app = wb.Sheets['_app_data'];
    if (app) {
      const rows = X.utils.sheet_to_json(app, { header: 1 });
      const json = rows.map(r => r[0] || '').join('');
      let st; try { st = JSON.parse(json); } catch (e) { st = null; }
      if (st && st.app === 'swim-meet') return {
        title: 'このアプリのExcelから復元しますか？',
        summary: '<p>大会名「' + esc(st.settings.meetName) + '」、個人 ' + st.entries.length + '件、リレー ' + st.relays.length + '件。今のデータは自動バックアップに控えてから置き換えます。</p>',
        apply: target => { Object.keys(target).forEach(k => delete target[k]); Object.assign(target, st); }
      };
    }
    if (findSheet(wb, '個人エントリー') && findSheet(wb, '大会設定')) return mainBook(wb);
    const first = wb.Sheets[wb.SheetNames[0]];
    if (first && (s(cell(first, 'V13')).indexOf('年齢区分') >= 0 || s(cell(first, 'U24')).indexOf('種目') >= 0)) return awardBook(first);
    return null;
  }

  function mainBook(wb) {
    const ind = findSheet(wb, '個人エントリー'), rel = findSheet(wb, 'リレーエントリー'), set = findSheet(wb, '大会設定'), sch = findSheet(wb, '進行スケジュール'), dash = findSheet(wb, 'ダッシュボード'), fl = findSheet(wb, '速報');
    const entries = [], relays = [];
    for (let r = 3; r <= 2000; r++) {
      const v = ['A', 'B', 'C', 'D', 'E', 'F', 'G'].map(c => cell(ind, c + r));
      if (v.every(x => x === undefined || x === '')) { if (r > 1000) break; continue; }
      entries.push({ id: uid(), name: s(v[0]), club: s(v[1]), cat: s(v[2]), event: s(v[3]), entryTime: timeStr(v[4]), officialTime: timeStr(v[5]), judge: s(v[6]) });
    }
    if (rel) for (let r = 3; r <= 1000; r++) {
      const v = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'].map(c => cell(rel, c + r));
      if (v.every(x => x === undefined || x === '')) continue;
      relays.push({ id: uid(), team: s(v[0]), mark: s(v[1]), cat: s(v[2]), event: s(v[3]), members: [s(v[4]), s(v[5]), s(v[6]), s(v[7])], entryTime: timeStr(v[8]), officialTime: timeStr(v[9]), judge: s(v[10]) });
    }
    const events = col(set, 'A', 1, 100).map(s).filter(x => x && x !== '休憩');
    const cats = col(set, 'B', 1, 100).map(s).filter(Boolean);

    const targets = {};

    const lanes = col(set, 'F', 2, 6).map(v => v === undefined ? '' : s(v));
    const combined = [];
    for (let r = 7; r <= 30; r++) {

      const pairs = [['T', 'U'], ['V', 'W'], ['X', 'Y']].map(([a, b]) => ({ event: s(cell(set, a + r)), cat: s(cell(set, b + r)) }));

      title: '大会運営ブックを読み込みますか？',

      go: 'check',
      apply: st => {
        const S = st.settings;
        if (meetName) S.meetName = meetName;
        if (events.length) S.events = events;
        if (cats.length) S.categories = cats;
        if (clubNames.length) S.clubs = clubNames.map(n => ({ name: n, target: targets[n] || '' }));
        if (lanes.some(Boolean)) S.lanes = lanes;
        S.combined = combined;
        const tv = cell(set, 'T2'), tr = cell(set, 'T3');

        [['L3', 'doorOpen'], ['L5', 'opening'], ['L6', 'start'], ['L12', 'exit']].forEach(([a, k]) => { const v = cell(set, a); if (v !== undefined) sc[k] = clock(v); });

        if (pts.some(v => v !== '')) S.points.ind = pts;
        const fin = cell(set, 'O13'); S.points.indFinish = fin === undefined ? '' : fin;
        const mult = s(cell(set, 'R14')); if (mult) S.points.relayMult = mult.indexOf('1') === 0 ? 1 : 2;
        const ct = (a, d) => { const v = cell(set, a); return v === undefined ? d : s(v); };
        S.cert = { title: ct('F10', S.cert.title), lines: ['F11', 'F12', 'F13', 'F14'].map((a, i) => ct(a, S.cert.lines[i])), date: dateStr(cell(set, 'F15')), organizer: ct('F16', S.cert.organizer), printRecord: s(cell(set, 'F17')) !== '印字しない' };
        S.award = { title: ct('F22', S.award.title), lines: ['F23', 'F24', 'F25', 'F26'].map((a, i) => ct(a, S.award.lines[i])), date: dateStr(cell(set, 'F27')), organizer: ct('F28', S.award.organizer) };
        if (dash) {
          const dv = a => cell(dash, a);
          if (dv('D4') !== undefined) S.dashboard.capacity = dv('D4');
          if (dv('D5') !== undefined) S.dashboard.target = dv('D5');
          if (dv('D12') !== undefined) S.dashboard.price = dv('D12');

        }
        st.entries = entries; st.relays = relays;
        if (schedule.length) st.schedule = schedule;
        const f = fl && s(cell(fl, 'I2')); if (f) ui.flash = f;
      }
    };
  }

  function awardBook(ws) {
    const cats = [];
    for (let r = 14; r <= 21; r++) cats.push({ name: s(cell(ws, 'V' + r)).indexOf('（未設定') === 0 ? '' : s(cell(ws, 'V' + r)), mvp: C.isMark(cell(ws, 'W' + r)), exc: C.isMark(cell(ws, 'X' + r)) });
    const events = [];

      D.rel.map(it => [it.r.team, it.r.mark, it.r.cat, it.r.event].concat(it.members).concat([it.r.entryTime, it.r.officialTime, it.r.judge, it.program, it.heat || '', it.lane || '', it.rank || '', it.points === null ? '' : it.points, it.status]))));
    add('進行スケジュール', [['競技No', '種目名', '参加数', '組数', '所要時間', '開始時刻', '終了時刻', '調整(分)']].concat(
      D.sched.rows.map(o => [o.no, o.name, o.n === undefined ? '' : o.n, o.heats === undefined ? '' : o.heats, o.dur !== undefined ? C.fmtDuration(o.dur) : '', o.start !== null && o.start !== undefined ? C.fmtClock(o.start) : '', o.end !== null && o.end !== undefined ? C.fmtClock(o.end) : '', o.row.adj || ''])));
    const prog = [['プログラム', '組', 'レーン', '氏名／チーム', 'チーム／メンバー', '区分', '公式タイム', '順位']];
    programOptions().forEach(n => { const p = programData(n); p.heats.forEach(h => h.items.forEach(it => prog.push([n, h.heat, it.lane || '', p.relay ? it.teamDisp : it.name, p.relay ? it.memberText : it.club, it.cat, it.flashTime, it.flashRank]))); });
    add('プログラム', prog, [22, 5, 5, 30, 20, 10, 12, 6]);
    const fl = [['種目', '順位', '選手名／泳者', 'クラブ／チーム', '年齢区分', '公式タイム']];

/* ---------------------------------------------------------------- サンプル（架空の選手） */
function makeSample() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const fam = [['佐藤', 'サトウ'], ['鈴木', 'スズキ'], ['高橋', 'タカハシ'], ['田中', 'タナカ'], ['伊藤', 'イトウ'], ['渡辺', 'ワタナベ'], ['山本', 'ヤマモト'], ['中村', 'ナカムラ'], ['小林', 'コバヤシ'], ['加藤', 'カトウ'], ['吉田', 'ヨシダ'], ['山田', 'ヤマダ'], ['松本', 'マツモト'], ['井上', 'イノウエ'], ['木村', 'キムラ'], ['清水', 'シミズ'], ['森', 'モリ'], ['池田', 'イケダ']];
  const boy = [['陽翔', 'ハルト'], ['蓮', 'レン'], ['湊', 'ミナト'], ['蒼', 'アオイ'], ['樹', 'イツキ'], ['悠真', 'ユウマ'], ['大和', 'ヤマト'], ['律', 'リツ'], ['朝陽', 'アサヒ'], ['颯太', 'ソウタ']];
  const girl = [['陽葵', 'ヒマリ'], ['凛', 'リン'], ['結菜', 'ユイナ'], ['芽依', 'メイ'], ['紬', 'ツムギ'], ['澪', 'ミオ'], ['咲良', 'サクラ'], ['杏', 'アン'], ['葵', 'アオイ'], ['心春', 'コハル']];
  const st = C.emptyState(), S = st.settings;
  S.meetName = '（サンプル）第1回 みなと町ジュニアスイムフェスティバル';
  S.clubs = [{ name: 'みなとSC', target: 20 }, { name: 'さくらスイム', target: 15 }, { name: 'あおぞらクラブ', target: 15 }, { name: 'ひかりSS', target: 10 }];
  S.categories = ['6歳以下', '7〜8歳', '9〜10歳', '11〜12歳'];
  S.cert.date = '2026-11-23'; S.award.date = '2026-11-23';
  S.combined = [{ name: '合同 50M 自由形', pairs: [{ event: '男子 50M 自由形', cat: '6歳以下' }, { event: '男子 50M 自由形', cat: '7〜8歳' }, {}] }];
  const ind = ['25M 板キック', '25M 自由形', '25M 背泳ぎ', '25M 平泳ぎ', '25M バタフライ', '50M 自由形'];
  const base = { '25M 板キック': 26, '25M 自由形': 21, '25M 背泳ぎ': 25, '25M 平泳ぎ': 28, '25M バタフライ': 24, '50M 自由形': 45 };
  const catAdj = { '6歳以下': 1.45, '7〜8歳': 1.2, '9〜10歳': 1.0, '11〜12歳': 0.86 };
  const used = new Set();
  for (let i = 0; i < 64; i++) {
    const g = rnd() < 0.5 ? '男子' : '女子';
    const f = pick(fam), n = pick(g === '男子' ? boy : girl);
    const name = f[0] + '　' + n[0] + '　' + f[1] + '　' + n[1];
    if (used.has(name)) continue; used.add(name);
    const club = pick(S.clubs).name, cat = pick(S.categories);
    const evs = []; const k = rnd() < 0.6 ? 2 : 1;
    while (evs.length < k) { const e = pick(ind); if (evs.indexOf(e) < 0 && !(e === '50M 自由形' && cat === '6歳以下' && g === '女子')) evs.push(e); }
    evs.forEach(e => {
      const t = base[e] * catAdj[cat] * (g === '女子' ? 1.06 : 1) * (0.85 + rnd() * 0.35);
      const done = /板キック|自由形/.test(e) && !/50M/.test(e);
      st.entries.push({ id: uid(), name, club, cat, event: g + ' ' + e, entryTime: rnd() < 0.5 ? C.fmtTime(t * (0.97 + rnd() * 0.08)) : '', officialTime: done ? C.fmtTime(t) : '', judge: done && rnd() < 0.04 ? '失格' : '' });
    });
  }
  // 入力ミスの例（入力チェックで見つかります）
  if (st.entries[5]) st.entries[5].officialTime = '１８．３２';
  const mem = () => [0, 1, 2, 3].map(() => { const f = pick(fam), n = pick(rnd() < .5 ? boy : girl); return f[0] + '　' + n[0] + '　' + f[1] + '　' + n[1]; });
  st.relays = [
    { id: uid(), team: 'みなとSC', mark: 'A', cat: '9〜10歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '1:12.40', judge: '' },
    { id: uid(), team: 'さくらスイム', mark: '', cat: '9〜10歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '1:15.08', judge: '' },
    { id: uid(), team: 'あおぞらクラブ', mark: '', cat: '9〜10歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '', judge: '' },
    { id: uid(), team: 'みなとSC', mark: 'B', cat: '11〜12歳', event: '混合 4×25M フリーリレー', members: mem(), entryTime: '', officialTime: '', judge: '' }
  ];
  const order = ['男子 25M 板キック', '女子 25M 板キック', '男子 25M 自由形', '女子 25M 自由形', '男子 25M 背泳ぎ', '女子 25M 背泳ぎ', '休憩', '男子 25M 平泳ぎ', '女子 25M 平泳ぎ', '男子 25M バタフライ', '女子 25M バタフライ', '合同 50M 自由形', '男子 50M 自由形', '女子 50M 自由形', '混合 4×25M フリーリレー'];
  st.schedule = order.map(n => ({ id: uid(), name: n, adj: '' }));
  // 表彰マスタは大会設定に合わせる
  const A = st.award;
  A.cats = A.cats.map((c, i) => ({ name: S.categories[i] || '', mvp: true, exc: true }));
  const bt = { '25M 板キック': [22, 24], '25M 自由形': [18, 20], '25M 背泳ぎ': [21, 22], '25M 平泳ぎ': [23, 25], '25M バタフライ': [19, 21], '50M 自由形': [36.6, 40.7] };
  A.events = ind.map((e, i) => ({ id: 'ae' + (i + 1), name: e, baseM: C.fmtTime(bt[e][0]), baseF: C.fmtTime(bt[e][1]), mvp: true }));
  while (A.events.length < 15) A.events.push({ id: 'ae' + uid(), name: '', baseM: '', baseF: '', mvp: true });
  return st;
}

(function boot() {
  load();
  view = (location.hash || '#home').slice(1) || 'home';
  if (!VIEWS[view]) view = 'home';
  recompute();
  render();
  if (state.entries.length) snapshot('起動時');
  // ホーム画面・デスクトップに追加したアプリとして、オフラインでも開けるようにする
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
