<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3A6E"/>
      <stop offset="0.55" stop-color="#0A5FA8"/>
      <stop offset="1" stop-color="#0E86C9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#pool)"/>
    <!-- 水面のゆらぎ（プール底のライン） -->
    <path d="M0 150 C 90 132, 170 168, 256 150 S 422 132, 512 150" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="10" fill="none"/>
    <!-- コースロープ（赤白の浮き） -->
    <g>
      <rect x="0" y="407" width="512" height="10" fill="#08365F" opacity=".55"/>
      <g fill="#E8343B">
        <circle cx="18" cy="412" r="17"/><circle cx="90" cy="412" r="17"/><circle cx="162" cy="412" r="17"/><circle cx="234" cy="412" r="17"/><circle cx="306" cy="412" r="17"/><circle cx="378" cy="412" r="17"/><circle cx="450" cy="412" r="17"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="54" cy="412" r="17"/><circle cx="126" cy="412" r="17"/><circle cx="198" cy="412" r="17"/><circle cx="270" cy="412" r="17"/><circle cx="342" cy="412" r="17"/><circle cx="414" cy="412" r="17"/><circle cx="486" cy="412" r="17"/>
      </g>
      <g fill="#000000" opacity=".14">
        <rect x="0" y="417" width="512" height="12"/>
      </g>
    </g>
    <!-- 泳者（自由形）: 腕が頭の上を回って前の水面へ -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 276 C 160 264, 214 262, 268 268" stroke-width="42"/>
      <path d="M262 250 C 280 150, 392 128, 438 252" stroke-width="30"/>
    </g>
    <circle cx="318" cy="256" r="32" fill="#FFFFFF"/>
    <!-- 波としぶき -->
    <path d="M60 314 C 100 298, 140 330, 180 314 S 260 298, 300 314 S 380 330, 452 306" stroke="#7FD8FF" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M110 346 C 150 330, 190 362, 230 346 S 310 330, 350 346" stroke="#BDEBFF" stroke-width="10" stroke-linecap="round" fill="none" opacity=".7"/>
    <circle cx="452" cy="278" r="7" fill="#BDEBFF"/><circle cx="470" cy="262" r="5" fill="#BDEBFF" opacity=".8"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>
</svg>
